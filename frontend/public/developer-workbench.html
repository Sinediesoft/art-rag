<!doctype html>
<!--
  ArtRAG 開發者平台：放在 frontend/public，和主介面同源，開 http://localhost:5173/developer-workbench.html
  （開發時 Vite 把 /api 轉給 8000）或 http://localhost:8000/developer-workbench.html（展示模式由後端提供）。
  只呼叫同源的 /api/v1（憑證是主介面同一個 HttpOnly cookie）；連不上（直接雙擊檔案、後端沒啟動）就整頁用 MOCK_DATA。
  有接上的區塊用真的資料；後端還沒有 API 的區塊保留模擬資料，並標「模擬」。
  07 背景工作例外：只讀真的 /jobs，連不上或讀不到就寫原因、給重試，不拿模擬資料充數（假的工作會讓人去取消一個不存在的東西）。
  互動狀態放 STATE、後端回應放 REAL／LD（09 資料流的進度另放 FLOW）。
  字型從 Google Fonts 載入（JetBrains Mono、Noto Sans TC），沒網路時改用系統字型，其他照常。
-->
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multimodal-RAG 開發者平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* =====================================================================
   版面照 demo/flow-command-center：終端機視窗、直角細框、邊框上掛標籤、分段進度條
   顏色照入口介面 frontend/src/styles/entry.css（01 Quiet）：只有一種墨色，綠黃紅只用在狀態；
   指揮台的紫（入口・人）和藍（執行中）都收進墨色，選中、執行中改靠發光和閃爍區分
   ===================================================================== */
:root {
  color-scheme: dark;
  --ground: #090908;
  --bg: #0f0f0e;
  --surface: #151514;
  --surface-2: #1c1b1a;
  --surface-3: #262523;
  --text: #f1efea;
  --text-2: #b7b2aa;
  --text-3: #7c776f;
  --line: #2a2927;
  --line-2: #201f1d;
  --line-3: #3b3936;
  --accent: #f1efea;
  --on-accent: #0f0f0e;
  --glow: rgb(241 239 234 / 0.14);
  --ok: #6fbf8a;
  --warn: #e0b46a;
  --danger: #ff7a6e;
  --code-bg: #1c1b1a;
  --scrim: rgb(0 0 0 / 0.6);
  --shadow-win: 0 30px 80px rgb(0 0 0 / 0.6), 0 0 0 1px rgb(0 0 0 / 0.4);
  --shadow-pop: 0 18px 40px rgb(0 0 0 / 0.45);
  --font-mono: "JetBrains Mono", "Noto Sans TC", "Microsoft JhengHei", ui-monospace, monospace;
  --font-cjk: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --bar-h: 44px;
  --chat-w: 380px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --ground: #efede8;
  --bg: #faf9f7;
  --surface: #ffffff;
  --surface-2: #f2f0ec;
  --surface-3: #e7e4de;
  --text: #161514;
  --text-2: #57534d;
  --text-3: #8a857e;
  --line: #e4e0d9;
  --line-2: #eeebe6;
  --line-3: #cfcac2;
  --accent: #161514;
  --on-accent: #faf9f7;
  --glow: rgb(22 21 20 / 0.1);
  --ok: #3d7a52;
  --warn: #a86a1f;
  --danger: #b0322a;
  --code-bg: #f2f0ec;
  --scrim: rgb(22 21 20 / 0.3);
  --shadow-win: 0 30px 80px rgb(22 21 20 / 0.12), 0 0 0 1px rgb(22 21 20 / 0.04);
  --shadow-pop: 0 18px 40px rgb(22 21 20 / 0.1);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
/* 整頁不捲動，照藝術模組：標題列、對話欄固定，只有右邊的內容區（.term-body）自己捲 */
body {
  overflow: hidden;
  background: var(--ground);
  color: var(--text);
  font: 13px/1.55 var(--font-mono);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage {
  max-width: 1400px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  padding: 16px;
}

/* ---------- 終端機視窗：填滿畫面，標題列固定在上面，下面的兩欄佔掉剩下的高度 ---------- */
.term {
  height: 100%;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  box-shadow: var(--shadow-win);
  overflow: hidden;
}
.term-bar {
  flex: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: var(--bar-h);
  padding: 0 8px 0 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  font-size: 11px;
  color: var(--text-3);
}
/* 左上角照入口介面（frontend/src/styles/entry.css 的 .mark、.brand__name）：「畫」字方框＋品牌名 */
.bar-brand { display: flex; align-items: center; gap: 10px; color: var(--text); }
.mark {
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border: 1px solid var(--text);
  border-radius: 2px;
  font: 500 13px/1 var(--font-cjk);
}
.brand__name { font: 500 14px/1 var(--font-cjk); letter-spacing: 0.08em; text-transform: uppercase; }
.bar-end { display: flex; align-items: center; gap: 2px; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-right: 8px;
  padding: 1px 8px;
  border: 1px solid currentColor;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--warn);
  white-space: nowrap;
}
.pill::before { content: ""; width: 7px; height: 7px; background: currentColor; }
.pill[data-state="live"] { color: var(--ok); }
.pill[data-state="connecting"] { color: var(--text-3); }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  background: none;
  border: 1px solid transparent;
  color: var(--text-2);
  cursor: pointer;
}
.icon-btn:hover, .icon-btn.on { color: var(--text); border-color: var(--line); }
.icon-btn svg { width: 16px; height: 16px; }

.term-body {
  display: grid;
  align-content: start;
  gap: 16px;
  min-height: 0;
  overflow-y: auto;
  padding: 22px 22px 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

/* ---------- 標題 ---------- */
.hero { text-align: center; display: grid; gap: 6px; }
.hero h1 {
  margin: 0;
  font-family: var(--font-cjk);
  font-weight: 700;
  font-size: clamp(22px, 2.6vw, 30px);
  letter-spacing: 0.01em;
  line-height: 1.2;
  text-wrap: balance;
  background: linear-gradient(90deg, var(--text), var(--text-3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 14px var(--glow));
}
.hero p { margin: 0; font-family: var(--font-cjk); color: var(--text-2); font-size: 13px; }
.rule { height: 4px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line-2); }

/* ---------- 八個頁面的分頁（取代原本的左側欄）：黏在內容區最上面，捲到哪都切得到 ---------- */
.views {
  position: sticky;
  /* 黏的位置算在 .term-body 的 padding 內側；扣掉上方 22px padding 才會貼齊內容區頂端 */
  top: -22px;
  z-index: 15;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: -8px -22px 0;
  padding: 8px 22px;
  background: var(--bg);
}
.tab, .btn {
  background: transparent;
  border: 1px solid var(--line);
  padding: 5px 10px;
  cursor: pointer;
  color: var(--text-2);
  font-size: 12px;
  line-height: 1.5;
}
.tab b { color: var(--text-3); font-weight: 500; margin-right: 6px; }
.tab:hover, .btn:hover { border-color: var(--line-3); color: var(--text); }
.tab[aria-selected="true"], .tabs .btn.on {
  border-color: var(--accent);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--glow), 0 0 16px var(--glow);
}
.tab[aria-selected="true"] b { color: var(--text); }
.cnt { margin-left: 6px; padding: 0 5px; border: 1px solid var(--warn); color: var(--warn); font-size: 10px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { opacity: 0.88; color: var(--on-accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

/* ---------- 頁面骨架 ---------- */
main { min-width: 0; }
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.head h2 { margin: 0; font: 700 16px/1.3 var(--font-cjk); }
.head h2::before { content: "▸"; margin-right: 8px; color: var(--text-3); font-family: var(--font-mono); }
.sp { flex: 1; }
.muted { color: var(--text-3); font-size: 12px; }
.grid { display: grid; gap: 16px 14px; margin-bottom: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.row > h3 { font: 700 14px/1.4 var(--font-mono); color: var(--text); }
label { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; }

/* ---------- 卡片：照指揮台「邊框上掛標籤」，第一個 h3 壓在上框線 ---------- */
.card {
  position: relative;
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 12px 14px;
}
.card:has(> h3:first-child) { padding-top: 20px; }
/* 13px 的標籤往上凸約 10px，控制列下面的 10px 間距不夠 */
.row + :is(.grid, .card, #retBody) { margin-top: 10px; }
main > .card { margin-bottom: 16px; }
.card h3 { margin: 14px 0 6px; font: 500 12px/1.5 var(--font-cjk); color: var(--text-2); letter-spacing: 0.04em; }
/* 標籤橫跨框線：上半截接視窗底色、下半截接卡片底色，框線才像從標籤兩側穿過 */
.card > h3:first-child {
  position: absolute;
  top: -0.75em;
  left: 12px;
  max-width: calc(100% - 24px);
  margin: 0;
  padding: 0 6px;
  background: linear-gradient(var(--bg) 50%, var(--surface) 50%);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card .card > h3:first-child { background: var(--surface); }
/* 詳情卡的標題是那一筆的名稱，和請求追蹤、背景工作詳情的編號（.row > h3）一樣大 */
.card > h3.title:first-child { font: 700 14px/1.5 var(--font-mono); color: var(--text); }

/* ---------- 數字格（照指揮台上方那排） ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { border: 1px solid var(--c, var(--line)); padding: 6px 12px 8px; min-width: 0; }
.stat small { display: block; font-size: 10.5px; letter-spacing: 0.1em; color: var(--text-3); }
.stat strong {
  display: block;
  font-size: 20px;
  font-weight: 700;
  color: var(--c, var(--text));
  font-variant-numeric: tabular-nums;
}

/* ---------- 表格 ---------- */
.tw { overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
th { color: var(--text-3); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; border-bottom-color: var(--line); }
tr.click { cursor: pointer; }
tr.click:hover, tr.sel { background: var(--surface-2); }
tr.sel > td:first-child { box-shadow: inset 2px 0 0 var(--accent); }

/* ---------- 狀態徽章：照指揮台的描邊小方塊，顏色只分通過／提醒／擋下／執行中 ---------- */
.b {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 6px;
  border: 1px solid currentColor;
  font-size: 10.5px;
  font-weight: 500;
  line-height: 1.6;
  letter-spacing: 0.04em;
  color: var(--text-3);
  white-space: nowrap;
}
.b::before { content: ""; width: 5px; height: 5px; background: currentColor; }
.b.ok, .b.success, .b.done, .b.up { color: var(--ok); }
.b.warn, .b.nodata, .b.fallback, .b.degraded, .b.queued, .b.stale { color: var(--warn); }
.b.bad, .b.blocked, .b.error, .b.failed, .b.down, .b.block { color: var(--danger); }
.b.running, .b.info { color: var(--text); }
.b.running::before { animation: blink 1s steps(1) infinite; }
/* 接上後端時，還沒有 API、仍是模擬資料的區塊：虛線框，和真的狀態徽章分得開 */
.b.mock { border-style: dashed; color: var(--warn); }
.b.mock::before { display: none; }
/* 請求追蹤清單分藝術、工廠兩組，點標題列收合 */
.tr-group + .tr-group { margin-top: 12px; }
.tr-group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 4px;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  font: 600 13px/1.5 var(--font-cjk);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.tr-group-head:hover { background: var(--surface-2); }
.tr-group-head .caret { color: var(--text-3); transition: rotate 0.15s; }
.tr-group.folded .tr-group-head .caret { rotate: -90deg; }
/* 06 照片建檔：欄位直接在頁面上改（主介面是跳出的表單） */
.if-photo { display: block; }
.if-photo img { display: block; width: 100%; max-height: 420px; object-fit: contain; background: var(--surface-2); }
.if-stages, .if-checks { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 4px; font-size: 12.5px; }
.if-stages li { display: flex; gap: 8px; color: var(--text-2); }
.if-stages li::before { content: "·"; width: 1em; flex: none; color: var(--text-3); }
.if-stages li.done::before { content: "✓"; color: var(--ok); }
.if-stages li.run::before { content: "▸"; color: var(--text); animation: blink 1s steps(1) infinite; }
.if-stages li.fail::before { content: "✕"; color: var(--danger); }
fieldset.if-group { margin: 0 0 12px; padding: 0; border: 0; }
fieldset.if-group legend { margin-bottom: 6px; padding: 0; font: 600 13px/1.5 var(--font-cjk); color: var(--text); }
.if-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
label.if-field { display: flex; flex-direction: column; align-items: stretch; gap: 3px; min-width: 0; }
.if-field.wide { grid-column: 1 / -1; }
.if-field .bad { border-color: var(--danger); }
.if-field .msg { font-size: 11.5px; color: var(--danger); }
.if-field .note { font-size: 11.5px; color: var(--warn); }
.if-state { margin: 10px 0; font-weight: 600; }
.if-state.ok { color: var(--ok); }
.if-state.run { color: var(--text); animation: blink 1.6s steps(1) infinite; }
/* 07 背景工作：事件清單照 09 資料流的事件紀錄，自己捲動；新事件接在後面，不整份重畫 */
.jb-log {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  max-height: 20em;
  overflow-y: auto;
  display: grid;
  align-content: start;
  gap: 3px;
  font-size: 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.jb-log li { display: grid; grid-template-columns: 8ch 5ch 16ch minmax(0, 1fr); gap: 8px; line-height: 1.45; }
.jb-log time, .jb-log .seq { color: var(--text-3); font-variant-numeric: tabular-nums; }
.jb-log .type { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jb-log li[data-kind="ok"] .type { color: var(--ok); }
.jb-log li[data-kind="warn"] .type { color: var(--warn); }
.jb-log li[data-kind="bad"] :is(.type, .what) { color: var(--danger); }
.jb-log .what { font-family: var(--font-cjk); overflow-wrap: anywhere; }
.jb-log li.empty { display: block; color: var(--text-3); font-family: var(--font-cjk); }
.jb-msg { margin: 8px 0; font-family: var(--font-cjk); }
.jb-msg.ok { color: var(--ok); }
.jb-msg.warn { color: var(--warn); }
.jb-msg.bad { color: var(--danger); }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- 表單 ---------- */
input, select, textarea {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 5px 8px;
  font-size: 12.5px;
}
input[type="range"], input[type="checkbox"] { accent-color: var(--accent); padding: 0; vertical-align: middle; }
textarea { width: 100%; min-height: 150px; resize: vertical; font-size: 12px; line-height: 1.55; }
pre {
  margin: 6px 0;
  padding: 10px 12px;
  background: var(--code-bg);
  border: 1px solid var(--line-2);
  border-left: 2px solid var(--line-3);
  white-space: pre-wrap;
  word-break: break-word;
  font: 12px/1.55 var(--font-mono);
  max-height: 280px;
  overflow: auto;
}
ul { margin: 4px 0 8px; padding-left: 18px; }
li::marker { color: var(--text-3); }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 10px; font-size: 12.5px; }
.kv b { color: var(--text-3); font-weight: 500; }
.kv span { min-width: 0; overflow-wrap: anywhere; }
a.lnk {
  color: var(--text);
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--line-3);
  text-underline-offset: 3px;
}
a.lnk:hover { text-decoration-color: var(--text); }

/* ---------- 進度條：指揮台的分段條，一格 6px、間隔 2px ---------- */
.bar, .prog { height: 10px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 8px); }
.bar i, .prog i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 8px); }
.prog { margin: 10px 0 2px; }
.prog i { transition: width 0.15s; }

/* ---------- 七階段瀑布圖 ---------- */
.wf { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 12px; margin: 4px 0; }
.wf > span:first-child { font-family: var(--font-cjk); }
.wf .tr { position: relative; height: 12px; background: var(--line-2); }
.wf .tr i { position: absolute; top: 0; bottom: 0; min-width: 3px; }

/* ---------- 檢索候選 ---------- */
.cand { border: 1px solid var(--line); padding: 8px 10px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
.cand:hover { border-color: var(--line-3); }
.cand.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--glow), 0 0 14px var(--glow); }
.cand.out { opacity: 0.5; }

/* ---------- 開發助理：照藝術模組的對話欄（標題、說明、對話、輸入框），一樣放左側 ---------- */
/* 欄寬分兩層：--chat-w 是拖出來的寬度（JS 寫在 .term-main 上），--chat-col 是實際欄寬：
   最多佔 45%，瀏覽器放大、視窗變窄時內容區才不會被擠扁；收合時換成窄條但保留拖好的寬度 */
.term-main {
  --chat-col: min(var(--chat-w), 45%);
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: var(--chat-col) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
}
.term-main.is-collapsed { --chat-col: 44px; }
.term-main > .term-body { min-width: 0; }
.chat {
  position: relative;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  border-right: 1px solid var(--line);
  background: var(--bg);
}
.chat-head { display: flex; align-items: flex-start; gap: 8px; padding: 22px 12px 14px 20px; border-bottom: 1px solid var(--line-2); }
.chat-head-text { flex: 1; min-width: 0; }
.chat-toggle { flex: none; margin-top: -6px; }
/* 右邊框的拖曳把手：照藝術模組的 .msplit（拖曳、雙擊回預設、← → 微調） */
.chat-resize { position: absolute; top: 0; right: -4px; z-index: 5; width: 8px; height: 100%; cursor: col-resize; }
.chat-resize::after { content: ""; position: absolute; inset: 0 3px; transition: background-color 0.15s; }
.chat-resize:hover::after, .chat-resize:focus-visible::after, .is-resizing .chat-resize::after { background: var(--line-3); }
.chat-resize:focus-visible { outline: none; }
.is-resizing { cursor: col-resize; user-select: none; }
.term-main.is-collapsed .chat { grid-template-rows: auto; }
.term-main.is-collapsed .chat-head { justify-content: center; padding: 10px 6px; border-bottom: 0; }
.term-main.is-collapsed .chat-toggle { margin-top: 0; }
.term-main.is-collapsed :is(.chat-head-text, .chat-thread, .chat-dock, .chat-resize) { display: none; }
.chat-title { margin: 0 0 2px; font: 700 16px/1.3 var(--font-cjk); }
/* 窄螢幕「對話｜工作台」切換：照藝術模組窄於 900px 時的 .mtabs */
.panes { display: none; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.chat-by { margin: 0; font: 12px/1.5 var(--font-cjk); color: var(--text-2); }
.chat-thread {
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.chat-hint { margin: 0; font: 12.5px/1.6 var(--font-cjk); color: var(--text-3); }
.chat-sugs { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.chat-sugs .btn { font-family: var(--font-cjk); text-align: left; }
.msg { display: grid; gap: 4px; font: 13px/1.6 var(--font-cjk); }
.msg-who { font: 500 10px/1.4 var(--font-mono); letter-spacing: 0.16em; color: var(--text-3); }
.msg p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg ul { margin: 4px 0 0; }
.msg-user { justify-items: end; }
.msg-user p { max-width: 85%; padding: 7px 11px; background: var(--surface-2); border: 1px solid var(--line); }
.thinking::after {
  content: "";
  display: inline-block;
  width: 0.55em;
  height: 1.05em;
  vertical-align: -2px;
  background: var(--text-2);
  animation: blink 1s steps(1) infinite;
}
.chat-dock { padding: 10px 20px 16px; border-top: 1px solid var(--line-2); }
.chat-input { display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 10px; border: 1px solid var(--line); background: var(--surface); }
.chat-input:focus-within { border-color: var(--accent); }
.chat-input textarea {
  flex: 1;
  width: auto;
  min-height: 0;
  max-height: 120px;
  padding: 4px 0;
  border: 0;
  background: transparent;
  resize: none;
  font: 13px/1.5 var(--font-cjk);
}
/* 外框的 :focus-within 已經標出焦點，輸入框本身不再畫一圈 */
.chat-input textarea:focus-visible { outline: none; }
.chat-send {
  flex: none;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
}
.chat-send svg { width: 15px; height: 15px; }
.chat-send:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---------- 提示與對話框 ---------- */
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
.toast {
  max-width: 340px;
  padding: 9px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  box-shadow: var(--shadow-pop);
  font: 12.5px/1.5 var(--font-cjk);
}
#dlg { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px; background: var(--scrim); }
#dlg.open { display: flex; }
#dlg .box {
  width: min(640px, 100%);
  max-height: 85vh;
  overflow: auto;
  padding: 18px;
  background: var(--bg);
  border: 1px solid var(--line-3);
  border-radius: 10px;
  box-shadow: var(--shadow-win);
}
#dlg h3 { margin: 0 0 12px; font: 700 14px/1.4 var(--font-cjk); }

/* ---------- 09 資料流：照 demo/flow-command-center 的入口 → 四條線 × 三張卡 → 落點；顏色收進墨色 ---------- */
/* 內容區寬度跟著對話欄拖寬、收合而變，用容器查詢判斷版面，不看整個視窗 */
.fl { container-type: inline-size; --fl-gap: 10px; }
.fl-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 10px; }
.fl-bar .tabs { margin: 0; }
.fl-bar .btn b { color: var(--text-3); font-weight: 500; margin-right: 4px; }
.fl-bar .btn.on b { color: var(--text); }
/* 執行列的外框沿用對話欄的 .chat-input；附圖只在本機產生縮圖，不上傳 */
.fl-run { align-items: center; margin-bottom: 12px; }
.fl-run .btn { flex: none; }
.fl-run-img { display: flex; align-items: center; gap: 6px; max-width: 40%; font-size: 11px; color: var(--text-2); }
.fl-run-img:empty { display: none; }
.fl-run-img img { flex: none; width: 32px; height: 32px; object-fit: cover; border: 1px solid var(--line); }
.fl-run-img span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-run-img button { flex: none; padding: 0 4px; border: 0; background: transparent; color: var(--text-3); cursor: pointer; }
.fl-run-img button:hover { color: var(--text); }
.fl-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 14px; }
.stats.fl-stats { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.fl-stats .stat strong { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-board { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 16px; }

.fl-path { margin: 0 0 10px; }
.fl-journey ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.fl-journey li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; font: 12.5px/1.45 var(--font-cjk); color: var(--text-3); }
.fl-journey li::before { content: ""; width: 8px; height: 8px; margin-top: 5px; border: 1px solid var(--text-3); border-radius: 50%; }
.fl-journey li[data-state="now"] { color: var(--text); }
.fl-journey li[data-state="now"]::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.fl-journey li[data-state="done"] { color: var(--text-2); }
.fl-journey li[data-state="done"]::before { border-color: var(--ok); background: var(--ok); }
.fl-foot { grid-template-columns: 5em minmax(0, 1fr); margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line-2); font-size: 11.5px; }

.fl-flow { display: grid; gap: 10px; min-width: 0; }
.fl-entry {
  justify-self: center;
  width: min(440px, 100%);
  display: grid;
  gap: 6px;
  padding: 10px 14px 12px;
  border: 1px solid var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 1px var(--glow), 0 0 22px var(--glow);
}
.fl-entry-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fl-entry-head b { font-size: 14px; }
.fl-entry-head span { color: var(--text-2); font-family: var(--font-cjk); }
.fl-entry-head em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--text-3); }
.fl-ask { margin: 0; font-family: var(--font-cjk); color: var(--text-2); overflow-wrap: anywhere; }
.fl-entry-line { margin: 0; min-height: 1.5em; overflow-wrap: anywhere; }
.fl-cursor { display: inline-block; width: 0.55em; height: 1.05em; margin-left: 2px; vertical-align: -2px; background: var(--text); animation: blink 1s steps(1) infinite; }
.fl-caption, .fl-report { text-align: center; font: 11px/1.5 var(--font-cjk); color: var(--text-3); }

/* 四條線：上方虛線從入口分出去接到每條線，跟指揮台一樣 */
.fl-lanes { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--fl-gap); padding-top: 26px; }
.fl-lanes::before { content: ""; position: absolute; top: 8px; left: calc((100% - 3 * var(--fl-gap)) / 8); right: calc((100% - 3 * var(--fl-gap)) / 8); border-top: 1px dashed var(--line-3); }
.fl-lanes::after { content: ""; position: absolute; top: -8px; left: 50%; height: 16px; border-left: 1px dashed var(--line-3); }
.fl-lane { position: relative; display: grid; gap: 8px; align-content: start; min-width: 0; }
.fl-lane::before { content: ""; position: absolute; top: -18px; left: 50%; height: 12px; border-left: 1px dashed var(--line-3); }
.fl-lane-head { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--text-2); white-space: nowrap; }
.fl-lane-head span { overflow: hidden; text-overflow: ellipsis; }
.fl-lane-head em { font-style: normal; color: var(--text-3); }
.fl-lane-head b { font-weight: 500; color: var(--text-3); font-variant-numeric: tabular-nums; }
.fl-lane[data-done="true"] .fl-lane-head b { color: var(--ok); }

.fl-card {
  --c: var(--line);
  display: grid;
  gap: 3px;
  min-width: 0;
  padding: 7px 9px 8px;
  border: 1px solid var(--c);
  background: var(--surface);
  transition: border-color 0.25s, box-shadow 0.25s;
}
.fl-card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 10px; color: var(--text-3); white-space: nowrap; }
.fl-card-top > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.fl-card h4 { margin: 0; font: 700 13px/1.3 var(--font-mono); color: var(--text-2); }
.fl-where { margin: 0; font-size: 10.5px; color: var(--text-3); overflow-wrap: anywhere; }
.fl-note { margin: 0; min-height: 2.9em; font: 11px/1.4 var(--font-cjk); color: var(--text-3); overflow-wrap: anywhere; }
.fl-card-foot { display: flex; justify-content: space-between; align-items: end; gap: 6px; font-size: 10px; color: var(--text-3); }
.fl-spark { display: flex; align-items: end; gap: 2px; height: 14px; }
.fl-spark i { display: block; width: 3px; height: var(--h); background: var(--c); opacity: 0.35; transform-origin: bottom; }
.fl-card-bar { height: 2px; background: var(--line-2); overflow: hidden; }
.fl-card-bar i { display: block; height: 100%; width: 0; background: var(--c); }
.fl-card[data-state="run"] { --c: var(--accent); box-shadow: 0 0 0 1px var(--glow), 0 0 16px var(--glow); }
.fl-card[data-state="done"] { --c: var(--ok); }
.fl-card[data-state="hold"] { --c: var(--warn); animation: fl-pulse 1.2s ease-in-out infinite; }
.fl-card[data-state="block"] { --c: var(--danger); animation: fl-pulse 0.8s ease-in-out infinite; }
.fl-card:not([data-state="queued"]) h4 { color: var(--text); }
.fl-card:not([data-state="queued"]) .fl-note { color: var(--text-2); }
.fl-card:not([data-state="queued"]) .fl-spark i { opacity: 0.85; }
.fl-card[data-state="run"] .fl-spark i { animation: fl-jitter 0.9s ease-in-out infinite; animation-delay: var(--d); }
.fl-card[data-state="run"] .fl-card-bar i { width: 72%; transition: width 1.4s ease-out; }
.fl-card:is([data-state="hold"], [data-state="block"]) .fl-card-bar i { width: 72%; }
.fl-card[data-state="done"] .fl-card-bar i { width: 100%; transition: width 0.3s; }
@keyframes fl-jitter { 50% { transform: scaleY(0.4); } }
@keyframes fl-pulse { 50% { box-shadow: 0 0 0 1px var(--c), 0 0 14px color-mix(in srgb, var(--c) 45%, transparent); } }

.fl-report { margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line-3); }
.fl-report::after { content: ""; display: block; width: 0; height: 12px; margin: 4px auto 0; border-left: 1px dashed var(--line-3); }
.fl-output {
  justify-self: center;
  width: min(440px, 100%);
  display: grid;
  gap: 4px;
  padding: 10px 14px 12px;
  border: 1px solid var(--line-3);
  transition: border-color 0.3s, box-shadow 0.3s;
}
.fl-output-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.fl-output-head span { font-size: 11px; color: var(--text-3); }
.fl-output-head strong { font: 700 13px/1.4 var(--font-cjk); color: var(--text-2); }
.fl-output p { margin: 0; font: 12px/1.5 var(--font-cjk); color: var(--text-3); overflow-wrap: anywhere; }
.fl-output[data-state="run"] { border-color: var(--accent); box-shadow: 0 0 16px var(--glow); }
.fl-output[data-state="done"] { border-color: var(--ok); }
.fl-output:not([data-state="idle"]) strong { color: var(--text); }
.fl-output[data-state="run"] p { color: var(--text); }
.fl-output[data-state="done"] p { color: var(--ok); }
.fl-output[data-state="block"] { border-color: var(--danger); }
.fl-output[data-state="block"] p { color: var(--danger); }

.fl-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
.fl-chips span { padding: 1px 7px; border: 1px solid var(--line); font-size: 11px; color: var(--text-3); white-space: nowrap; transition: color 0.2s, border-color 0.2s; }
.fl-chips span[data-on] { border-color: var(--ok); color: var(--ok); }
.fl-chips i { font-style: normal; font-size: 10px; color: var(--text-3); }
.fl-progress { display: grid; grid-template-columns: auto minmax(0, 1fr) 4ch; align-items: center; gap: 10px; }
.fl-progress > span { font: 700 12px/1.5 var(--font-cjk); }
.fl-progress .prog { margin: 0; }
.fl-progress b { text-align: right; font-variant-numeric: tabular-nums; }
.fl-progress[data-done="true"] b { color: var(--ok); }
.fl-progress[data-done="true"] .prog i { background: repeating-linear-gradient(90deg, var(--ok) 0 6px, transparent 6px 8px); }

.fl-log ol {
  list-style: none;
  margin: 0;
  padding: 0;
  height: 12.5em;
  overflow-y: auto;
  display: grid;
  align-content: start;
  gap: 3px;
  font-size: 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.fl-log li { display: grid; grid-template-columns: 7ch 8ch minmax(0, 1fr); gap: 10px; line-height: 1.45; }
.fl-log time { color: var(--text-3); font-variant-numeric: tabular-nums; }
.fl-log .who { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-log li[data-kind="human"] .who { color: var(--text); font-weight: 700; }
.fl-log li[data-kind="hold"] .who { color: var(--warn); }
.fl-log li[data-kind="block"] .who { color: var(--danger); }
.fl-log li[data-kind="final"] :is(.who, .what) { color: var(--ok); }
.fl-log .what { font-family: var(--font-cjk); overflow-wrap: anywhere; }
.fl-log li.empty { display: block; color: var(--text-3); font-family: var(--font-cjk); }

@container (max-width: 820px) {
  .fl-board { grid-template-columns: minmax(0, 1fr); }
  .fl-journey ol { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .stats.fl-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .fl .g2 { grid-template-columns: minmax(0, 1fr); }
}
@container (max-width: 600px) {
  .fl-lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-top: 0; row-gap: 18px; }
  .fl-lanes::before, .fl-lanes::after, .fl-lane::before { display: none; }
  .stats.fl-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@container (max-width: 380px) {
  .fl-lanes { grid-template-columns: minmax(0, 1fr); }
  .fl-log li { grid-template-columns: 7ch minmax(0, 1fr); }
  .fl-log .what { grid-column: 1 / -1; }
}

/* ---------- 窄螢幕 ---------- */
@media (max-width: 900px) {
  .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 800px) {
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wf { grid-template-columns: 100px minmax(0, 1fr) 54px; }
}
@media (max-width: 760px) {
  .term-body { padding: 18px 14px 16px; }
  /* 390px 寬時品牌名會把「切換成主管」和明暗按鈕擠出頁首，只留「畫」字方框 */
  .brand__name { display: none; }
  /* 手機上八個分頁會換成好幾行，黏住會吃掉半個畫面 */
  .views { position: static; margin: 0; padding: 0; }
  /* 放不下兩欄：上方切換「對話｜工作台」，一次只顯示一邊；不能拖寬、不用收合 */
  .term-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .panes { display: flex; }
  .term-main[data-pane="work"] .chat, .term-main[data-pane="chat"] .term-body { display: none; }
  .chat { border-right: 0; }
  .chat-resize, .chat-toggle { display: none; }
  /* 寬螢幕時收合過再縮窄，對話欄要恢復完整 */
  .term-main.is-collapsed .chat { grid-template-rows: auto minmax(0, 1fr) auto; }
  .term-main.is-collapsed .chat-head { justify-content: flex-start; padding: 22px 12px 14px 20px; border-bottom: 1px solid var(--line-2); }
  .term-main.is-collapsed .chat-head-text, .term-main.is-collapsed .chat-dock { display: block; }
  .term-main.is-collapsed .chat-thread { display: flex; }
}
@media (max-width: 460px) {
  #toasts { left: 16px; }
  .toast { max-width: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="term">
    <header class="term-bar">
      <div class="bar-brand"><span class="mark" aria-hidden="true">畫</span><span class="brand__name">Multimodal-RAG</span></div>
      <div class="bar-end">
        <button class="btn" id="liveSwitch" type="button" data-act="liveSwitch" hidden>切換成主管</button>
        <span class="pill" id="livePill" data-state="connecting">連線中…</span>
        <button class="icon-btn" id="themeBtn" type="button" data-act="theme"></button>
      </div>
    </header>
    <div class="term-main" data-pane="work">
      <div class="panes" role="tablist" aria-label="切換對話與工作台">
        <button type="button" class="tab" role="tab" id="paneChat" data-act="pane" data-arg="chat" aria-selected="false">對話</button>
        <button type="button" class="tab" role="tab" id="paneWork" data-act="pane" data-arg="work" aria-selected="true">工作台</button>
      </div>
      <aside class="chat" aria-label="開發助理">
        <header class="chat-head">
          <div class="chat-head-text">
            <h2 class="chat-title">開發助理</h2>
            <p class="chat-by">問請求、背景工作或今天的異常；只讀這頁的模擬資料</p>
          </div>
          <button class="icon-btn chat-toggle" id="chatToggle" type="button" data-act="chatToggle" aria-expanded="true" title="收合對話欄" aria-label="收合對話欄"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5h16v14H4zM9.5 5v14" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </header>
        <div class="chat-thread" id="chatThread" aria-live="polite"></div>
        <form class="chat-dock" id="chatForm">
          <div class="chat-input">
            <textarea id="chatInput" rows="2" placeholder="例如：R-1023-009 為什麼失敗？" aria-label="問開發助理"></textarea>
            <button class="chat-send" id="chatSend" type="submit" title="送出（Enter）" aria-label="送出"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </form>
        <div class="chat-resize" id="chatResize" role="separator" aria-orientation="vertical" aria-label="調整對話欄寬度（雙擊回到 380px）" aria-valuemin="280" aria-valuemax="640" aria-valuenow="380" tabindex="0" title="拖曳調整寬度・雙擊回到預設"></div>
      </aside>
      <div class="term-body">
        <div class="hero">
          <h1>Multimodal-RAG Workbench</h1>
          <p id="heroSub">開發者平台・連線中…</p>
        </div>
        <div class="rule" aria-hidden="true"></div>
        <nav class="views" id="nav" role="tablist" aria-label="頁面"></nav>
        <main id="main"></main>
      </div>
    </div>
  </div>
</div>
<div id="dlg" role="dialog" aria-modal="true"><div class="box" id="dlgBox"></div></div>

const stat=(label,v,c)=>`<div class="stat"${c?` style="--c:var(--${c})"`:''}><small>${label}</small><strong>${v}</strong></div>`;
const pad2=v=>String(v).padStart(2,'0');
const hms=iso=>{const d=iso?new Date(iso):new Date();return isNaN(d)?String(iso??''):`${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`};
const ymdhm=iso=>{const d=new Date(iso);return isNaN(d)?String(iso??''):`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const fmtMs=v=>v==null?'—':v>=1000?(v/1000).toFixed(2)+' s':Math.round(v)+' ms';
const clip=(s,n)=>{s=String(s??'');return s.length>n?s.slice(0,n)+'…':s};
const shortId=id=>String(id??'').slice(0,8);
function dur(from,to){
  if(!from)return '—';
  const s=Math.max(0,Math.round(((to?new Date(to):new Date())-new Date(from))/1000));
  return s<60?s+'s':`${Math.floor(s/60)}m${pad2(s%60)}s`;
}

// diagnostics 只開給主管，不是主管時後端回 403：這是權限、不是沒有 API，所以寫原因，不拿模擬資料充數
function diagWhy(){
  const e=REAL_ERR.diag;
  if(e?.status===403)return `要主管身分才看得到（GET /admin/diagnostics 回 403）${LIVE.demo?'，按頁首「切換成主管」':''}`;
  return `GET /admin/diagnostics 讀不到：${e?`${e.message}（${e.code}）`:'沒有讀到資料'}`;
}

class ApiErr extends Error{constructor(code,message,status){super(message);this.code=code;this.status=status}}
// 和主介面 frontend/src/api/http.ts 相同：憑證過期或後端重啟換了金鑰，向 /auth/accounts 重新取得（預設一般員工）再重送一次；
// 簽章不符（TOKEN_INVALID）不重送，那是被竄改的憑證
const RENEWABLE=new Set(['UNAUTHENTICATED','TOKEN_EXPIRED','TOKEN_STALE']);
async function apiFetch(path,init={},retried=false){
  let res;
  try{res=await fetch(API_BASE+path,init)}catch(e){if(e.name==='AbortError')throw e;throw new ApiErr('NETWORK_ERROR','連不上後端',0)}
  if(res.status===401&&!retried&&!path.startsWith('/auth/')){
    const body=await res.clone().json().catch(()=>null);
    if(RENEWABLE.has(body?.error?.code)){
      const acc=await fetch(API_BASE+'/auth/accounts').then(r=>r.ok?r.json():null).catch(()=>null);
      liveFollow(acc);
      return apiFetch(path,init,true);
    }
  }
  return res;
}
async function apiError(res){const b=await res.json().catch(()=>null);return new ApiErr(b?.error?.code||'HTTP_'+res.status,b?.error?.message||res.statusText,res.status)}
async function api(path,init){
  const res=await apiFetch(path,init);
  if(!res.ok)throw await apiError(res);
  return res.json();
}
const postJson=body=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
// EventSource 只支援 GET，/chat 是 POST，所以用 fetch 讀串流；事件格式見 shared/sse_events.md
async function apiStream(path,body,onEvent,signal){
  const res=await apiFetch(path,{...postJson(body),signal});
  if(!res.ok)throw await apiError(res);
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const {value,done}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n\n'))>=0){
      const block=buf.slice(0,i);buf=buf.slice(i+2);
      let ev='message',data='';
      for(const line of block.split('\n')){if(line.startsWith('event:'))ev=line.slice(6).trim();else if(line.startsWith('data:'))data+=line.slice(5).trim()}
      if(data)onEvent(ev,JSON.parse(data));
    }
  }
}

const LIVE_SOURCES={status:'/status',memory:'/memory',diag:'/admin/diagnostics',sec:'/security/logs?limit=50',audit:'/audit?limit=50',evalRuns:'/eval/runs',artworks:'/artworks',parts:'/parts'};
async function liveLoad(){
  const gen=LIVE.gen,keys=Object.keys(LIVE_SOURCES);
  // 目前身分一起讀：別的分頁在主介面換了身分不會有 401，按「重新整理」時要對得出來
  const [acc,...res]=await Promise.allSettled([api('/auth/accounts'),...keys.map(k=>api(LIVE_SOURCES[k]))]);
  // 等回應時換了身分：這批有些是用舊身分讀到的，整批丟掉（換身分時已經另外重讀）
  if(gen!==LIVE.gen)return;
  const changed=liveFollow(acc.value);if(changed)return changed;
  keys.forEach((k,i)=>{if(res[i].status==='fulfilled'){REAL[k]=res[i].value;delete REAL_ERR[k]}else{delete REAL[k];REAL_ERR[k]=res[i].reason}});
  Object.assign(LIVE,{state:'live',loadedAt:ymdhm(new Date())+':'+pad2(new Date().getSeconds())});
  STATE.kb.detail={};
  liveAdapt();renderLive();render();
}
// /auth/accounts 回的目前身分和頁首不同（憑證過期換發成預設身分、別的分頁在主介面切換）：跟著換，
// 上一個身分讀到的資料全部撤下再重讀（和頁首切換走同一條路）。身分沒換回 null
function liveFollow(acc){
  if(!acc?.current||!LIVE.account||acc.current.id===LIVE.account.id)return null;
  Object.assign(LIVE,{account:acc.current,accounts:acc.accounts});
  return liveAccountChanged();
}
// 身分 cookie 和主介面共用，在別的分頁切換不會讓這頁收到 401：照主介面（frontend/src/api/hooks.ts 的 useScope）每 10 秒對一次，
// 分頁在背景時不讀、切回來時馬上對；只讀 /auth/accounts，身分沒換就不重讀其他來源
const LIVE_CFG={recheckMs:10000};
async function liveRecheck(){
  if(!isLive()||document.hidden)return;
  const gen=LIVE.gen,acc=await api('/auth/accounts').catch(()=>null);
  if(gen===LIVE.gen)liveFollow(acc);
}
function liveRecheckLoop(){setTimeout(()=>liveRecheck().finally(liveRecheckLoop),LIVE_CFG.recheckMs)}
document.addEventListener('visibilitychange',liveRecheck);
// 身分換了（頁首切換、憑證過期換發成預設身分、別的分頁切換）：不撤下的話，主管才看得到的 diagnostics、請求紀錄、搜尋與問答結果
// 會留在一般員工的畫面上（isReal 只看有沒有資料、不看身分）。先清掉、立刻重畫，再用新身分重讀；
// gen 加一（檢索除錯是 textSeq／imgSeq 加一），換身分前送出、晚到的回應就不會寫進來
function liveAccountChanged(){
  LIVE.gen++;
  for(const o of [REAL,REAL_ERR,LD])for(const k of Object.keys(o))delete o[k];
  const r=STATE.ret;
  STATE.kb.detail={};Object.assign(r,{textRes:null,imgRes:null,busy:false,textSeq:r.textSeq+1,imgSeq:r.imgSeq+1});
  CMP.ctl?.abort();Object.assign(CMP,{run:CMP.run+1,ctl:null,req:null,cols:{}});
  // 真的在跑的那一輪停掉；playing 也要關，不然重畫時 flowSchedule 會接著播模擬情境，頁首卻寫已連線
  if(FLOW.live){flowReset(FLOW.idx);FLOW.playing=false}
  intakeAccountChanged();
  jobsAccountChanged();renderLive();render();
  intakeResume(true);
  return liveLoad();
}
const SEC_STAGE={1:'第 1 段 授權',2:'第 2 段 輸入防護',4:'第 4 段 段落驗證',7:'第 7 段 輸出檢查'};
function liveAdapt(){
  for(const k of Object.keys(LD))delete LD[k];
  const {status:st,diag:dg}=REAL,m=REAL.memory||st?.memory;
  if(st){
    const sv=Object.entries(st.strategies||{}).map(([k,s])=>({name:s.model?`${s.label}（${s.model}）`:s.label,status:s.available?'up':'down',detail:s.detail||k}));
    sv.push({name:'Jev（第 2、4～6 段）',status:st.system1?.jev_configured?'up':'degraded',detail:st.system1?.detail||''});
    if(dg){
      sv.push({name:'資料庫',status:dg.db?'up':'down',detail:dg.db?'連線正常':'連不上'});
      sv.push({name:'索引與 manifest',status:dg.index_consistent?'up':'degraded',detail:dg.index_consistent?`知識庫 ${dg.kb_version}`:dg.index_problems.join('；')});
      if(dg.scheduler)sv.push({name:'排程求解器',status:dg.scheduler.available?'up':'down',detail:`${dg.scheduler.engine}${dg.scheduler.version?' '+dg.scheduler.version:''} · ${dg.scheduler.detail}`});
    }
    const j=st.jobs;
    sv.push(j?.enabled?{name:`背景工作 Workers (${j.workers.length})`,status:j.broker_ok&&j.database_ok&&j.workers.length?'up':'degraded',detail:j.workers.map(w=>w.name).join('、')||'沒有 worker 在線'}:{name:'背景工作',status:'down',detail:'沒啟用（/status 的 jobs）'});
    LD.services=sv;
    if(j?.enabled)LD.queues={...j.counts,pending_dispatch:j.pending_dispatch};
  }
  if(m?.enabled){
    const gb=mb=>mb/1024;
    LD.resources={ram:[gb(m.total_mb-m.available_mb),Math.round(gb(m.total_mb))],vram:m.gpu?[gb(m.gpu.used_mb),Math.round(gb(m.gpu.total_mb))]:null};
  }
  if(m?.models?.length)LD.models=m.models.map(x=>({name:x.label,role:x.where,ver:x.key,status:x.loaded?'up':x.loaded===false?'idle':'—',res:`${x.pool==='gpu'?'VRAM':'RAM'} 約 ${(x.approx_mb/1024).toFixed(1)} GB${x.in_use?' · 使用中':''}`}));
  if(dg){
    const s1=dg.system1||{};
    LD.settings=[['llm_mode',dg.llm_mode],['embed_mode',dg.embed_mode],['allow_cloud',dg.allow_cloud],['kb_version',dg.kb_version,'kb/VERSION'],
      ...Object.entries(s1.thresholds||{}).map(([k,v])=>[`system1.thresholds.${k}`,v]),['system1.clarify_margin',s1.clarify_margin],['system1.timeout_s',s1.timeout_s],
      ...Object.entries(st?.chat_defaults||{}).map(([k,v])=>[`chat_defaults.${k}`,v]),['demo_controls',dg.demo_controls],['eval_controls',dg.eval_controls]]
      .filter(r=>r[1]!=null).map(([k,v,note])=>[k,String(v),'diagnostics',note||'']);
    LD.recent={routes:dg.recent_routes||[],chats:dg.recent_chats||[],sql:dg.recent_sql||[]};
  }
  if(REAL.artworks||REAL.parts){
    const probs=dg?.index_problems||[],stale=id=>probs.some(p=>p.includes(id));
    LD.kb=[...(REAL.artworks?.items||[]).map(a=>({id:a.id,type:'art',title:a.title_zh,ver:'—',chunks:null,source:[a.artist_zh,a.date_text,a.collection].filter(Boolean).join(' · '),conf:'公開',indexed:REAL.artworks.kb_version,stale:stale(a.id)})),
      ...(REAL.parts?.items||[]).map(p=>({id:p.id,type:'drawing',title:`${p.part_no} ${p.name_zh}`,ver:'rev '+p.revision,chunks:null,source:[p.drawing_no,p.category,p.material].filter(Boolean).join(' · '),conf:p.confidentiality,indexed:REAL.parts.kb_version,stale:stale(p.id)}))];
    if(!LD.kb.some(i=>i.id===STATE.kb.sel))STATE.kb.sel=LD.kb[0]?.id||null;
  }
  if(LIVE.accounts.length)LD.matrix=LIVE.accounts;
  if(REAL.sec)LD.secLogs=REAL.sec.items.map(l=>[hms(l.created_at),l.no,l.account_label||l.account_id||'—',SEC_STAGE[l.stage]||`第 ${l.stage} 段`,l.rule+(l.judge?`（${l.judge}）`:''),l.request_id||'']);
  if(REAL.audit)LD.changeAudit=REAL.audit.items.map(a=>[ymdhm(a.at),a.actor_label||a.actor_id,a.op||a.action,a.summary||'',a.ref_no||'']);
  if(REAL.evalRuns)LD.evalRuns=REAL.evalRuns.runs;
}

function trendSvg(){
  if(isReal('recent'))return chatLatencySvg(LD.recent.chats);
  if(isLive())return `<p class="muted">${esc(diagWhy())}</p>`;
  const {p50,p95}=MOCK_DATA.trend,w=420,h=150,max=7;
  const pts=a=>a.map((v,i)=>`${(i/(a.length-1)*(w-30)+25).toFixed(1)},${(h-15-v/max*(h-25)).toFixed(1)}`).join(' ');
  const grid=[0,2,4,6].map(v=>{const y=h-15-v/max*(h-25);return `<line x1="25" x2="${w}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="2" y="${y+4}" font-size="10" fill="var(--text-3)">${v}s</text>`}).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="延遲趨勢">${grid}<polyline points="${pts(p95)}" fill="none" stroke="var(--warn)" stroke-width="2"/><polyline points="${pts(p50)}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><div class="muted">— <span style="color:var(--text)">p50</span>　— <span style="color:var(--warn)">p95</span>　(最近 12 個 5 分鐘區間)</div>`;
}
// 後端沒有每 5 分鐘 p50／p95 的統計 API（要加會動到 shared/openapi.json）；先畫 diagnostics 裡最近 10 筆問答的耗時，舊的在左
function chatLatencySvg(chats){
  const c=[...chats].reverse(),w=420,h=150;
  if(!c.length)return '<p class="muted">還沒有問答紀錄（GET /admin/diagnostics 的 recent_chats）</p>';
  const total=c.map(x=>(x.total_ms??0)/1000),first=c.map(x=>(x.first_token_ms??0)/1000);
  // 刻度上限取 1、2、5 的倍數，這台問答可能要兩三分鐘，固定 0～7 秒會超出圖外
  const peak=Math.max(...total,...first)*1.1,max=[1,2,5,10,20,50,100,200,500,1000].find(v=>v>=peak)||Math.ceil(peak);
  const x=i=>c.length<2?w/2:i/(c.length-1)*(w-30)+25,y=v=>h-15-v/max*(h-25);
  const grid=[0,max/2,max].map(v=>`<line x1="25" x2="${w}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="2" y="${y(v)+4}" font-size="10" fill="var(--text-3)">${+v.toFixed(1)}s</text>`).join('');
  const line=(a,color)=>`<polyline points="${a.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2"/>${a.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${color}"><title>${hms(c[i].created_at)} · ${fmtMs(v*1000)}</title></circle>`).join('')}`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="最近問答的耗時">${grid}${line(total,'var(--warn)')}${line(first,'var(--accent)')}</svg><div class="muted">— <span style="color:var(--text)">第一個字</span>　— <span style="color:var(--warn)">總耗時</span>　(最近 ${c.length} 筆問答，舊 → 新；GET /admin/diagnostics)</div>`;
}

      else if(ev==='token')col.answer+=data.text;
      else if(ev==='done'){col.done=data;col.state='done'}
      else if(ev==='error')throw new ApiErr(data.code,data.message,0);
      paint();
    },signal);
    if(col.state==='run')Object.assign(col,{state:'error',error:'串流結束了，但沒有收到 done'});
  }catch(e){
    if(e.name==='AbortError'||CMP.run!==run)return;
    Object.assign(col,{state:'error',error:`${e.message}（${e.code||'ERROR'}）`});
  }
  paint();
}

// POST /images → POST /intake（SSE：stage／token／draft／done／error）→ 改欄位 PUT /intake/{id} → 主管 POST /intake/{id}/commit
// 後端沒有草稿清單 API：草稿 ID 記在網址 #intake=…，重新整理還找得回來
const INTAKE_DOMAINS=[['','自動判斷'],['art','畫作'],['mfg','圖紙']];
const INTAKE_TIPS={
  '':'交給後端的領域路由判斷是畫作還是圖紙；判斷錯了會請你改選。',
  art:'正面拍、畫面盡量只有畫（這張照片就是之後辨識用的原圖）；資料由人填，介紹只收 CC0、公有領域、CC BY 4.0。',
  mfg:'把整張圖紙（含下方標題欄）拍進畫面；本地 Qwen3-VL 讀標題欄（這台約 40 秒），只收三視圖＋下方標題欄的版面。'
};
const INTAKE_SOURCE={'Qwen3-VL':'info','規則':'','人':'ok'};
// 每次上傳換一個 run：換一張、捨棄、再建一筆之後，上一輪的串流與輪詢晚到也不寫進畫面
const INTAKE={open:false,domain:'',run:0,ctl:null,imageId:null,imgUrl:null,stages:[],raw:'',fail:null,draft:null,edits:{},busy:'',actionError:'',view:0,resumeErr:null};
const intakePaint=()=>{const el=STATE.view==='kb'&&$('#intakeBox');if(el)el.innerHTML=renderIntake()};
function intakeHash(id){history.replaceState(null,'',id?`#intake=${encodeURIComponent(id)}`:location.pathname+location.search)}
function intakeReset(keepHash){
  INTAKE.ctl?.abort();INTAKE.run++;
  if(INTAKE.imgUrl)URL.revokeObjectURL(INTAKE.imgUrl);
  Object.assign(INTAKE,{ctl:null,imageId:null,imgUrl:null,stages:[],raw:'',fail:null,draft:null,edits:{},busy:'',actionError:'',view:0,resumeErr:null});
  if(!keepHash)intakeHash(null);
}
// 身分換了：進行中的建檔請求一律作廢、舊身分讀到的草稿撤下，草稿 ID 留在網址，由 intakeResume 用新身分重讀同一份。
// 收錄要主管、畫面也叫人「切換成主管」，後端又沒有草稿清單，清掉 ID 就找不回來；還沒儲存的修改是使用者自己打的，一起留著
function intakeAccountChanged(){
  const id=INTAKE.draft?.draft_id,edits=INTAKE.edits;
  intakeReset(true);
  if(id){intakeHash(id);INTAKE.edits=edits}
}
async function intakeStart(imageId,domain){
  INTAKE.ctl?.abort();
  const ctl=INTAKE.ctl=new AbortController(),run=++INTAKE.run;
  Object.assign(INTAKE,{imageId,stages:[],raw:'',fail:null,draft:null,edits:{},busy:'',actionError:''});intakePaint();
  try{
    await apiStream('/intake',{image_id:imageId,domain:domain||null},(ev,data)=>{
      if(INTAKE.run!==run)return;
      if(ev==='stage')INTAKE.stages.push(data);
      else if(ev==='token')INTAKE.raw+=data.text;
      else if(ev==='draft'){INTAKE.draft=data;intakeHash(data.draft_id)}
      // 錯誤事件另帶 part／artwork（已經在知識庫）、route（領域判斷），要整包留著
      else if(ev==='error')INTAKE.fail=data;
      intakePaint();
    },ctl.signal);
    if(INTAKE.run===run&&!INTAKE.draft&&!INTAKE.fail){INTAKE.fail={code:'STREAM_ENDED',message:'串流結束了，但沒有收到草稿'};intakePaint()}
  }catch(e){
    if(e.name==='AbortError'||INTAKE.run!==run)return;
    INTAKE.fail={code:e.code||'ERROR',message:e.message};intakePaint();
  }
}
// 收錄後背景重建索引（status＝indexing）：照主介面每 1.5 秒重讀；done 之後重新讀清單與知識庫版本，新的那筆選起來
async function intakeSettle(run){
  const d=INTAKE.draft;
  if(d.status==='indexing')return void setTimeout(()=>intakePoll(run),1500);
  if(d.status==='done'){STATE.kb.sel=d.item_id;await liveLoad();if(INTAKE.run===run)toast(`已收錄 ${d.item_id}，清單已更新`)}
  intakePaint();
}
async function intakePoll(run){
  if(INTAKE.run!==run||INTAKE.draft?.status!=='indexing')return;
  try{const d=await api(`/intake/${encodeURIComponent(INTAKE.draft.draft_id)}`);if(INTAKE.run!==run)return;INTAKE.draft=d}
  catch(e){if(INTAKE.run!==run)return;INTAKE.actionError=`${e.message}（${e.code}）`}
  intakePaint();intakeSettle(run);
}
async function intakeSaveEdits(run){
  const d=INTAKE.draft;
  const values=Object.fromEntries(Object.entries(INTAKE.edits).map(([k,v])=>{const f=d.fields.find(x=>x.key===k);return [k,v.trim()===''?null:f?.kind==='number'?Number(v):v]}));
  const next=await api(`/intake/${encodeURIComponent(d.draft_id)}`,{...postJson({values}),method:'PUT'});
  if(INTAKE.run===run){INTAKE.draft=next;INTAKE.edits={}}
}
async function intakeAct(what,fn){
  const run=INTAKE.run;
  INTAKE.busy=what;INTAKE.actionError='';intakePaint();
  try{await fn(run)}catch(e){if(INTAKE.run===run)INTAKE.actionError=`${e.message}（${e.code}）`}
  if(INTAKE.run===run){INTAKE.busy='';intakePaint()}
}
// 網址帶 #intake=草稿 ID：重新整理時回到 06 頁打開那份草稿；換了身分時（stay）留在原本的頁面，用新身分重讀
async function intakeResume(stay){
  const m=location.hash.match(/^#intake=(.+)$/);if(!m||!isLive())return;
  const run=INTAKE.run;
  let d=null;
  try{
    d=await api(`/intake/${m[1]}`);if(INTAKE.run!==run)return;
    Object.assign(INTAKE,{draft:d,imageId:d.image_id,resumeErr:null});
  }catch(e){
    if(INTAKE.run!==run)return;
    // 讀不到時草稿 ID 一律留在網址（後端沒有草稿清單，清掉就找不回來）：暫時連不上可以重試；
    // 權限不夠（只給建檔的人和主管讀，其他身分和不存在一樣回 404）換成有權限的身分會自動重讀
    INTAKE.resumeErr={id:m[1],code:e.code,message:e.message};
  }
  if(stay)intakePaint();else{INTAKE.open=true;go('kb')}
  if(d)intakeSettle(run);
}

function renderIntake(){
  if(!isLive())return `<h3>照片建檔</h3><p class="muted">${LIVE.state==='offline'?'連不上後端：照片建檔要真的送 POST /images、POST /intake，沒有模擬版本。':'連線中…'}</p>`;

    <div class="row"><button class="btn" data-act="intakeResumeRetry" ${e.retrying?'disabled':''}>${e.retrying?'重讀中…':'重試'}</button><button class="btn" data-act="intakeAgain">不再找這份草稿</button></div>`:'';

  if(!s.imgUrl)return head;
  const list=s.busy==='upload'?'<li class="run">上傳照片（POST /images）</li>'
    :n?s.stages.map((x,i)=>`<li class="${i<n-1?'done':s.fail?'fail':'run'}">${esc(x.label)}</li>`).join('')
    :s.fail?'':'<li class="run">建立草稿（POST /intake）</li>';
  const raw=s.stages[n-1]?.stage==='read'&&!s.fail?`<p class="muted">本地 Qwen3-VL 正在抄寫標題欄（這台約 40 秒）</p><pre>${esc(s.raw||'…')}</pre>`:'';
  return head+`<div class="grid g2"><div class="if-photo"><img src="${s.imgUrl}" alt="拍的照片"></div><div><ul class="if-stages">${list}</ul>${raw}${s.fail?intakeFailHtml(s.fail):''}</div></div>`;

function intakeFailHtml(e){

function jobsErrText(e,what){
  if(!e)return '';

  if(e.status===0)return `連不上後端（${what}）：後端沒啟動或網路中斷`;
  if(e.code==='JOBS_UNAVAILABLE')return `背景工作系統無法使用（${what} 回 503 JOBS_UNAVAILABLE）：${e.message}`;
  if(e.status===401)return `憑證無效（${what} 回 401，重新取得憑證後仍失敗）：${e.message}`;
  if(e.status===403)return `目前身分沒有權限（${what} 回 403 ${e.code}）：${e.message}`;
  if(e.status===404)return what==='GET /jobs'?`這台後端沒有背景工作清單的 API（GET /jobs 回 404 ${e.code}），可能是較舊的版本`:`找不到，或目前身分看不到這個工作（${what} 回 404 ${e.code}）：${e.message}`;
  return `${what} 失敗：${e.message}（${e.code}${e.status?`，HTTP ${e.status}`:''}）`;
}

// ---- 服務狀況：未啟用、資料庫不通、Redis 不通、沒有對應佇列的 worker 分開寫；「沒有工作」不等於服務壞掉
function jobSvcRows(j){
  if(!j.enabled)return [['down','背景工作系統','這台後端沒有設定 REDIS_URL 與工作資料庫（JOBS_DATABASE_URL，留空沿用 DATABASE_URL）：GET /jobs 回 503，3D 重建與排程都不能建立']];
  const rows=[[j.database_ok?'ok':'bad','工作資料庫（PostgreSQL）',j.database_ok?'連線正常':'連不上：清單、詳情、事件都讀不到，worker 也領不到工作']];
  rows.push([j.broker_ok?'ok':'bad','Redis（broker）',j.broker_ok?'連線正常':`連不上：新工作留在 outbox 等投遞（待投遞 ${j.pending_dispatch} 個），恢復後自動補送`]);
  for(const [q,label,cmd] of [['gpu','3D 重建','make worker-gpu'],['schedule','排程','make worker-schedule']]){
    const ws=(j.workers||[]).filter(w=>(w.queues||[]).includes(q));
    rows.push([ws.length?'ok':'warn',`${q} worker（${label}）`,ws.length?ws.map(w=>`${w.name}（${w.age_s} 秒前登記）`).join('、'):`沒有 worker 在線：${label}工作會一直排隊（${cmd}）`]);
  }
  if(j.pending_dispatch&&j.broker_ok)rows.push(['warn','待投遞',`${j.pending_dispatch} 個工作還沒送進 Redis`]);
  return rows;
}

// ---- 事件
function jobEventText({type,data:d={}}){
  switch(type){
    case 'created':return '建立工作，排進佇列';
    case 'started':return `worker 領走，開始第 ${d.attempt??'?'} 次執行${d.resource?`（資源 ${d.resource}）`:''}`;
    case 'requeued':return `重新排隊：${d.reason||'worker 中斷'}`;
    case 'meta':return d.engine_label?`${d.engine_label}${d.fallback_reason?`（${d.fallback_reason}）`:''} · 上限 ${d.seconds} 秒 · ${d.problem?.n_work_orders??'?'} 張工單`
      :`${d.part?`圖紙 ${d.part.part_no} ${d.part.name_zh}`:d.image_id?'上傳的照片':'—'} · ${d.strategy||''} ${d.model||''}`.trim();
    case 'progress':return d.chars!=null?`${d.label||'模型生成中'}：${d.chars} 字元`:`${d.phase||'求解中'} · 分數 ${d.score??'—'} · 改善 ${d.improvements??0} 次 · ${fmtMs(d.elapsed_ms)}`;
    case 'tick':return `${d.phase||'求解中'} · ${fmtMs(d.elapsed_ms)} · 改善 ${d.improvements??0} 次`;
    case 'stage':return d.label||d.stage||'';
    case 'committing':return '進入寫回（之後不能取消）';
    case 'cancel_requested':return '已要求取消，等 worker 停下來';
    case 'stop_requested':return '已要求提前結束（採用目前最佳解）';
    case 'succeeded':return '完成';
    case 'failed':return `失敗：${d.message||'—'}${d.code?`（${d.code}）`:''}`;
    case 'cancelled':return `已取消${d.note?`：${d.note}`:''}`;
    default:return clip(JSON.stringify(d),120);
  }
}
function jobEventLi(ev){
  const kind=ev.type==='succeeded'?'ok':ev.type==='failed'?'bad':['cancelled','cancel_requested','requeued','stop_requested','committing'].includes(ev.type)?'warn':'';
  return `<li data-kind="${kind}"><time>${ev.data?.at?esc(hms(ev.data.at)):'—'}</time><span class="seq">#${ev.id||'—'}</span><span class="type">${esc(ev.type)}</span><span class="what">${esc(jobEventText(ev))}</span></li>`;
}
function jobEventsHtml(){
  const id=STATE.jobs.sel,f=JOBS.f;

function jobFollowHtml(){

// 新事件接在清單後面，不整份重畫：使用者往上捲著看時不會被拉回去，捲在底部時跟著捲

const jobEventsCardHtml=()=>`<h3>事件（GET /jobs/{id}/events）</h3><div class="row" id="jobFollow">${jobFollowHtml()}</div><ol class="jb-log" id="jobEvents" data-key="${esc(JOBS.dataId||'')}" data-n="${JOBS.events.length}">${jobEventsHtml()}</ol>`;

// 一輪事件迴圈裡的多次更新合併成一次重畫（重連後一次重播幾百筆事件也只畫一次）
function jobsPaint(...parts){

// ---- 讀清單與服務狀況
async function jobsLoad(opts={}){
  if(!JOBS.active||!isLive())return;
  const gen=JOBS.gen,seq=++JOBS.listSeq;
  clearTimeout(JOBS.listTimer);
  JOBS.loading=true;jobsPaint('list');
  const [lr,sr]=await Promise.allSettled([api('/jobs?limit=50'),opts.status?api('/status'):Promise.resolve()]);
  if(gen!==JOBS.gen||seq!==JOBS.listSeq||!JOBS.active)return;   // 換帳號、離開 07，或之後又發了一次：這次的回應不用
  JOBS.loading=false;
  if(lr.status==='fulfilled'){
    JOBS.list=lr.value.items||[];JOBS.listErr=null;JOBS.listAt=hms();
    // 選取的工作以事件串流更新的那份為準（比清單新）
    if(JOBS.detail)jobsPatchRow(JOBS.detail);
    // 清單不滿 50 筆卻沒有正在看的工作：可能別的分頁換了身分或被撤權（伺服器端舊串流仍照原身分送），重新驗證一次
    const sel=STATE.jobs.sel;
    if(sel&&JOBS.detail&&JOBS.dataId===sel&&JOBS.list.length<50&&!JOBS.list.some(j=>j.id===sel))jobRecheck(sel);
  }else{
    const e=JOBS.listErr=lr.reason;
    // 清單 401／403＝這個身分整體讀不了背景工作：上一份清單、選取工作的詳情、事件、取消狀態立刻清掉，串流即使還開著也停掉。
    // 不走 jobRevoked（它會再讀清單），只留「重試」讓人手動再讀，不會一直重打。
    // 404 是這台後端沒有 /jobs（版本不同），不是撤權：和 503、斷線一樣保留畫面上的內容並寫原因
    if(e.status===401||e.status===403){
      JOBS.list=null;jobUnfollow();jobClearDetail();
      const id=STATE.jobs.sel;
      if(id&&JOB_ID_RE.test(id)){JOBS.dataId=id;JOBS.detailErr={text:`${jobsErrText(e,'GET /jobs')}；這個工作的詳情與事件已一併清除`,revoked:true}}
      jobsPaint('events');
    }
  }
  if(opts.status){if(sr.status==='fulfilled'){JOBS.svc=sr.value?.jobs??null;JOBS.svcErr=null}else JOBS.svcErr=sr.reason}
  if(!STATE.jobs.sel&&JOBS.list?.length)jobSelect(JOBS.list[0].id);
  jobsPaint('list','svc','detail');
  jobsScheduleList();
}
// 清單只在有排隊或執行中的工作時才自動更新；全部結束就不再打 GET /jobs
function jobsScheduleList(){
  clearTimeout(JOBS.listTimer);
  if(JOBS.active&&JOBS.list?.some(j=>!JOB_TERMINAL.has(j.status)))JOBS.listTimer=setTimeout(()=>jobsLoad(),JOB_CFG.listMs);
}
async function jobRecheck(id){
  const gen=JOBS.gen;
  try{await api(`/jobs/${encodeURIComponent(id)}`)}
  catch(e){if(gen===JOBS.gen&&JOBS.dataId===id&&JOB_FATAL.has(e.status))jobRevoked(id,e,`GET /jobs/${id}`)}
}
function jobsPatchRow(j){
  const i=JOBS.list?.findIndex(x=>x.id===j.id)??-1;
  if(i>=0){JOBS.list[i]={...JOBS.list[i],...j};jobsPaint('list')}
}

// ---- 訂閱一個工作：GET 詳情 → 事件串流（斷線用 Last-Event-ID 接上）→ 連續失敗改輪詢 → 終態讀一次最終結果
function jobUnfollow(){const f=JOBS.f;if(f){f.ctl.abort();JOBS.f=null}}
// cancelSeq 跟著加一：換詳情、離頁、換帳號、撤權之後，還在路上的取消回應都作廢，不會蓋掉重新讀到的狀態
function jobClearDetail(){JOBS.cancelSeq++;Object.assign(JOBS,{dataId:null,detail:null,detailErr:null,events:[],lastId:0,meta:null,committing:false,cancel:{busy:null,msg:'',tone:''}})}
function jobSetDetail(j){JOBS.detail=j;JOBS.detailErr=null;jobsPatchRow(j);jobsPaint('detail')}
// 回應裡的工作快照比已經收到的事件舊（串流先送到終態，取消的回應才回來）：不拿它蓋掉較新的狀態
const jobFresher=j=>(j?.last_event_id??0)>=Math.max(JOBS.lastId,JOBS.detail?.last_event_id??0);
function jobAddEvent(ev){
  // 伺服器從 Last-Event-ID 之後送，照理不會重複；保險起見 id 沒有比收過的大就丟掉
  if(ev.id&&ev.id<=JOBS.lastId)return;
  if(ev.id)JOBS.lastId=ev.id;
  JOBS.events.push(ev);
  const j=JOBS.detail,{type,data:d}=ev;
  if(type==='committing')JOBS.committing=true;
  else if(type==='started'||type==='requeued')JOBS.committing=false;
  if(type==='meta')JOBS.meta=d;
  if(j){
    if(type==='started')Object.assign(j,{status:'running',attempt:d.attempt??j.attempt,started_at:j.started_at||d.at});
    else if(type==='requeued')j.status='queued';
    else if(type==='cancel_requested')j.cancel_requested=true;
    else if(type==='stop_requested')j.stop_requested=true;
    else if(type==='progress'||type==='stage'||type==='tick')j.progress=d;
    else if(JOB_TERMINAL.has(type)){j.status=type;j.finished_at=d.at||j.finished_at;if(d.code)j.error={code:d.code,message:d.message}}
    jobsPatchRow(j);
  }
  jobsPaint('events','detail');
}
// GET /jobs/{id}/events：瀏覽器的 EventSource 拿不到 404／503 的狀態碼、也不會走 apiFetch 的憑證換發，所以和 /chat 一樣用 fetch 讀。
// 串流正常結束時 resolve；HTTP 錯誤與串流裡的 error 事件丟 ApiErr，由 jobFollow 決定重連、輪詢或停止
async function jobStream(id,after,onEvent,signal,onOpen){
  const res=await apiFetch(`/jobs/${encodeURIComponent(id)}/events`,{headers:{Accept:'text/event-stream',...(after>0?{'Last-Event-ID':String(after)}:{})},signal});
  if(!res.ok)throw await apiError(res);
  onOpen();
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
  const dispatch=block=>{
    let type='message',eid=0;const data=[];
    for(const line of block.split('\n')){
      if(!line||line[0]===':')continue;   // 空行、「: keepalive」註解
      const k=line.indexOf(':'),field=k<0?line:line.slice(0,k);let v=k<0?'':line.slice(k+1);if(v[0]===' ')v=v.slice(1);
      if(field==='event')type=v;else if(field==='data')data.push(v);else if(field==='id')eid=Number(v)||0;
    }
    if(!data.length)return;   // 只有「retry: 2000」的區塊
    const body=JSON.parse(data.join('\n'));
    // 串流本身的錯誤（被撤權、工作資料庫暫時不可用）不是工作的終態
    if(type==='error')throw new ApiErr(body.code||'STREAM_ERROR',body.message||'串流中斷',body.code==='PERMISSION_REVOKED'?403:503);
    onEvent({id:eid,type,data:body});
  };
  try{
    for(;;){
      const {value,done}=await reader.read();
      if(signal.aborted){reader.cancel().catch(()=>{});return}
      if(done)return;   // 沒有收完的最後一段照 SSE 規格丟掉
      buf=(buf+dec.decode(value,{stream:true})).replace(/\r\n/g,'\n');
      let i;
      while((i=buf.indexOf('\n\n'))>=0){const b=buf.slice(0,i);buf=buf.slice(i+2);dispatch(b);if(signal.aborted)return}
    }
  }catch(e){
    reader.cancel().catch(()=>{});
    if(e instanceof ApiErr)throw e;
    if(signal.aborted||e.name==='AbortError')return;
    throw new ApiErr('STREAM_ERROR','串流中斷',0);
  }
}
// 讀不到這個工作（404、被撤權、憑證失效）：受保護的詳情與事件立刻清掉，清單也重讀，不留著看不到的東西
function jobRevoked(id,e,what){
  if(JOBS.f?.id===id)jobUnfollow();
  if(STATE.jobs.sel!==id)return;
  jobClearDetail();JOBS.dataId=id;
  JOBS.detailErr={text:jobsErrText(e,what),revoked:true};
  if(JOBS.list)JOBS.list=JOBS.list.filter(j=>j.id!==id);
  jobsPaint('list','detail','events');
  jobsLoad();
}
async function jobFollow(id){
  jobUnfollow();
  if(JOBS.dataId!==id){jobClearDetail();JOBS.dataId=id}   // 同一個工作（重新整理、斷線後）就從最後收到的事件接著讀
  JOBS.detailErr=null;
  const f=JOBS.f={id,run:++JOBS.followRun,ctl:new AbortController(),state:'loading',fails:0,reconnects:0,note:''},signal=f.ctl.signal;
  const live=()=>JOBS.f===f&&!signal.aborted;
  const path=`/jobs/${encodeURIComponent(id)}`;
  jobsPaint('detail','events');
  const fail=(e,what)=>{
    if(JOB_FATAL.has(e.status))return jobRevoked(id,e,what);
    jobUnfollow();JOBS.detailErr={text:jobsErrText(e,what),revoked:false};jobsPaint('detail','events');
  };
  try{const j=await api(path,{signal});if(!live())return;jobSetDetail(j)}
  catch(e){if(live())fail(e,`GET ${path}`);return}
  let terminal=JOB_TERMINAL.has(JOBS.detail.status);
  while(live()){
    let ended=false;
    f.state=f.reconnects?'reconnecting':'connecting';jobsPaint('follow');
    try{
      await jobStream(id,JOBS.lastId,ev=>{
        if(!live())return;
        f.fails=0;jobAddEvent(ev);
        if(JOB_TERMINAL.has(ev.type))ended=true;
      },signal,()=>{if(live()){f.state='live';f.note='';jobsPaint('follow')}});
    }catch(e){
      if(!live())return;
      if(JOB_FATAL.has(e.status))return jobRevoked(id,e,'事件串流');
      f.note=jobsErrText(e,'事件串流');
    }
    if(!live())return;
    // 終態的串流伺服器會自己結束：收到終態事件、或一開始就已結束（只重播一次）就不再重連
    if(ended||terminal)break;
    f.fails++;
    if(f.fails>=JOB_CFG.maxFailures){
      const r=await jobPoll(f,path);
      if(r==='stop')return;
      if(r==='final'){terminal=true;f.fails=0}   // 終態：再接一次串流把事件補齊（只重播，不會一直連著）
      else f.fails=JOB_CFG.maxFailures-1;        // 輪詢一陣子後再試一次串流，接得上就換回串流
      continue;
    }
    f.reconnects++;f.state='reconnecting';jobsPaint('follow');
    await jobWait(JOB_CFG.retryMs[Math.min(f.fails-1,JOB_CFG.retryMs.length-1)],signal);
  }
  if(!live())return;
  try{const j=await api(path,{signal});if(!live())return;jobSetDetail(j)}   // 結果與產物以終態後讀到的為準
  catch(e){if(!live())return;if(JOB_FATAL.has(e.status))return jobRevoked(id,e,`GET ${path}`);f.note=jobsErrText(e,'讀最終結果')}
  f.state='done';jobsPaint('detail','follow');
}
// 事件串流連續連不上：改用 GET /jobs/{id} 輪詢狀態；回 'final'（到終態）、'stream'（該再試串流）或 'stop'
async function jobPoll(f,path){
  const live=()=>JOBS.f===f&&!f.ctl.signal.aborted;
  f.state='polling';jobsPaint('follow');
  for(let n=1;;n++){
    await jobWait(JOB_CFG.pollMs,f.ctl.signal);
    if(!live())return 'stop';
    try{
      const j=await api(path,{signal:f.ctl.signal});if(!live())return 'stop';
      jobSetDetail(j);f.note='';
      if(JOB_TERMINAL.has(j.status))return 'final';
    }catch(e){
      if(!live())return 'stop';
      if(JOB_FATAL.has(e.status)){jobRevoked(f.id,e,'狀態輪詢');return 'stop'}
      f.note=jobsErrText(e,'狀態輪詢');
    }
    jobsPaint('follow');
    if(n%JOB_CFG.pollStreamEvery===0)return 'stream';
  }
}

// ---- 取消：只用既有的 POST /jobs/{id}/cancel；送出中不重送，回應照實寫
async function jobCancel(){
  const id=STATE.jobs.sel,j=JOBS.detail;
  if(!j||j.id!==id||JOBS.cancel.busy)return;
  const gen=JOBS.gen,tok=++JOBS.cancelSeq;
  const same=()=>gen===JOBS.gen&&tok===JOBS.cancelSeq&&STATE.jobs.sel===id&&JOBS.dataId===id;
  JOBS.cancel={busy:id,msg:'',tone:''};jobsPaint('detail');
  let msg,tone,reread=false;
  try{
    const r=await api(`/jobs/${encodeURIComponent(id)}/cancel`,{method:'POST'});
    if(!same())return;
    msg={cancelled:'已取消：工作還在排隊，直接取消，沒有執行',cancelling:'已要求取消：工作執行中，worker 停下來後才會變成「已取消」，不會寫回任何結果',already_cancelled:'這個工作本來就已取消'}[r.result]||`後端回 ${r.result}`;
    tone=r.result==='cancelling'?'warn':'ok';
    if(r.job&&jobFresher(r.job))jobSetDetail({...JOBS.detail,...r.job});
  }catch(e){
    if(!same())return;
    if(e.status===404||e.status===401){JOBS.cancel={busy:null,msg:'',tone:''};return jobRevoked(id,e,'取消')}
    if(e.code==='JOB_COMMITTING'){JOBS.committing=true;msg='沒有取消：工作已進入寫回階段，會完成並寫入結果（409 JOB_COMMITTING）'}
    else if(e.code==='JOB_ALREADY_FINISHED')msg=`沒有取消：${e.message}（409 JOB_ALREADY_FINISHED）`;
    else if(e.status===403)msg=`沒有取消：目前身分「${LIVE.account?.label||'—'}」不能取消這個工作（403 ${e.code}）；3D 重建只有建立的人、排程要有 schedule_run 才能取消`;
    else if(e.status===0)msg='取消請求沒有送到後端（連不上），結果不確定；請按「重新整理」確認狀態';
    else msg=jobsErrText(e,'取消');
    tone=e.status===409||e.status===403?'warn':'bad';
    reread=e.status===409;   // 已經寫回或結束：重讀一次實際狀態
  }
  JOBS.cancel={busy:null,msg,tone};jobsPaint('detail');
  if(reread){
    try{const j=await api(`/jobs/${encodeURIComponent(id)}`);if(same()&&jobFresher(j))jobSetDetail({...j})}catch{}
  }
}

async function flowRunLive(q,img){

    }else skip(0,'沒附圖，略過');

    if(r.photo){

      log:['guard',ok?`第 1 段授權 pass · 第 2 段 ${r.guard?.verdict??'略過'}（${r.guard?.engine??'—'}）`:`第 ${r.blocked?.stage??'?'} 段擋下：${r.blocked?.rule??''} ${r.blocked?.log_no??''}`]});

    const target=r.gate!=='direct'?null:r.intent==='art_qa'?(d.artwork_id?{artwork_id:d.artwork_id}:d.global_qa?{}:null):r.intent==='drawing_qa'&&d.part_id?{part_id:d.part_id}:null;

function flowApply(st){

  const log=$('#flLog');log.innerHTML=flowLogHtml();log.scrollTop=log.scrollHeight;
}
// 資料流的快捷鍵：正在打字、拖對話欄（它自己用了方向鍵）、開著對話框時都不攔
function flowKey(e){
  const t=e.target instanceof Element?e.target:document.body;
  // 執行列：Enter 執行、Shift+Enter 換行；輸入法還在選字時按 Enter 不執行
  if(t.id==='flDraft'){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ACT.flowRun()}return}
  if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey||t.closest('input,textarea,select')||$('#dlg').classList.contains('open'))return;
  if(/^[1-4]$/.test(e.key))ACT.flowScene(e.key-1);
}

/* ===== 開發助理：不連伺服器，只從 MOCK_DATA 比對關鍵字回答 ===== */
const CHAT_SUGS=['R-1023-009 為什麼失敗？','J-2041 現在怎樣？','今天有哪些阻擋？'];
const reqLink=r=>`<a class="lnk" data-act="openReq" data-arg="${r.id}">${r.id}</a>`;
const jobLink=j=>`<a class="lnk" data-act="openJob" data-arg="${j.id}">${j.id}</a>`;
function botReply(q){
  const u=q.toUpperCase(),rid=u.match(/R-\d{4}-\d{3}/)?.[0],jid=u.match(/J-\d{4}/)?.[0];
  if(rid){
    const r=reqById(rid);
    if(!r)return `<p>找不到 ${esc(rid)}，這份模擬資料只有 R-1023-001～010。</p>`;
    const stop=r.stages.find(s=>s.note);
    return `<p>${reqLink(r)}（${r.time}・${esc(r.role)}・${MODULE_LABEL[r.module]}）${STATUS_LABEL[r.status]}，總延遲 ${(totalMs(r)/1000).toFixed(2)} s。${stop?`停在「${esc(stop.name)}」：${esc(stop.note)}。`:'七段都通過。'}${r.error?`\n訊息：${esc(r.error)}`:''}</p>`;
  }
  if(jid){
    const j=MOCK_DATA.jobs.find(x=>x.id===jid);
    if(!j)return `<p>找不到 ${esc(jid)}，背景工作只有 J-2040～2045。</p>`;
    return `<p>${jobLink(j)}（${j.type}）${STATUS_LABEL[j.status]}，第 ${j.attempt}/${j.max} 次・Worker ${j.worker}。最後的事件：${esc(j.events.at(-1))}。</p>`;
  }
  // 依關鍵字挑出異常的請求；只說「異常」沒指定哪一種就全部列
  const kinds=[[/阻擋|擋/,'blocked'],[/錯誤|失敗|error|fail/i,'error'],[/拒答|無資料/,'nodata'],[/備援|fallback/i,'fallback']].filter(([re])=>re.test(q)).map(([,k])=>k);
  if(kinds.length||/異常|問題|狀況/.test(q)){
    const want=kinds.length?kinds:['blocked','error','nodata','fallback'];
    const list=MOCK_DATA.requests.filter(r=>want.includes(r.status));
    const jobs=/失敗|fail/i.test(q)?MOCK_DATA.jobs.filter(j=>j.status==='failed'):[];
    if(!list.length&&!jobs.length)return '<p>今天沒有這類的請求。</p>';
    return `<p>今天共 ${list.length} 筆${jobs.length?`，另有 ${jobs.length} 個失敗的背景工作`:''}：</p><ul>${list.map(r=>`<li>${reqLink(r)} ${STATUS_LABEL[r.status]}・${esc(r.q.slice(0,18))}…</li>`).join('')}${jobs.map(j=>`<li>${jobLink(j)} ${j.type} 失敗</li>`).join('')}</ul>`;
  }
  return '<p>我只讀這頁的模擬資料，可以問：某筆請求（例如 R-1023-009）、某個背景工作（例如 J-2041），或今天的阻擋／錯誤／拒答／備援。</p>';
}
function renderChat(){
  const c=STATE.chat,th=$('#chatThread');
  th.innerHTML=c.msgs.length
    ?c.msgs.map(m=>m.who==='user'?`<div class="msg msg-user"><span class="msg-who">YOU</span><p>${esc(m.text)}</p></div>`:`<div class="msg msg-bot"><span class="msg-who">ASSISTANT</span>${m.html||'<p class="thinking"></p>'}</div>`).join('')
    :`<p class="chat-hint">問這頁的請求、背景工作或今天的異常，回答會附上可以點開的連結。</p><div class="chat-sugs">${CHAT_SUGS.map(s=>`<button type="button" class="btn" data-act="ask" data-arg="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
  $('#chatSend').disabled=c.busy;
  th.scrollTop=th.scrollHeight;
}
/* 對話欄寬度與收合：和其他互動一樣只存在記憶體，重新整理回到預設 */
const CHAT_W={min:280,max:640,def:380};
function applyChatLayout(){
  const c=STATE.chat,label=c.collapsed?'展開對話欄':'收合對話欄',b=$('#chatToggle');
  $('.term-main').style.setProperty('--chat-w',c.w+'px');
  $('.term-main').classList.toggle('is-collapsed',c.collapsed);
  $('.term-main').dataset.pane=c.pane;
  $('#paneChat').setAttribute('aria-selected',String(c.pane==='chat'));$('#paneWork').setAttribute('aria-selected',String(c.pane==='work'));
  b.title=label;b.setAttribute('aria-label',label);b.setAttribute('aria-expanded',String(!c.collapsed));
  $('#chatResize').setAttribute('aria-valuenow',c.w);
}
function setChatW(w){STATE.chat.w=Math.round(Math.min(CHAT_W.max,Math.max(CHAT_W.min,w)));applyChatLayout()}
function sendChat(text){
  const q=text.trim(),c=STATE.chat;if(!q||c.busy)return;
  c.msgs.push({who:'user',text:q},{who:'bot',html:''});c.busy=true;$('#chatInput').value='';renderChat();
  // 停半秒再回答，模擬本地模型在想
  setTimeout(()=>{c.msgs[c.msgs.length-1].html=botReply(q);c.busy=false;renderChat()},500);
}

/* ===== 點擊動作 ===== */
const ACT={
  go:a=>go(a),closeDlg,
  theme:()=>{STATE.theme=STATE.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=STATE.theme;renderThemeBtn();toast(`已切換為${STATE.theme==='dark'?'深色':'淺色'}主題`)},
  refresh:()=>{
    if(isLive())return liveLoad().then(()=>toast('已重新讀取後端資料'));
    const m=STATE.metrics,j=n=>Math.floor(Math.random()*n);
    m.success+=5+j(10);m.refusal+=j(2);m.block+=j(2);m.error+=j(2);
    const t=MOCK_DATA.trend;t.p50.shift();t.p50.push(+(1.7+Math.random()*.7).toFixed(1));t.p95.shift();t.p95.push(+(4+Math.random()*2.2).toFixed(1));
    MOCK_DATA.resources.vram[0]=+(18+Math.random()*4).toFixed(1);
    const d=new Date(2026,9,23,14,32+j(20),j(60));STATE.refreshedAt='2026-10-23 '+d.toTimeString().slice(0,8);
    render();toast('已重新整理 (模擬資料)');
  },
  // 從別頁點進來的那一筆所在的組如果收著，要打開才看得到它
  openReq:a=>{const r=reqById(a);STATE.selReq=a;STATE.tr={...STATE.tr,q:'',module:'',status:'',tab:'mock'};if(r)STATE.tr.fold[traceGroupOf(r.module)]=false;go('trace')},
  trFold:a=>{STATE.tr.fold[a]=!STATE.tr.fold[a];$('#trList').innerHTML=renderTraceList()},
  trTab:a=>{STATE.tr.tab=a;go('trace')},
  // 只有展示模式（DEMO_CONTROLS）且從本機連線時後端才允許免密碼切換；cookie 和主介面共用，主介面的身分也會跟著換
  liveSwitch:async()=>{
    try{const acc=await api('/auth/switch',postJson({account_id:'manager'}));Object.assign(LIVE,{account:acc.current,accounts:acc.accounts});await liveAccountChanged();toast('已切換成主管；同一個瀏覽器裡主介面的身分也跟著換了')}
    catch(e){toast(`切換失敗：${e.message}（${e.code}）`)}
  },
  retSearch:async()=>{
    const s=STATE.ret,q=s.q.trim();if(!q)return toast('先輸入查詢');
    // 還沒回來又按 Enter、或換了身分：只採用最新那一次，先送出、晚回來的不蓋掉後來的結果
    const seq=++s.textSeq;
    s.busy=true;$('#retBody').innerHTML=renderRetBody();
    try{const r=await api(`/search/text?q=${encodeURIComponent(q)}&top_k=10`);if(seq===s.textSeq)s.textRes=r}catch(e){if(seq===s.textSeq)toast(`搜尋失敗：${e.message}（${e.code}）`)}
    if(seq!==s.textSeq)return;
    s.busy=false;if(STATE.view==='retrieval')$('#retBody').innerHTML=renderRetBody();
  },
  selReq:a=>{STATE.selReq=a;$('#trList').innerHTML=renderTraceList();$('#trDetail').innerHTML=renderTraceDetail()},
  exportReq:a=>{
    // 用 Blob 在本機產生下載，不經過任何網路
    const blob=new Blob([JSON.stringify(reqById(a),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),el=document.createElement('a');
    el.href=url;el.download=a+'.json';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast(`已匯出 ${a}.json`);
  },
  openOut:a=>{STATE.perm.tab='out';STATE.perm.out=a;go('perm')},
  // 已經在 07：go() 不會重新進頁，要自己換訂閱；不在 07 時進頁會照 STATE.jobs.sel 開始觀察
  openJob:a=>{const was=JOBS.active;STATE.jobs.sel=a;STATE.jobs.filter='';go('jobs');if(was)jobShow(a)},
  retTab:a=>{STATE.ret.tab=a;render()},
  selCand:a=>{STATE.ret.sel=a;$('#retBody').innerHTML=renderRetBody()},
  selImg:a=>{STATE.ret.img=a;$('#retBody').innerHTML=renderRetBody()},
  cmpRun:()=>{
    const s=STATE.cmp,q=s.q.trim(),artwork_id=s.artwork||REAL.artworks?.items?.[0]?.id;
    if(!q||!artwork_id)return toast('先選畫作、輸入問題');
    CMP.ctl?.abort();
    const ctl=CMP.ctl=new AbortController(),run=++CMP.run;
    CMP.req={question:q,artwork_id};CMP.cols={};
    CMP_COLUMNS.forEach(c=>CMP.cols[c.key]={state:'run',answer:'',sources:[],done:null,error:''});
    if(STATE.view==='compare')render();
    CMP_COLUMNS.forEach(c=>cmpRunCol(c,run,ctl.signal));
  },
  cmpPick:a=>{STATE.cmp.q=a;render()},
  savePrompt:()=>{STATE.promptEdits[STATE.promptSel]=$('#promptText').value;render();toast('已儲存為實驗版 prompt (僅本頁記憶體)')},
  resetPrompt:()=>{delete STATE.promptEdits[STATE.promptSel];render();toast('已重設為原始 prompt')},
  selKb:a=>{STATE.kb.sel=a;render()},
  intakeToggle:()=>{INTAKE.open=!INTAKE.open;render()},
  intakeAgain:()=>{intakeReset();intakePaint()},
  intakeResumeRetry:()=>{if(!INTAKE.resumeErr)return;INTAKE.resumeErr.retrying=true;intakePaint();intakeResume(true)},
  // 領域選錯（INTAKE_WRONG_DOMAIN）：同一張照片改用另一邊重新建檔，不用重傳
  intakeRetry:a=>{INTAKE.domain=a;intakeStart(INTAKE.imageId,a)},
  intakeView:a=>{INTAKE.view=+a;intakePaint()},
  intakeSave:()=>intakeAct('save',run=>intakeSaveEdits(run)),
  intakeCommit:()=>intakeAct('commit',async run=>{
    // 沒儲存的修改先存：驗證沒過的話後端會擋收錄
    if(Object.keys(INTAKE.edits).length)await intakeSaveEdits(run);
    if(INTAKE.run!==run)return;
    const d=await api(`/intake/${encodeURIComponent(INTAKE.draft.draft_id)}/commit`,{method:'POST'});
    if(INTAKE.run!==run)return;
    INTAKE.draft=d;intakeSettle(run);
  }),
  intakeDiscard:()=>intakeAct('discard',async run=>{
    await api(`/intake/${encodeURIComponent(INTAKE.draft.draft_id)}`,{method:'DELETE'});
    if(INTAKE.run!==run)return;
    intakeReset();intakePaint();toast('已捨棄草稿');
  }),
  rebuild:a=>{
    STATE.kb.rebuilding=a;render();toast(`開始重建 ${a} 索引…`);
    setTimeout(()=>{const i=MOCK_DATA.kb.find(x=>x.id===a);i.stale=false;i.indexed='2026-10-23';if(i.id==='mfg-002')i.ver='rev D';STATE.kb.rebuilding=null;if(STATE.view==='kb')render();toast(`${a} 索引重建完成`)},1500);
  },
  // 篩選只重畫清單：詳情、事件與訂閱都不動
  jobFilter:a=>{STATE.jobs.filter=a;jobsPaint('list')},
  selJob:a=>{if(a!==STATE.jobs.sel||!JOBS.f)jobSelect(a)},
  cancelJob:()=>jobCancel(),
  // 串流還連著就不用重來；斷線、出錯、輪詢中或已結束，就從最後收到的事件接著讀
  jobsRefresh:()=>{
    jobsLoad({status:true});
    const id=STATE.jobs.sel;
    if(id&&JOB_ID_RE.test(id)&&!['live','connecting','loading','reconnecting'].includes(JOBS.f?.state))jobFollow(id);
  },
  jobRetryFollow:()=>{const id=STATE.jobs.sel;if(id&&JOB_ID_RE.test(id))jobFollow(id)},
  liveRetry:()=>{LIVE.state='connecting';renderLive();render();liveConnect()},
  permTab:a=>{STATE.perm.tab=a;render()},
  selOut:a=>{STATE.perm.out=a;render()},
  flowScene:a=>{FLOW.playing=false;flowLoad(+a)},
  flowRun:()=>{
    const q=STATE.flowIn.text.trim(),img=STATE.flowIn.img;
    if(!q&&!img)return toast('先輸入一段文字或附一張圖');
    if(isLive())return flowRunLive(q,img);
    const i=flowPick(q,!!img);
    FLOW.playing=true;flowReset(i);FLOW.ask=(img?`〔附圖 ${img.name}〕`:'')+q;render();
    toast(`照「${FLOW_SCENARIOS[i].tab}」情境演示`);
  },
  flowAttach:()=>$('#flFile').click(),
  flowImgClear:()=>{URL.revokeObjectURL(STATE.flowIn.img.url);STATE.flowIn.img=null;$('#flRunImg').innerHTML=''},
  ask:a=>sendChat(a),
  chatToggle:()=>{STATE.chat.collapsed=!STATE.chat.collapsed;applyChatLayout()},
  pane:a=>{STATE.chat.pane=a;applyChatLayout()}
};

  intakeField:(v,t)=>{

  permRole:v=>{STATE.perm.role=v;render()},

$('#chatResize').addEventListener('pointerdown',e=>{
  const el=e.currentTarget,left=$('.chat').getBoundingClientRect().left;

  const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);document.body.classList.remove('is-resizing')};
  el.setPointerCapture(e.pointerId);document.body.classList.add('is-resizing');
  el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
});
$('#chatResize').addEventListener('dblclick',()=>setChatW(CHAT_W.def));
$('#chatResize').addEventListener('keydown',e=>{
