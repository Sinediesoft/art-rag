<!doctype html>
<!--
  ArtRAG 開發者平台：放在 frontend/public，和主介面同源，開 http://localhost:5173/developer-workbench.html
  （開發時 Vite 把 /api 轉給 8000）或 http://localhost:8000/developer-workbench.html（展示模式由後端提供）。
  只呼叫同源的 /api/v1（憑證是主介面同一個 HttpOnly cookie）；連不上（直接雙擊檔案、後端沒啟動）就整頁用 MOCK_DATA。
  有接上的區塊用真的資料；後端還沒有 API 的區塊保留模擬資料，並標「模擬」。
  互動狀態放 STATE、後端回應放 REAL／LD（09 資料流的進度另放 FLOW）。
  字型從 Google Fonts 載入（JetBrains Mono、Noto Sans TC），沒網路時改用系統字型，其他照常。
-->
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multimodal-RAG 開發者平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* =====================================================================
   版面照 demo/flow-command-center：終端機視窗、直角細框、邊框上掛標籤、分段進度條
   顏色照入口介面 frontend/src/styles/entry.css（01 Quiet）：只有一種墨色，綠黃紅只用在狀態；
   指揮台的紫（入口・人）和藍（執行中）都收進墨色，選中、執行中改靠發光和閃爍區分
   ===================================================================== */
:root {
  color-scheme: dark;
  --ground: #090908;
  --bg: #0f0f0e;
  --surface: #151514;
  --surface-2: #1c1b1a;
  --surface-3: #262523;
  --text: #f1efea;
  --text-2: #b7b2aa;
  --text-3: #7c776f;
  --line: #2a2927;
  --line-2: #201f1d;
  --line-3: #3b3936;
  --accent: #f1efea;
  --on-accent: #0f0f0e;
  --glow: rgb(241 239 234 / 0.14);
  --ok: #6fbf8a;
  --warn: #e0b46a;
  --danger: #ff7a6e;
  --code-bg: #1c1b1a;
  --scrim: rgb(0 0 0 / 0.6);
  --shadow-win: 0 30px 80px rgb(0 0 0 / 0.6), 0 0 0 1px rgb(0 0 0 / 0.4);
  --shadow-pop: 0 18px 40px rgb(0 0 0 / 0.45);
  --font-mono: "JetBrains Mono", "Noto Sans TC", "Microsoft JhengHei", ui-monospace, monospace;
  --font-cjk: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --bar-h: 44px;
  --chat-w: 380px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --ground: #efede8;
  --bg: #faf9f7;
  --surface: #ffffff;
  --surface-2: #f2f0ec;
  --surface-3: #e7e4de;
  --text: #161514;
  --text-2: #57534d;
  --text-3: #8a857e;
  --line: #e4e0d9;
  --line-2: #eeebe6;
  --line-3: #cfcac2;
  --accent: #161514;
  --on-accent: #faf9f7;
  --glow: rgb(22 21 20 / 0.1);
  --ok: #3d7a52;
  --warn: #a86a1f;
  --danger: #b0322a;
  --code-bg: #f2f0ec;
  --scrim: rgb(22 21 20 / 0.3);
  --shadow-win: 0 30px 80px rgb(22 21 20 / 0.12), 0 0 0 1px rgb(22 21 20 / 0.04);
  --shadow-pop: 0 18px 40px rgb(22 21 20 / 0.1);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
/* 整頁不捲動，照藝術模組：標題列、對話欄固定，只有右邊的內容區（.term-body）自己捲 */
body {
  overflow: hidden;
  background: var(--ground);
  color: var(--text);
  font: 13px/1.55 var(--font-mono);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage {
  max-width: 1400px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  padding: 16px;
}

/* ---------- 終端機視窗：填滿畫面，標題列固定在上面，下面的兩欄佔掉剩下的高度 ---------- */
.term {
  height: 100%;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  box-shadow: var(--shadow-win);
  overflow: hidden;
}
.term-bar {
  flex: none;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  height: var(--bar-h);
  padding: 0 8px 0 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  font-size: 11px;
  color: var(--text-3);
}
.bar-end { display: flex; align-items: center; gap: 2px; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-right: 8px;
  padding: 1px 8px;
  border: 1px solid currentColor;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--warn);
  white-space: nowrap;
}
.pill::before { content: ""; width: 7px; height: 7px; background: currentColor; }
.pill[data-state="live"] { color: var(--ok); }
.pill[data-state="connecting"] { color: var(--text-3); }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  background: none;
  border: 1px solid transparent;
  color: var(--text-2);
  cursor: pointer;
}
.icon-btn:hover, .icon-btn.on { color: var(--text); border-color: var(--line); }
.icon-btn svg { width: 16px; height: 16px; }

.term-body {
  display: grid;
  align-content: start;
  gap: 16px;
  min-height: 0;
  overflow-y: auto;
  padding: 22px 22px 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

/* ---------- 標題 ---------- */
.hero { text-align: center; display: grid; gap: 6px; }
.hero h1 {
  margin: 0;
  font-family: var(--font-cjk);
  font-weight: 700;
  font-size: clamp(22px, 2.6vw, 30px);
  letter-spacing: 0.01em;
  line-height: 1.2;
  text-wrap: balance;
  background: linear-gradient(90deg, var(--text), var(--text-3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 14px var(--glow));
}
.hero p { margin: 0; font-family: var(--font-cjk); color: var(--text-2); font-size: 13px; }
.rule { height: 4px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line-2); }

/* ---------- 八個頁面的分頁（取代原本的左側欄）：黏在內容區最上面，捲到哪都切得到 ---------- */
.views {
  position: sticky;
  /* 黏的位置算在 .term-body 的 padding 內側；扣掉上方 22px padding 才會貼齊內容區頂端 */
  top: -22px;
  z-index: 15;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: -8px -22px 0;
  padding: 8px 22px;
  background: var(--bg);
}
.tab, .btn {
  background: transparent;
  border: 1px solid var(--line);
  padding: 5px 10px;
  cursor: pointer;
  color: var(--text-2);
  font-size: 12px;
  line-height: 1.5;
}
.tab b { color: var(--text-3); font-weight: 500; margin-right: 6px; }
.tab:hover, .btn:hover { border-color: var(--line-3); color: var(--text); }
.tab[aria-selected="true"], .tabs .btn.on {
  border-color: var(--accent);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--glow), 0 0 16px var(--glow);
}
.tab[aria-selected="true"] b { color: var(--text); }
.cnt { margin-left: 6px; padding: 0 5px; border: 1px solid var(--warn); color: var(--warn); font-size: 10px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { opacity: 0.88; color: var(--on-accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

/* ---------- 頁面骨架 ---------- */
main { min-width: 0; }
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.head h2 { margin: 0; font: 700 16px/1.3 var(--font-cjk); }
.head h2::before { content: "▸"; margin-right: 8px; color: var(--text-3); font-family: var(--font-mono); }
.sp { flex: 1; }
.muted { color: var(--text-3); font-size: 12px; }
.grid { display: grid; gap: 16px 14px; margin-bottom: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.row > h3 { font: 700 14px/1.4 var(--font-mono); color: var(--text); }
label { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; }

/* ---------- 卡片：照指揮台「邊框上掛標籤」，第一個 h3 壓在上框線 ---------- */
.card {
  position: relative;
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 12px 14px;
}
.card:has(> h3:first-child) { padding-top: 20px; }
/* 13px 的標籤往上凸約 10px，控制列下面的 10px 間距不夠 */
.row + :is(.grid, .card, #retBody) { margin-top: 10px; }
main > .card, #evResult > .card { margin-bottom: 16px; }
/* 下一張卡片的標籤會往上凸半行，沒留距離就壓到這行字 */
#evResult > .muted { margin-bottom: 16px; }
.card h3 { margin: 14px 0 6px; font: 500 12px/1.5 var(--font-cjk); color: var(--text-2); letter-spacing: 0.04em; }
/* 標籤橫跨框線：上半截接視窗底色、下半截接卡片底色，框線才像從標籤兩側穿過 */
.card > h3:first-child {
  position: absolute;
  top: -0.75em;
  left: 12px;
  max-width: calc(100% - 24px);
  margin: 0;
  padding: 0 6px;
  background: linear-gradient(var(--bg) 50%, var(--surface) 50%);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card .card > h3:first-child { background: var(--surface); }
/* 詳情卡的標題是那一筆的名稱，和請求追蹤、背景工作詳情的編號（.row > h3）一樣大 */
.card > h3.title:first-child { font: 700 14px/1.5 var(--font-mono); color: var(--text); }

/* ---------- 數字格（照指揮台上方那排） ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { border: 1px solid var(--c, var(--line)); padding: 6px 12px 8px; min-width: 0; }
.stat small { display: block; font-size: 10.5px; letter-spacing: 0.1em; color: var(--text-3); }
.stat strong {
  display: block;
  font-size: 20px;
  font-weight: 700;
  color: var(--c, var(--text));
  font-variant-numeric: tabular-nums;
}

/* ---------- 表格 ---------- */
.tw { overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
th { color: var(--text-3); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; border-bottom-color: var(--line); }
tr.click { cursor: pointer; }
tr.click:hover, tr.sel { background: var(--surface-2); }
tr.sel > td:first-child { box-shadow: inset 2px 0 0 var(--accent); }

/* ---------- 狀態徽章：照指揮台的描邊小方塊，顏色只分通過／提醒／擋下／執行中 ---------- */
.b {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 6px;
  border: 1px solid currentColor;
  font-size: 10.5px;
  font-weight: 500;
  line-height: 1.6;
  letter-spacing: 0.04em;
  color: var(--text-3);
  white-space: nowrap;
}
.b::before { content: ""; width: 5px; height: 5px; background: currentColor; }
.b.ok, .b.success, .b.done, .b.up { color: var(--ok); }
.b.warn, .b.nodata, .b.fallback, .b.degraded, .b.queued, .b.stale { color: var(--warn); }
.b.bad, .b.blocked, .b.error, .b.failed, .b.down, .b.block { color: var(--danger); }
.b.running, .b.info { color: var(--text); }
.b.running::before { animation: blink 1s steps(1) infinite; }
/* 接上後端時，還沒有 API、仍是模擬資料的區塊：虛線框，和真的狀態徽章分得開 */
.b.mock { border-style: dashed; color: var(--warn); }
.b.mock::before { display: none; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- 表單 ---------- */
input, select, textarea {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 5px 8px;
  font-size: 12.5px;
}
input[type="range"], input[type="checkbox"] { accent-color: var(--accent); padding: 0; vertical-align: middle; }
textarea { width: 100%; min-height: 150px; resize: vertical; font-size: 12px; line-height: 1.55; }
pre {
  margin: 6px 0;
  padding: 10px 12px;
  background: var(--code-bg);
  border: 1px solid var(--line-2);
  border-left: 2px solid var(--line-3);
  white-space: pre-wrap;
  word-break: break-word;
  font: 12px/1.55 var(--font-mono);
  max-height: 280px;
  overflow: auto;
}
ul { margin: 4px 0 8px; padding-left: 18px; }
li::marker { color: var(--text-3); }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 10px; font-size: 12.5px; }
.kv b { color: var(--text-3); font-weight: 500; }
.kv span { min-width: 0; overflow-wrap: anywhere; }
a.lnk {
  color: var(--text);
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--line-3);
  text-underline-offset: 3px;
}
a.lnk:hover { text-decoration-color: var(--text); }

/* ---------- 進度條：指揮台的分段條，一格 6px、間隔 2px ---------- */
.bar, .prog { height: 10px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 8px); }
.bar i, .prog i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 8px); }
.prog { margin: 10px 0 2px; }
.prog i { transition: width 0.15s; }

/* ---------- 七階段瀑布圖 ---------- */
.wf { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 12px; margin: 4px 0; }
.wf > span:first-child { font-family: var(--font-cjk); }
.wf .tr { position: relative; height: 12px; background: var(--line-2); }
.wf .tr i { position: absolute; top: 0; bottom: 0; min-width: 3px; }

/* ---------- 檢索候選 ---------- */
.cand { border: 1px solid var(--line); padding: 8px 10px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
.cand:hover { border-color: var(--line-3); }
.cand.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--glow), 0 0 14px var(--glow); }
.cand.out { opacity: 0.5; }

/* ---------- 開發助理：照藝術模組的對話欄（標題、說明、對話、輸入框），一樣放左側 ---------- */
/* 欄寬分兩層：--chat-w 是拖出來的寬度（JS 寫在 .term-main 上），--chat-col 是實際欄寬：
   最多佔 45%，瀏覽器放大、視窗變窄時內容區才不會被擠扁；收合時換成窄條但保留拖好的寬度 */
.term-main {
  --chat-col: min(var(--chat-w), 45%);
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: var(--chat-col) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
}
.term-main.is-collapsed { --chat-col: 44px; }
.term-main > .term-body { min-width: 0; }
.chat {
  position: relative;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  border-right: 1px solid var(--line);
  background: var(--bg);
}
.chat-head { display: flex; align-items: flex-start; gap: 8px; padding: 22px 12px 14px 20px; border-bottom: 1px solid var(--line-2); }
.chat-head-text { flex: 1; min-width: 0; }
.chat-toggle { flex: none; margin-top: -6px; }
/* 右邊框的拖曳把手：照藝術模組的 .msplit（拖曳、雙擊回預設、← → 微調） */
.chat-resize { position: absolute; top: 0; right: -4px; z-index: 5; width: 8px; height: 100%; cursor: col-resize; }
.chat-resize::after { content: ""; position: absolute; inset: 0 3px; transition: background-color 0.15s; }
.chat-resize:hover::after, .chat-resize:focus-visible::after, .is-resizing .chat-resize::after { background: var(--line-3); }
.chat-resize:focus-visible { outline: none; }
.is-resizing { cursor: col-resize; user-select: none; }
.term-main.is-collapsed .chat { grid-template-rows: auto; }
.term-main.is-collapsed .chat-head { justify-content: center; padding: 10px 6px; border-bottom: 0; }
.term-main.is-collapsed .chat-toggle { margin-top: 0; }
.term-main.is-collapsed :is(.chat-head-text, .chat-thread, .chat-dock, .chat-resize) { display: none; }
.chat-title { margin: 0 0 2px; font: 700 16px/1.3 var(--font-cjk); }
/* 窄螢幕「對話｜工作台」切換：照藝術模組窄於 900px 時的 .mtabs */
.panes { display: none; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.chat-by { margin: 0; font: 12px/1.5 var(--font-cjk); color: var(--text-2); }
.chat-thread {
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.chat-hint { margin: 0; font: 12.5px/1.6 var(--font-cjk); color: var(--text-3); }
.chat-sugs { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.chat-sugs .btn { font-family: var(--font-cjk); text-align: left; }
.msg { display: grid; gap: 4px; font: 13px/1.6 var(--font-cjk); }
.msg-who { font: 500 10px/1.4 var(--font-mono); letter-spacing: 0.16em; color: var(--text-3); }
.msg p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg ul { margin: 4px 0 0; }
.msg-user { justify-items: end; }
.msg-user p { max-width: 85%; padding: 7px 11px; background: var(--surface-2); border: 1px solid var(--line); }
.thinking::after {
  content: "";
  display: inline-block;
  width: 0.55em;
  height: 1.05em;
  vertical-align: -2px;
  background: var(--text-2);
  animation: blink 1s steps(1) infinite;
}
.chat-dock { padding: 10px 20px 16px; border-top: 1px solid var(--line-2); }
.chat-input { display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 10px; border: 1px solid var(--line); background: var(--surface); }
.chat-input:focus-within { border-color: var(--accent); }
.chat-input textarea {
  flex: 1;
  width: auto;
  min-height: 0;
  max-height: 120px;
  padding: 4px 0;
  border: 0;
  background: transparent;
  resize: none;
  font: 13px/1.5 var(--font-cjk);
}
/* 外框的 :focus-within 已經標出焦點，輸入框本身不再畫一圈 */
.chat-input textarea:focus-visible { outline: none; }
.chat-send {
  flex: none;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
}
.chat-send svg { width: 15px; height: 15px; }
.chat-send:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---------- 提示與對話框 ---------- */
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
.toast {
  max-width: 340px;
  padding: 9px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  box-shadow: var(--shadow-pop);
  font: 12.5px/1.5 var(--font-cjk);
}
#dlg { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px; background: var(--scrim); }

/* ---------- 09 資料流：照 demo/flow-command-center 的入口 → 四條線 × 三張卡 → 落點；顏色收進墨色 ---------- */
/* 內容區寬度跟著對話欄拖寬、收合而變，用容器查詢判斷版面，不看整個視窗 */

.fl-bar .tabs { margin: 0; }
.fl-bar .btn b { color: var(--text-3); font-weight: 500; margin-right: 4px; }
.fl-bar .btn.on b { color: var(--text); }
/* 執行列的外框沿用對話欄的 .chat-input；附圖只在本機產生縮圖，不上傳 */
.fl-run { align-items: center; margin-bottom: 12px; }
.fl-run .btn { flex: none; }
.fl-run-img { display: flex; align-items: center; gap: 6px; max-width: 40%; font-size: 11px; color: var(--text-2); }
.fl-run-img:empty { display: none; }
.fl-run-img img { flex: none; width: 32px; height: 32px; object-fit: cover; border: 1px solid var(--line); }

.stats.fl-stats { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.fl-stats .stat strong { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-board { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 16px; }

.fl-path { margin: 0 0 10px; }
.fl-journey ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.fl-journey li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; font: 12.5px/1.45 var(--font-cjk); color: var(--text-3); }
.fl-journey li::before { content: ""; width: 8px; height: 8px; margin-top: 5px; border: 1px solid var(--text-3); border-radius: 50%; }
.fl-journey li[data-state="now"] { color: var(--text); }
.fl-journey li[data-state="now"]::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.fl-journey li[data-state="done"] { color: var(--text-2); }
.fl-journey li[data-state="done"]::before { border-color: var(--ok); background: var(--ok); }
.fl-foot { grid-template-columns: 5em minmax(0, 1fr); margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line-2); font-size: 11.5px; }

.fl-flow { display: grid; gap: 10px; min-width: 0; }
.fl-entry {
  justify-self: center;

  gap: 6px;
  padding: 10px 14px 12px;

.fl-entry-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fl-entry-head b { font-size: 14px; }
.fl-entry-head span { color: var(--text-2); font-family: var(--font-cjk); }

.fl-ask { margin: 0; font-family: var(--font-cjk); color: var(--text-2); overflow-wrap: anywhere; }

.fl-caption, .fl-report { text-align: center; font: 11px/1.5 var(--font-cjk); color: var(--text-3); }

/* 四條線：上方虛線從入口分出去接到每條線，跟指揮台一樣 */
.fl-lanes { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--fl-gap); padding-top: 26px; }
.fl-lanes::before { content: ""; position: absolute; top: 8px; left: calc((100% - 3 * var(--fl-gap)) / 8); right: calc((100% - 3 * var(--fl-gap)) / 8); border-top: 1px dashed var(--line-3); }
.fl-lanes::after { content: ""; position: absolute; top: -8px; left: 50%; height: 16px; border-left: 1px dashed var(--line-3); }

.fl-lane-head b { font-weight: 500; color: var(--text-3); font-variant-numeric: tabular-nums; }
.fl-lane[data-done="true"] .fl-lane-head b { color: var(--ok); }

.fl-card {

.fl-where { margin: 0; font-size: 10.5px; color: var(--text-3); overflow-wrap: anywhere; }
.fl-note { margin: 0; min-height: 2.9em; font: 11px/1.4 var(--font-cjk); color: var(--text-3); overflow-wrap: anywhere; }

.fl-card[data-state="run"] .fl-card-bar i { width: 72%; transition: width 1.4s ease-out; }
.fl-card:is([data-state="hold"], [data-state="block"]) .fl-card-bar i { width: 72%; }
.fl-card[data-state="done"] .fl-card-bar i { width: 100%; transition: width 0.3s; }

@keyframes fl-pulse { 50% { box-shadow: 0 0 0 1px var(--c), 0 0 14px color-mix(in srgb, var(--c) 45%, transparent); } }

.fl-report { margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line-3); }

.fl-output {

.fl-progress { display: grid; grid-template-columns: auto minmax(0, 1fr) 4ch; align-items: center; gap: 10px; }

.fl-progress[data-done="true"] b { color: var(--ok); }
.fl-progress[data-done="true"] .prog i { background: repeating-linear-gradient(90deg, var(--ok) 0 6px, transparent 6px 8px); }

.fl-log ol {

  padding: 0;

.fl-log li[data-kind="block"] .who { color: var(--danger); }
.fl-log li[data-kind="final"] :is(.who, .what) { color: var(--ok); }
.fl-log .what { font-family: var(--font-cjk); overflow-wrap: anywhere; }
.fl-log li.empty { display: block; color: var(--text-3); font-family: var(--font-cjk); }

@container (max-width: 820px) {
  .fl-board { grid-template-columns: minmax(0, 1fr); }
  .fl-journey ol { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .stats.fl-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .fl .g2 { grid-template-columns: minmax(0, 1fr); }
}
@container (max-width: 600px) {
  .fl-lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-top: 0; row-gap: 18px; }
  .fl-lanes::before, .fl-lanes::after, .fl-lane::before { display: none; }

}
@container (max-width: 380px) {

}

}

@media (prefers-reduced-motion: reduce) {

}

  if(!from)return '—';

/* ===== 後端連線：和主介面同源（frontend/public），憑證是主介面同一個 HttpOnly cookie，瀏覽器自動帶 ===== */
// 連不上（直接雙擊檔案、後端沒啟動、被別的靜態伺服器提供）就整頁沿用 MOCK_DATA，不標「模擬」（頁首已經寫了）；
// 接上時，有 API 的區塊改讀 LD（從 REAL 轉成 MOCK_DATA 同樣的格式，畫面程式不用分兩套），沒有 API 的區塊標「模擬」
const API_BASE='/api/v1';
const LIVE={state:'connecting',account:null,accounts:[],demo:false,error:'',loadedAt:''};
const REAL={},REAL_ERR={},LD={};
const isLive=()=>LIVE.state==='live';
const isReal=k=>isLive()&&k in LD;
const pick=k=>isReal(k)?LD[k]:MOCK_DATA[k];
const MOCK_TAG='<span class="b mock" title="後端還沒有這個 API，這裡仍是模擬資料">模擬</span>';
const mockTag=k=>isLive()&&!(k in LD)?MOCK_TAG:'';

class ApiErr extends Error{constructor(code,message,status){super(message);this.code=code;this.status=status}}
// 和主介面 frontend/src/api/http.ts 相同：憑證過期或後端重啟換了金鑰，向 /auth/accounts 重新取得（預設一般員工）再重送一次；
// 簽章不符（TOKEN_INVALID）不重送，那是被竄改的憑證
const RENEWABLE=new Set(['UNAUTHENTICATED','TOKEN_EXPIRED','TOKEN_STALE']);
async function apiFetch(path,init={},retried=false){
  let res;
  try{res=await fetch(API_BASE+path,init)}catch(e){if(e.name==='AbortError')throw e;throw new ApiErr('NETWORK_ERROR','連不上後端',0)}
  if(res.status===401&&!retried&&!path.startsWith('/auth/')){
    const body=await res.clone().json().catch(()=>null);
    if(RENEWABLE.has(body?.error?.code)){await fetch(API_BASE+'/auth/accounts').catch(()=>{});return apiFetch(path,init,true)}
  }
  return res;
}
async function apiError(res){const b=await res.json().catch(()=>null);return new ApiErr(b?.error?.code||'HTTP_'+res.status,b?.error?.message||res.statusText,res.status)}
async function api(path,init){
  const res=await apiFetch(path,init);
  if(!res.ok)throw await apiError(res);
  return res.json();
}
const postJson=body=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
// EventSource 只支援 GET，/chat 是 POST，所以用 fetch 讀串流；事件格式見 shared/sse_events.md
async function apiStream(path,body,onEvent,signal){
  const res=await apiFetch(path,{...postJson(body),signal});
  if(!res.ok)throw await apiError(res);
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const {value,done}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n\n'))>=0){
      const block=buf.slice(0,i);buf=buf.slice(i+2);
      let ev='message',data='';
      for(const line of block.split('\n')){if(line.startsWith('event:'))ev=line.slice(6).trim();else if(line.startsWith('data:'))data+=line.slice(5).trim()}
      if(data)onEvent(ev,JSON.parse(data));
    }
  }
}

async function liveConnect(){
  try{
    const acc=await api('/auth/accounts');
    Object.assign(LIVE,{account:acc.current,accounts:acc.accounts,demo:acc.demo_controls});
  }catch(e){
    Object.assign(LIVE,{state:'offline',error:e.message});renderLive();render();return;
  }
  await liveLoad();
}
// 一個來源失敗（不是主管回 403、背景工作沒啟用回 503）只影響那一塊，其他照常用真的資料
const LIVE_SOURCES={status:'/status',memory:'/memory',diag:'/admin/diagnostics',sec:'/security/logs?limit=50',audit:'/audit?limit=50',evalRuns:'/eval/runs',artworks:'/artworks',parts:'/parts',jobs:'/jobs?limit=50'};
async function liveLoad(){
  const keys=Object.keys(LIVE_SOURCES),res=await Promise.allSettled(keys.map(k=>api(LIVE_SOURCES[k])));
  keys.forEach((k,i)=>{if(res[i].status==='fulfilled'){REAL[k]=res[i].value;delete REAL_ERR[k]}else{delete REAL[k];REAL_ERR[k]=res[i].reason}});
  Object.assign(LIVE,{state:'live',loadedAt:ymdhm(new Date())+':'+pad2(new Date().getSeconds())});
  STATE.kb.detail={};
  liveAdapt();renderLive();render();
}
const SEC_STAGE={1:'第 1 段 授權',2:'第 2 段 輸入防護',4:'第 4 段 段落驗證',7:'第 7 段 輸出檢查'};
function liveAdapt(){
  for(const k of Object.keys(LD))delete LD[k];
  const {status:st,diag:dg}=REAL,m=REAL.memory||st?.memory;
  if(st){
    const sv=Object.entries(st.strategies||{}).map(([k,s])=>({name:s.model?`${s.label}（${s.model}）`:s.label,status:s.available?'up':'down',detail:s.detail||k}));
    sv.push({name:'Jev（第 2、4～6 段）',status:st.system1?.jev_configured?'up':'degraded',detail:st.system1?.detail||''});
    if(dg){
      sv.push({name:'資料庫',status:dg.db?'up':'down',detail:dg.db?'連線正常':'連不上'});
      sv.push({name:'索引與 manifest',status:dg.index_consistent?'up':'degraded',detail:dg.index_consistent?`知識庫 ${dg.kb_version}`:dg.index_problems.join('；')});
      if(dg.scheduler)sv.push({name:'排程求解器',status:dg.scheduler.available?'up':'down',detail:`${dg.scheduler.engine}${dg.scheduler.version?' '+dg.scheduler.version:''} · ${dg.scheduler.detail}`});
    }
    const j=st.jobs;
    sv.push(j?.enabled?{name:`背景工作 Workers (${j.workers.length})`,status:j.broker_ok&&j.database_ok&&j.workers.length?'up':'degraded',detail:j.workers.map(w=>w.name).join('、')||'沒有 worker 在線'}:{name:'背景工作',status:'down',detail:'沒啟用（/status 的 jobs）'});
    LD.services=sv;
    if(j?.enabled)LD.queues={...j.counts,pending_dispatch:j.pending_dispatch};
  }
  if(m?.enabled){
    const gb=mb=>mb/1024;
    LD.resources={ram:[gb(m.total_mb-m.available_mb),Math.round(gb(m.total_mb))],vram:m.gpu?[gb(m.gpu.used_mb),Math.round(gb(m.gpu.total_mb))]:null};
  }
  if(m?.models?.length)LD.models=m.models.map(x=>({name:x.label,role:x.where,ver:x.key,status:x.loaded?'up':x.loaded===false?'idle':'—',res:`${x.pool==='gpu'?'VRAM':'RAM'} 約 ${(x.approx_mb/1024).toFixed(1)} GB${x.in_use?' · 使用中':''}`}));
  if(dg){
    const s1=dg.system1||{};
    LD.settings=[['llm_mode',dg.llm_mode],['embed_mode',dg.embed_mode],['allow_cloud',dg.allow_cloud],['kb_version',dg.kb_version,'kb/VERSION'],
      ...Object.entries(s1.thresholds||{}).map(([k,v])=>[`system1.thresholds.${k}`,v]),['system1.clarify_margin',s1.clarify_margin],['system1.timeout_s',s1.timeout_s],
      ...Object.entries(st?.chat_defaults||{}).map(([k,v])=>[`chat_defaults.${k}`,v]),['demo_controls',dg.demo_controls],['eval_controls',dg.eval_controls]]
      .filter(r=>r[1]!=null).map(([k,v,note])=>[k,String(v),'diagnostics',note||'']);
    LD.recent={routes:dg.recent_routes||[],chats:dg.recent_chats||[],sql:dg.recent_sql||[]};
  }
  if(REAL.artworks||REAL.parts){
    const probs=dg?.index_problems||[],stale=id=>probs.some(p=>p.includes(id));
    LD.kb=[...(REAL.artworks?.items||[]).map(a=>({id:a.id,type:'art',title:a.title_zh,ver:'—',chunks:null,source:[a.artist_zh,a.date_text,a.collection].filter(Boolean).join(' · '),conf:'公開',indexed:REAL.artworks.kb_version,stale:stale(a.id)})),
      ...(REAL.parts?.items||[]).map(p=>({id:p.id,type:'drawing',title:`${p.part_no} ${p.name_zh}`,ver:'rev '+p.revision,chunks:null,source:[p.drawing_no,p.category,p.material].filter(Boolean).join(' · '),conf:p.confidentiality,indexed:REAL.parts.kb_version,stale:stale(p.id)}))];
    if(!LD.kb.some(i=>i.id===STATE.kb.sel))STATE.kb.sel=LD.kb[0]?.id||null;
  }
  if(REAL.jobs){
    const ST={succeeded:'done'};
    LD.jobs=REAL.jobs.items.map(j=>{const s=ST[j.status]||j.status;return {id:j.id,type:j.kind==='cad'?'3D 重建':'排程',status:s,worker:'—',attempt:j.attempt,max:j.max_attempts,queue:j.kind,runtime:dur(j.started_at,j.finished_at),req:null,
      events:[`${hms(j.created_at)} 建立`,j.started_at&&`${hms(j.started_at)} 開始`,j.cancel_requested&&'已要求取消',j.finished_at&&`${hms(j.finished_at)} ${STATUS_LABEL[s]||s}`,j.error&&`錯誤 ${j.error.code}：${j.error.message}`,j.progress&&`進度 ${JSON.stringify(j.progress)}`].filter(Boolean),
      artifacts:j.artifacts.map(a=>a.name),urls:j.artifacts.map(a=>a.url)}});
    if(!LD.jobs.some(j=>j.id===STATE.jobs.sel))STATE.jobs.sel=LD.jobs[0]?.id||null;
  }
  if(LIVE.accounts.length)LD.matrix=LIVE.accounts;
  if(REAL.sec)LD.secLogs=REAL.sec.items.map(l=>[hms(l.created_at),l.no,l.account_label||l.account_id||'—',SEC_STAGE[l.stage]||`第 ${l.stage} 段`,l.rule+(l.judge?`（${l.judge}）`:''),l.request_id||'']);
  if(REAL.audit)LD.changeAudit=REAL.audit.items.map(a=>[ymdhm(a.at),a.actor_label||a.actor_id,a.op||a.action,a.summary||'',a.ref_no||'']);
  if(REAL.evalRuns)LD.evalRuns=REAL.evalRuns.runs;
}

  const jobs=pick('jobs'),real=isReal('jobs'),f=STATE.jobs.filter,list=jobs.filter(j=>!f||j.status===f),j=jobs.find(x=>x.id===STATE.jobs.sel);
  const showId=id=>real?shortId(id):id;
  // 背景工作沒啟用（.env 沒有 REDIS_URL）時 GET /jobs 回 503 JOBS_UNAVAILABLE，這頁就留著模擬資料
  const why=isLive()&&!real&&REAL_ERR.jobs?`<p class="muted">${MOCK_TAG} GET /jobs：${esc(REAL_ERR.jobs.message)}（${esc(REAL_ERR.jobs.code)}）</p>`:'';
  return `<div class="head"><h2>背景工作</h2>${mockTag('jobs')}${real?'<span class="muted">GET /jobs：目前身分看得到的最近 50 個</span>':''}</div>${why}
  <div class="tabs">${['','running','queued','done','failed','cancelled'].map(s=>`<button class="btn ${f===s?'on':''}" data-act="jobFilter" data-arg="${s}">${s?STATUS_LABEL[s]:'全部'} (${jobs.filter(x=>!s||x.status===s).length})</button>`).join('')}</div>
  <div class="grid"><div class="card"><div class="tw"><table><tr><th>ID</th><th>類型</th><th>狀態</th><th>Worker</th><th>嘗試</th><th>佇列</th><th>執行時間</th></tr>${list.map(x=>`<tr class="click ${x.id===STATE.jobs.sel?'sel':''}" data-act="selJob" data-arg="${esc(x.id)}"><td title="${esc(x.id)}">${esc(showId(x.id))}</td><td>${x.type}</td><td>${badge(x.status)}</td><td>${x.worker}</td><td>${x.attempt}/${x.max}</td><td>${x.queue}</td><td>${x.runtime}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">無</td></tr>'}</table></div></div>
  <div class="card">${j?`<div class="row"><h3 style="margin:0" title="${esc(j.id)}">${esc(showId(j.id))}</h3>${badge(j.status)}<span class="sp"></span>
  ${real?'<button class="btn" disabled title="後端沒有重試的 API">重試</button>':`<button class="btn" data-act="retryJob" ${['failed','cancelled'].includes(j.status)&&j.attempt<j.max?'':'disabled'}>重試</button>`}<button class="btn" data-act="cancelJob" ${['running','queued'].includes(j.status)?'':'disabled'}>取消</button></div>
  <div class="kv"><b>相關請求</b><span>${j.req?`<a class="lnk" data-act="openReq" data-arg="${j.req}">${j.req}</a>`:'無'}</span></div>
  <h3 style="margin-top:10px">事件</h3><pre>${j.events.map(esc).join('\n')}</pre><h3>產出物</h3>${j.artifacts.map((a,i)=>`<div class="row" style="margin:4px 0">📄 ${esc(a)}<span class="sp"></span>${real?`<a class="btn" href="${esc(j.urls[i])}" target="_blank" rel="noopener">下載</a>`:`<button class="btn" data-act="previewArt" data-arg="${i}">預覽</button>`}</div>`).join('')||'<div class="muted">尚無</div>'}`:'<div class="muted">請點選工作</div>'}</div></div>`;
}

// 接上後端：角色矩陣用 /auth/accounts 列的展示帳號（ops、views、資料範圍都是 shared/access.yaml 算出來的）
function renderMatrixReal(){
  const accs=LD.matrix,sel=accs.find(a=>a.id===STATE.perm.role)||accs[0];
  const ops=[...new Set(accs.flatMap(a=>a.ops))],views=[...new Set(accs.flatMap(a=>a.views||[]))];
  const row=(label,has)=>`<tr><td>${esc(label)}</td>${accs.map(a=>`<td>${has(a)?'✅':'—'}</td>`).join('')}</tr>`;
  return `<div class="card"><h3>角色與權限（GET /auth/accounts）</h3><div class="tw"><table><tr><th>操作／檢視</th>${accs.map(a=>`<th>${esc(a.label)}</th>`).join('')}</tr>
  ${ops.map(o=>row(`操作 ${o}`,a=>a.ops.includes(o))).join('')}${views.map(v=>row(`檢視 ${v}`,a=>(a.views||[]).includes(v))).join('')}
  <tr><td>資料領域</td>${accs.map(a=>`<td>${esc((a.domains||[]).join('、')||'—')}</td>`).join('')}</tr><tr><td>機密等級</td>${accs.map(a=>`<td>${esc((a.levels||[]).join('、')||'—')}</td>`).join('')}</tr></table></div>
  <p class="muted">開發者平台沒有自己的角色：診斷、稽核、評估照 access.yaml 的 views 只開給主管。</p></div>
  <div class="card"><h3>帳號細節</h3><div class="row"><select data-in="permRole">${accs.map(a=>`<option value="${esc(a.id)}" ${a.id===sel.id?'selected':''}>${esc(a.label)}</option>`).join('')}</select></div>
  <div class="kv"><b>角色</b><span>${esc(sel.role_label)}（${esc(sel.role)}）</span><b>說明</b><span>${esc(sel.note||'—')}</span><b>資料範圍</b><span>${esc(sel.scope_note||'—')}</span><b>部門</b><span>${esc((sel.depts||[]).join('、')||'—')}</span><b>可標註的畫</b><span>${esc((sel.artworks||[]).join('、')||'—')}</span></div></div>`;
}
function renderPermBody(){
  const p=STATE.perm,d=MOCK_DATA;
  if(p.tab==='matrix'&&isReal('matrix'))return renderMatrixReal();
  if(p.tab==='sec'&&isReal('secLogs'))return `<div class="card tw"><table><tr><th>時間</th><th>編號</th><th>身分</th><th>哪一段</th><th>規則</th><th>request_id</th></tr>${LD.secLogs.map(l=>`<tr>${l.slice(0,5).map(x=>`<td>${esc(x)}</td>`).join('')}<td title="${esc(l[5])}">${esc(shortId(l[5]))}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">還沒有紀錄</td></tr>'}</table><p class="muted">GET /security/logs：今天各段 ${esc(Object.entries(REAL.sec.today||{}).map(([k,v])=>`第 ${k} 段 ${v} 筆`).join('、')||'沒有')}</p></div>`;
  if(p.tab==='audit'&&isReal('changeAudit')){
    const reads=REAL.audit.reads||[];
    return `<div class="card tw"><h3>變更稽核（GET /audit）</h3><table><tr><th>時間</th><th>操作者</th><th>操作</th><th>摘要</th><th>編號</th></tr>${LD.changeAudit.map(a=>`<tr>${a.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="5" class="muted">還沒有紀錄</td></tr>'}</table></div>
    <div class="card tw"><h3>機密資料讀取</h3><table><tr><th>時間</th><th>身分</th><th>圖紙</th><th>等級</th><th>讀了什麼</th></tr>${reads.map(r=>`<tr><td>${esc(ymdhm(r.created_at))}</td><td>${esc(r.account_label||r.account_id)}</td><td>${esc(r.part_id)}</td><td>${esc(r.level||'—')}</td><td>${esc(r.what)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">還沒有紀錄</td></tr>'}</table></div>`;

  const err=REAL_ERR[{sec:'sec',audit:'audit'}[p.tab]];

  return `<p class="muted">${MOCK_TAG} ${esc(why)}</p>`+renderPermMock();
}

function flowClock(ms){const s=ms/1000;return s<60?s.toFixed(1)+' s':`${Math.floor(s/60)}m ${String(Math.round(s%60)).padStart(2,'0')}s`}
function flowWall(start,ms){const [h,m,s]=start.split(':').map(Number),t=h*3600+m*60+s+Math.floor(ms/1000),p=v=>String(v).padStart(2,'0');return `${p(Math.floor(t/3600)%24)}:${p(Math.floor(t/60)%60)}:${p(t%60)}`}

function flowReset(i){
  const sc=FLOW_SCENARIOS[i];clearTimeout(FLOW.timer);clearInterval(FLOW.typing);FLOW.abort?.abort();
  Object.assign(FLOW,{idx:i,step:0,finished:false,live:false,noImage:false,model:'',run:FLOW.run+1,abort:null,clock:0,blocks:0,holds:0,egress:'0 B',role:sc.role,ask:sc.ask,entry:'等待輸入',j:-1,chip:-1,out:['idle','等 12 段回報'],cards:sc.cards.map(()=>({s:'queued',note:'等待'})),log:[]});
}
function flowLoad(i){flowReset(i);if(STATE.view==='flow')render()}
// 連不上後端時沒有真的意圖路由：用有沒有附圖＋關鍵字挑最接近的現成情境；排程是唯一不從上傳照片開始的情境
function flowPick(q,hasImg){
  const key=!hasImg?'schedule':/3D|圖紙|零件|重建|庫存/i.test(q)?'factory':/建檔|收錄|索引/.test(q)?'intake':'art';
  return FLOW_SCENARIOS.findIndex(s=>s.key===key);
}
// 接上後端：照主介面 frontend/src/shell/runner.ts 的順序真的走一次——附圖先 POST /images → POST /agent/route →
// 判斷是問答才 POST /chat。卡片沿用「拍照問畫」那一列，它畫的就是 /agent/route → /chat 這條路。
// /chat 沒有逐段事件：第 3～6 段在 sources 一次到、第 7 段在 done 才到，所以卡片分三批亮
async function flowRunLive(q,img){
  flowReset(0);
  const run=FLOW.run,ctl=new AbortController(),t0=Date.now();
  Object.assign(FLOW,{live:true,playing:true,abort:ctl,noImage:!img,role:LIVE.account.label,ask:(img?`〔附圖 ${img.name}〕`:'')+q});
  render();
  let cur=null;
  // 中途切情境或再按一次執行，flowReset 會換掉 run，這一輪之後的回應就不再寫進畫面
  const step=st=>{if(FLOW.run!==run)return;if(st.s==='run')cur=st.c;FLOW.clock=Date.now()-t0;flowApply(st)};
  const skip=(c,note)=>step({c,s:'queued',note});
  const finish=(j,out)=>{if(FLOW.run!==run)return;FLOW.clock=Date.now()-t0;Object.assign(FLOW,{finished:true,playing:false,j,out});flowSync()};
  try{
    let imageId=null;
    if(img){
      step({j:0,c:0,s:'run',note:'上傳中',log:['使用者',`附上 ${img.name}`]});
      const fd=new FormData();fd.append('file',img.file);
      const up=await api('/images',{method:'POST',body:fd,signal:ctl.signal});imageId=up.image_id;
      step({c:0,s:'done',note:`image_id ${up.image_id}`,ev:'/images',log:['前端',`POST /images → ${up.image_id}（${up.width}×${up.height}）`]});
    }else skip(0,'沒附圖，略過');
    step({j:1,c:1,s:'run',note:'送到統一入口',r:'POST /agent/route',log:['使用者',q?`送出「${q}」`:'只附照片送出']});
    const r=await api('/agent/route',{...postJson({question:q,image_id:imageId}),signal:ctl.signal});
    step({c:1,s:'done',note:r.pii.length?`${r.pii.length} 項換成代號`:'沒有個資',egress:`${r.egress.bytes} B`});
    if(r.photo){
      const hit=!!r.photo.id;
      step({c:2,s:'done',note:r.photo.domain==='art'?'畫作':r.photo.domain==='mfg'?'圖紙':'分不出來'});
      step({c:3,s:hit?'done':'block',note:r.photo.label});
      step({c:4,s:hit?'done':'block',note:hit?`對到 ${r.photo.id}`:'沒有對到'});
    }else [2,3,4].forEach(c=>skip(c,'沒附圖，略過'));
    step({c:5,s:'done',note:`${r.intent_label} · ${r.confidence.toFixed(2)}`,ev:'/agent/route',r:`${r.intent} ${r.confidence.toFixed(2)} → ${r.gate}`,log:['agent',`意圖 ${r.intent_label}（${r.router.engine}），閘門 ${r.gate}：${r.gate_reason}`]});
    const ok=r.auth.passed&&(!r.guard||r.guard.passed);
    step({j:2,c:6,s:ok?'done':'block',note:ok?`${r.account.label} · 第 2 段 ${r.guard?.engine??'略過'}`:clip(r.blocked?.reason||r.blocked?.rule||'擋下',40),
      log:['guard',ok?`第 1 段授權 pass · 第 2 段 ${r.guard?.verdict??'略過'}（${r.guard?.engine??'—'}）`:`第 ${r.blocked?.stage??'?'} 段擋下：${r.blocked?.rule??''} ${r.blocked?.log_no??''}`]});
    if(!ok)return finish(2,['block',`第 ${r.blocked?.stage??'?'} 段擋下：${r.blocked?.reason||r.blocked?.rule||''}`]);
    if(r.outcome==='short_circuit'){step({log:['agent',`第 ${r.short_circuit.stage} 段直接回覆（${r.short_circuit.kind}）`]});return finish(3,['done',r.short_circuit.reply])}
    const d=r.dispatch||{};
    // 只有問答走 /chat；3D 重建、排程、改資料、庫存、搜尋等分流這張圖還沒接，留給主介面
    const target=r.gate!=='direct'?null:r.intent==='art_qa'?(d.artwork_id?{artwork_id:d.artwork_id}:d.global_qa?{}:null):r.intent==='drawing_qa'&&d.part_id?{part_id:d.part_id}:null;
    if(!target){step({log:['前端',`分流到「${r.intent_label}」（閘門 ${r.gate}），資料流還沒接這一類，請到主介面操作`]});return finish(3,['block',`分流到「${r.intent_label}」：這一類還沒接到資料流`])}
    step({c:7,s:'run',note:'檢索中',log:['前端','POST /chat']});
    let answer='',first=true,gated=false;
    await apiStream('/chat',{question:d.question||q||(target.part_id?'這張圖紙的重點是什麼？':'請介紹這幅畫'),...target,route_ticket:r.route_ticket},(ev,data)=>{
      if(ev==='sources'){
        const at=n=>(data.pipeline||[]).find(p=>p.stage===n),pf=data.post_filter,s3=at(3),bad=[4,5,6].map(at).find(p=>p?.status==='block');
        step({c:7,s:s3?.status==='block'?'block':'done',note:`${data.candidates??data.sources.length} 段候選`,log:['bge-m3',s3?`第 3 段 ${s3.name}：${s3.detail}`:'檢索完成']});
        step({c:8,s:bad?'block':'done',note:pf?`留 ${pf.kept}/${pf.candidates} 段 · ${pf.engine==='jev'?'Jev':'地端'}`:'沒有驗證（關檢索）',ev:'sources',log:[pf?.engine==='jev'?'jev':'guard',bad?`第 ${bad.stage} 段擋下：${bad.detail}`:`第 4～6 段 pass，留 ${data.sources.length} 段`]});
        // 生成閘門沒過：後端送一句降級回應，不組 prompt、不呼叫生成端
        if(bad){gated=true;skip(9,'閘門沒過，沒組');skip(10,'閘門沒過，沒呼叫')}
        else{step({c:9,s:'done',note:`${data.sources.length} 段參考資料`});step({c:10,s:'run',note:`${data.strategy} 生成中`});FLOW.model=data.strategy}
      }else if(ev==='token'){
        answer+=data.text;
        if(first&&!gated){step({c:10,s:'done',note:'生成完，先在伺服器收齊',ev:'token'});step({c:11,s:'run',note:'輸出檢查通過，送出中'})}
        first=false;
      }else if(ev==='done'){
        const s7=(data.pipeline||[]).find(p=>p.stage===7),blocked=s7?.status==='block'||data.degraded;
        if(data.model)FLOW.model=data.model;
        step({j:3,c:11,s:blocked?'block':'done',note:s7?`${s7.status} · ${s7.by}`:'完成',ev:'done',egress:`${r.egress.bytes+(data.egress?.bytes||0)} B`,
          log:['guard',`done · ${data.model??''} · 總耗時 ${fmtMs(data.latency_ms?.total)}${data.degraded?' · 降級回應':''}`]});
        // 使用者流程停在「出現簡答」：之後進展示區、點出處、追問都要使用者自己操作，這裡沒有發生
        finish(3,[blocked?'block':'done',clip(answer,140)||'（沒有內容）']);
      }else if(ev==='error')throw new ApiErr(data.code,data.message,0);
    },ctl.signal);
    if(FLOW.run===run&&!FLOW.finished){step({log:['前端','串流結束了，但沒有收到 done']});finish(FLOW.j,['block','串流中斷：沒有收到 done'])}
  }catch(e){
    if(e.name==='AbortError'||FLOW.run!==run)return;
    if(cur!=null&&FLOW.cards[cur].s==='run')step({c:cur,s:'block',note:clip(e.message,40)});
    step({log:['前端',`錯誤 ${e.code||''}：${e.message}`]});
    finish(FLOW.j,['block',`${e.message}（${e.code||'ERROR'}）`]);
  }
}
const flowRunImgHtml=()=>{const img=STATE.flowIn.img;return img?`<img src="${img.url}" alt=""><span title="${esc(img.name)}">${esc(img.name)}</span><button type="button" data-act="flowImgClear" aria-label="移除附圖">✕</button>`:''};
function flowSchedule(f){
  clearTimeout(FLOW.timer);
  if(FLOW.live||!FLOW.playing||FLOW.finished||STATE.view!=='flow')return;
  FLOW.timer=setTimeout(flowTick,FLOW_BASE_MS*f);
}
// 切到別頁時計時器到了也不走下一步，切回來由 render() 接著排
function flowTick(){
  const steps=FLOW_SCENARIOS[FLOW.idx].steps;
  if(STATE.view!=='flow'||FLOW.step>=steps.length)return;
  const st=steps[FLOW.step++];
  flowApply(st);
  flowSchedule(st.wait||(st.s==='run'?0.75:1));
}
function flowApply(st){
  const sc=FLOW_SCENARIOS[FLOW.idx];
  if(st.ms)FLOW.clock+=st.ms;
  if(st.ask)FLOW.ask=st.ask;
  if(st.role)FLOW.role=st.role;
  if(st.j!=null)FLOW.j=st.j;
  if(st.c!=null){FLOW.cards[st.c]={s:st.s,note:st.note||FLOW.cards[st.c].note};if(st.s==='block')FLOW.blocks++;if(st.s==='hold')FLOW.holds++}
  if(st.ev)FLOW.chip=Math.max(FLOW.chip,sc.chips.indexOf(st.ev));
  if(st.egress)FLOW.egress=st.egress;
  if(st.out)FLOW.out=st.out;
  if(st.log){const [who,what]=st.log;FLOW.log.push({t:FLOW.live?hms():flowWall(sc.startAt,FLOW.clock),who,what,kind:st.s==='block'?'block':st.s==='hold'?'hold':st.final?'final':FLOW_HUMANS.has(who)?'human':'sys'})}
  if(st.final){FLOW.finished=true;FLOW.j=sc.journey.length}
  flowSync();
  if(st.r)flowType(st.r);
}
function flowType(text){
  FLOW.entry=text;clearInterval(FLOW.typing);
  const el=$('#flEntry');if(!el)return;
  if(FLOW_REDUCE){el.textContent=text;return}
  let n=0;el.textContent='';
  FLOW.typing=setInterval(()=>{el.textContent=text.slice(0,++n);if(n>=text.length)clearInterval(FLOW.typing)},22);
}

  return stat('段落完成',`${done}/12`,done===12?'ok':'')+stat('擋下・待確認',`擋下 ${FLOW.blocks} · 待確認 ${FLOW.holds}`,now('block')?'danger':now('hold')?'warn':'')
    +stat('資料外送',FLOW.egress)+stat('用到的模型',esc(FLOW.model||FLOW_SCENARIOS[FLOW.idx].model))+stat(FLOW.live?'實際耗時':'示意時間',flowClock(FLOW.clock));
}

}

const flowLogHtml=()=>FLOW.log.map(l=>`<li data-kind="${l.kind}"><time>${l.t}</time><span class="who">${esc(l.who)}</span><span class="what">${esc(l.what)}</span></li>`).join('')||'<li class="empty">— 等待第一個事件 —</li>';

function flowSync(){
  if(STATE.view!=='flow')return;
  const done=flowDone(),pct=Math.round(done/12*100);
  FLOW.cards.forEach((c,ci)=>{const el=$('#flCard'+ci);if(el.dataset.state!==c.s){el.dataset.state=c.s;el.querySelector('.fl-st').innerHTML=flowBadge(c.s)}el.querySelector('.fl-note').textContent='› '+c.note});
  FLOW_SCENARIOS[FLOW.idx].lanes.forEach((l,li)=>{const n=flowLaneDone(li),el=$('#flLane'+li);el.dataset.done=String(n===3);el.querySelector('.fl-lane-head b').textContent=n+'/3'});
  $('#flStatus').innerHTML=flowStatus();
  $('#flStats').innerHTML=flowStatsHtml();$('#flJourney').innerHTML=flowJourneyHtml();
  $('#flRole').textContent='身分 '+FLOW.role;$('#flAsk').textContent=FLOW.ask;
  $('#flOut').dataset.state=FLOW.out[0];$('#flOutText').textContent=FLOW.out[1];
  $('#flChips').innerHTML=flowChipsHtml();
  $('#flProgress').dataset.done=String(done===12);$('#flProg').style.width=pct+'%';$('#flPct').textContent=pct+'%';
  const log=$('#flLog');log.innerHTML=flowLogHtml();log.scrollTop=log.scrollHeight;
}
// 資料流的快捷鍵：正在打字、拖對話欄（它自己用了方向鍵）、開著對話框時都不攔
function flowKey(e){
  const t=e.target instanceof Element?e.target:document.body;
  // 執行列：Enter 執行、Shift+Enter 換行；輸入法還在選字時按 Enter 不執行
  if(t.id==='flDraft'){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ACT.flowRun()}return}
  if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey||t.closest('input,textarea,select')||$('#dlg').classList.contains('open'))return;
  if(/^[1-4]$/.test(e.key))ACT.flowScene(e.key-1);
}

/* ===== 開發助理：不連伺服器，只從 MOCK_DATA 比對關鍵字回答 ===== */
const CHAT_SUGS=['R-1023-009 為什麼失敗？','J-2041 現在怎樣？','今天有哪些阻擋？'];
const reqLink=r=>`<a class="lnk" data-act="openReq" data-arg="${r.id}">${r.id}</a>`;
const jobLink=j=>`<a class="lnk" data-act="openJob" data-arg="${j.id}">${j.id}</a>`;
function botReply(q){
  const u=q.toUpperCase(),rid=u.match(/R-\d{4}-\d{3}/)?.[0],jid=u.match(/J-\d{4}/)?.[0];
  if(rid){
    const r=reqById(rid);
    if(!r)return `<p>找不到 ${esc(rid)}，這份模擬資料只有 R-1023-001～010。</p>`;
    const stop=r.stages.find(s=>s.note);
    return `<p>${reqLink(r)}（${r.time}・${esc(r.role)}・${MODULE_LABEL[r.module]}）${STATUS_LABEL[r.status]}，總延遲 ${(totalMs(r)/1000).toFixed(2)} s。${stop?`停在「${esc(stop.name)}」：${esc(stop.note)}。`:'七段都通過。'}${r.error?`\n訊息：${esc(r.error)}`:''}</p>`;
  }
  if(jid){
    const j=MOCK_DATA.jobs.find(x=>x.id===jid);
    if(!j)return `<p>找不到 ${esc(jid)}，背景工作只有 J-2040～2045。</p>`;
    return `<p>${jobLink(j)}（${j.type}）${STATUS_LABEL[j.status]}，第 ${j.attempt}/${j.max} 次・Worker ${j.worker}。最後的事件：${esc(j.events.at(-1))}。</p>`;
  }
  // 依關鍵字挑出異常的請求；只說「異常」沒指定哪一種就全部列
  const kinds=[[/阻擋|擋/,'blocked'],[/錯誤|失敗|error|fail/i,'error'],[/拒答|無資料/,'nodata'],[/備援|fallback/i,'fallback']].filter(([re])=>re.test(q)).map(([,k])=>k);
  if(kinds.length||/異常|問題|狀況/.test(q)){
    const want=kinds.length?kinds:['blocked','error','nodata','fallback'];
    const list=MOCK_DATA.requests.filter(r=>want.includes(r.status));
    const jobs=/失敗|fail/i.test(q)?MOCK_DATA.jobs.filter(j=>j.status==='failed'):[];
    if(!list.length&&!jobs.length)return '<p>今天沒有這類的請求。</p>';
    return `<p>今天共 ${list.length} 筆${jobs.length?`，另有 ${jobs.length} 個失敗的背景工作`:''}：</p><ul>${list.map(r=>`<li>${reqLink(r)} ${STATUS_LABEL[r.status]}・${esc(r.q.slice(0,18))}…</li>`).join('')}${jobs.map(j=>`<li>${jobLink(j)} ${j.type} 失敗</li>`).join('')}</ul>`;
  }
  return '<p>我只讀這頁的模擬資料，可以問：某筆請求（例如 R-1023-009）、某個背景工作（例如 J-2041），或今天的阻擋／錯誤／拒答／備援。</p>';
}
function renderChat(){
  const c=STATE.chat,th=$('#chatThread');
  th.innerHTML=c.msgs.length
    ?c.msgs.map(m=>m.who==='user'?`<div class="msg msg-user"><span class="msg-who">YOU</span><p>${esc(m.text)}</p></div>`:`<div class="msg msg-bot"><span class="msg-who">ASSISTANT</span>${m.html||'<p class="thinking"></p>'}</div>`).join('')
    :`<p class="chat-hint">問這頁的請求、背景工作或今天的異常，回答會附上可以點開的連結。</p><div class="chat-sugs">${CHAT_SUGS.map(s=>`<button type="button" class="btn" data-act="ask" data-arg="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
  $('#chatSend').disabled=c.busy;
  th.scrollTop=th.scrollHeight;
}
/* 對話欄寬度與收合：和其他互動一樣只存在記憶體，重新整理回到預設 */
const CHAT_W={min:280,max:640,def:380};
function applyChatLayout(){
  const c=STATE.chat,label=c.collapsed?'展開對話欄':'收合對話欄',b=$('#chatToggle');
  $('.term-main').style.setProperty('--chat-w',c.w+'px');
  $('.term-main').classList.toggle('is-collapsed',c.collapsed);
  $('.term-main').dataset.pane=c.pane;
  $('#paneChat').setAttribute('aria-selected',String(c.pane==='chat'));$('#paneWork').setAttribute('aria-selected',String(c.pane==='work'));
  b.title=label;b.setAttribute('aria-label',label);b.setAttribute('aria-expanded',String(!c.collapsed));
  $('#chatResize').setAttribute('aria-valuenow',c.w);
}
function setChatW(w){STATE.chat.w=Math.round(Math.min(CHAT_W.max,Math.max(CHAT_W.min,w)));applyChatLayout()}
function sendChat(text){
  const q=text.trim(),c=STATE.chat;if(!q||c.busy)return;
  c.msgs.push({who:'user',text:q},{who:'bot',html:''});c.busy=true;$('#chatInput').value='';renderChat();
  // 停半秒再回答，模擬本地模型在想
  setTimeout(()=>{c.msgs[c.msgs.length-1].html=botReply(q);c.busy=false;renderChat()},500);
}

/* ===== 主繪製 ===== */
const RENDERERS={overview:renderOverview,trace:renderTrace,retrieval:renderRetrieval,eval:renderEval,models:renderModels,kb:renderKb,jobs:renderJobs,perm:renderPerm,flow:renderFlow};

/* ===== 點擊動作 ===== */
const ACT={
  go:a=>go(a),closeDlg,
  theme:()=>{STATE.theme=STATE.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=STATE.theme;renderThemeBtn();toast(`已切換為${STATE.theme==='dark'?'深色':'淺色'}主題`)},

    const m=STATE.metrics,j=n=>Math.floor(Math.random()*n);
    m.success+=5+j(10);m.refusal+=j(2);m.block+=j(2);m.error+=j(2);
    const t=MOCK_DATA.trend;t.p50.shift();t.p50.push(+(1.7+Math.random()*.7).toFixed(1));t.p95.shift();t.p95.push(+(4+Math.random()*2.2).toFixed(1));
    MOCK_DATA.resources.vram[0]=+(18+Math.random()*4).toFixed(1);

  openReq:a=>{STATE.selReq=a;STATE.tr={q:'',module:'',status:'',tab:'mock'};go('trace')},
  trTab:a=>{STATE.tr.tab=a;go('trace')},
  // 只有展示模式（DEMO_CONTROLS）且從本機連線時後端才允許免密碼切換；cookie 和主介面共用，主介面的身分也會跟著換
  liveSwitch:async()=>{
    try{const acc=await api('/auth/switch',postJson({account_id:'manager'}));Object.assign(LIVE,{account:acc.current,accounts:acc.accounts});await liveLoad();toast('已切換成主管；同一個瀏覽器裡主介面的身分也跟著換了')}
    catch(e){toast(`切換失敗：${e.message}（${e.code}）`)}
  },
  retSearch:async()=>{
    const s=STATE.ret,q=s.q.trim();if(!q)return toast('先輸入查詢');
    s.busy=true;$('#retBody').innerHTML=renderRetBody();
    try{s.textRes=await api(`/search/text?q=${encodeURIComponent(q)}&top_k=10`)}catch(e){toast(`搜尋失敗：${e.message}（${e.code}）`)}

  },
  selReq:a=>{STATE.selReq=a;$('#trList').innerHTML=renderTraceList();$('#trDetail').innerHTML=renderTraceDetail()},
  addEval:a=>{
    const r=reqById(a);if(STATE.pendingCases.some(p=>p.from===a))return toast(`${a} 已在待加入案例中`);
    STATE.pendingCases.push({id:'P-'+String(STATE.pendingCases.length+1).padStart(2,'0')+a.slice(-3),q:r.q,module:r.module,from:a});renderNav();toast(`已加入評估待辦：${a} (共 ${STATE.pendingCases.length} 筆)`);
  },
  exportReq:a=>{
    // 用 Blob 在本機產生下載，不經過任何網路
    const blob=new Blob([JSON.stringify(reqById(a),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),el=document.createElement('a');
    el.href=url;el.download=a+'.json';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast(`已匯出 ${a}.json`);
  },
  openOut:a=>{STATE.perm.tab='out';STATE.perm.out=a;go('perm')},
  openJob:a=>{STATE.jobs.sel=a;STATE.jobs.filter='';go('jobs')},
  retTab:a=>{STATE.ret.tab=a;render()},
  selCand:a=>{STATE.ret.sel=a;$('#retBody').innerHTML=renderRetBody()},
  selImg:a=>{STATE.ret.img=a;$('#retBody').innerHTML=renderRetBody()},
  runEval:()=>{
    const e=STATE.ev;e.running=true;e.progress=0;e.result=null;render();
    const timer=setInterval(()=>{
      e.progress+=10;const bar=$('#evProg');if(bar)bar.style.width=e.progress+'%';
      if(e.progress<100)return;
      clearInterval(timer);e.running=false;
      // 依勾選項目調整模擬分數，讓控制項對結果有可見影響
      const bonus=(e.rearr?.03:0)-(e.conflict?.06:0)+(e.cp.includes('實驗')?.02:0)+(e.image?.01:0);
      const qs=[...EVAL_Q[e.domain],...STATE.pendingCases.map(p=>p.q)];
      const sample=e.domain==='art'?'《谿山行旅圖》為北宋范寬所作，採高遠構圖 [1]。':'FLG-2002：8 孔 Ø18 mm，PCD 180 [1]。';
      e.result={base:{model:e.base+' / '+e.bp,answer:sample,q:.82,lat:2.4,cite:91},
        cand:{model:e.cand+' / '+e.cp,answer:sample+(e.conflict?'\n(注意：證據 [2] 與 [1] 年代描述不一致)':''),q:+(.82+bonus).toFixed(2),lat:+(2.4+(e.image?.6:0)-(e.rearr?.1:0)).toFixed(1),cite:Math.round(91+bonus*100)},
        reg:qs.map((q,i)=>[q,i!==2,bonus>=0?true:i%2===0])};
      e.history.unshift({t:'10-23 '+new Date().toTimeString().slice(0,5),d:e.domain,s:`base 0.82 → cand ${e.result.cand.q.toFixed(2)}`});
      if(STATE.view==='eval')render();toast('模擬評估完成');
    },150);
  },
  rmCase:a=>{STATE.pendingCases=STATE.pendingCases.filter(p=>p.id!==a);render();toast('已移除案例')},
  savePrompt:()=>{STATE.promptEdits[STATE.promptSel]=$('#promptText').value;render();toast('已儲存為實驗版 prompt (僅本頁記憶體)')},
  resetPrompt:()=>{delete STATE.promptEdits[STATE.promptSel];render();toast('已重設為原始 prompt')},
  selKb:a=>{STATE.kb.sel=a;render()},
  importDlg:()=>openDlg(`<h3>匯入驗證：batch_2026-10-23.zip (模擬)</h3><div class="tw"><table><tr><th>檔案</th><th>檢查</th><th>結果</th></tr>
    <tr><td>art-021 寒林圖.json</td><td>欄位/授權/機密等級</td><td>${badge('success')}</td></tr><tr><td>mfg-012 FLG-2020.pdf</td><td>標題欄 OCR、料號格式</td><td>${badge('success')}</td></tr>
    <tr><td>mfg-013.dwg</td><td>格式</td><td>${badge('error')} 不支援 DWG，請轉 PDF</td></tr><tr><td>cost_2026Q3.xlsx</td><td>機密等級</td><td>${badge('blocked')} 缺少機密標記</td></tr></table></div>
    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="confirmImport">匯入 2 筆通過項目</button></div>`),
  confirmImport:()=>{
    if(!MOCK_DATA.kb.some(k=>k.id==='art-021')){MOCK_DATA.kb.push({id:'art-021',type:'art',title:'寒林圖',ver:'v1',chunks:7,source:'館藏解說',conf:'公開',indexed:'2026-10-23',stale:false,passages:['§1 李成寒林…'],regions:['寒林']},{id:'mfg-012',type:'drawing',title:'FLG-2020 法蘭',ver:'rev A',chunks:12,source:'PLM 匯出',conf:'內部',indexed:'2026-10-23',stale:false,passages:['6×Ø16 PCD150'],regions:['正視圖']})}
    closeDlg();render();toast('已匯入 2 筆 (模擬)，2 筆被驗證擋下');
  },
  rebuild:a=>{
    STATE.kb.rebuilding=a;render();toast(`開始重建 ${a} 索引…`);
    setTimeout(()=>{const i=MOCK_DATA.kb.find(x=>x.id===a);i.stale=false;i.indexed='2026-10-23';if(i.id==='mfg-002')i.ver='rev D';STATE.kb.rebuilding=null;if(STATE.view==='kb')render();toast(`${a} 索引重建完成`)},1500);
  },
  jobFilter:a=>{STATE.jobs.filter=a;render()},
  selJob:a=>{STATE.jobs.sel=a;render()},
  retryJob:()=>{const j=MOCK_DATA.jobs.find(x=>x.id===STATE.jobs.sel);j.status='queued';j.attempt++;j.worker='—';j.events.push('14:35 手動重試 → 重新排隊');render();toast(`${j.id} 已重新排隊 (第 ${j.attempt} 次)`)},
  cancelJob:async()=>{
    if(isReal('jobs')){
      try{const r=await api(`/jobs/${encodeURIComponent(STATE.jobs.sel)}/cancel`,{method:'POST'});toast({cancelled:'已取消',cancelling:'已要求取消，worker 停下來後才算取消',already_cancelled:'本來就取消了'}[r.result]||r.result)}
      catch(e){toast(`取消失敗：${e.message}（${e.code}）`)}
      return liveLoad();
    }
    const j=MOCK_DATA.jobs.find(x=>x.id===STATE.jobs.sel);j.status='cancelled';j.events.push('14:35 手動取消');render();toast(`${j.id} 已取消`)},
  previewArt:a=>{
    const j=MOCK_DATA.jobs.find(x=>x.id===STATE.jobs.sel),name=j.artifacts[a];
    const body=/step/i.test(name)?`<svg viewBox="0 0 200 140" width="100%"><ellipse cx="100" cy="50" rx="70" ry="22" fill="none" stroke="var(--accent)"/><ellipse cx="100" cy="90" rx="70" ry="22" fill="none" stroke="var(--accent)"/><line x1="30" y1="50" x2="30" y2="90" stroke="var(--accent)"/><line x1="170" y1="50" x2="170" y2="90" stroke="var(--accent)"/><ellipse cx="100" cy="50" rx="25" ry="8" fill="none" stroke="var(--text)"/></svg><p class="muted">CadQuery 線框示意 (產生中，僅預覽)</p>`
      :`<pre>${esc(JSON.stringify({job:j.id,artifact:name,generatedAt:'2026-10-23',note:'mock content',status:j.status},null,2))}</pre>`;
    openDlg(`<h3>預覽：${esc(name)}</h3>${body}`);
  },
  permTab:a=>{STATE.perm.tab=a;render()},
  selOut:a=>{STATE.perm.out=a;render()},
  flowScene:a=>{FLOW.playing=false;flowLoad(+a)},
  flowRun:()=>{
    const q=STATE.flowIn.text.trim(),img=STATE.flowIn.img;
    if(!q&&!img)return toast('先輸入一段文字或附一張圖');
    if(isLive())return flowRunLive(q,img);
    const i=flowPick(q,!!img);
    FLOW.playing=true;flowReset(i);FLOW.ask=(img?`〔附圖 ${img.name}〕`:'')+q;render();
    toast(`照「${FLOW_SCENARIOS[i].tab}」情境演示`);
  },
  flowAttach:()=>$('#flFile').click(),
  flowImgClear:()=>{URL.revokeObjectURL(STATE.flowIn.img.url);STATE.flowIn.img=null;$('#flRunImg').innerHTML=''},
  ask:a=>sendChat(a),

};

  trStatus:v=>{STATE.tr.status=v;$('#trList').innerHTML=renderTraceList()},

    if(STATE.flowIn.img)URL.revokeObjectURL(STATE.flowIn.img.url);
    STATE.flowIn.img={name:f.name,url:URL.createObjectURL(f),file:f};t.value='';$('#flRunImg').innerHTML=flowRunImgHtml();
  }
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t){if(t.tagName==='A')e.preventDefault();ACT[t.dataset.act]?.(t.dataset.arg,t,e);return}
  if(e.target.id==='dlg')closeDlg();
});
document.addEventListener('input',e=>{const t=e.target.closest('[data-in]');if(t)IN[t.dataset.in]?.(t.value,t)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeDlg();
  else if(e.key==='Enter'&&!e.isComposing&&e.target.dataset?.in==='retQ')ACT.retSearch();
  else if(STATE.view==='flow')flowKey(e);
});
$('#chatForm').addEventListener('submit',e=>{e.preventDefault();sendChat($('#chatInput').value)});
// Enter 送出、Shift+Enter 換行；輸入法還在選字時按 Enter 不送出
$('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendChat(e.target.value)}});

// 拖曳以對話欄左緣為準算寬度；放開前把游標鎖在把手上，拖出視窗也不會斷
$('#chatResize').addEventListener('pointerdown',e=>{
  const el=e.currentTarget,left=$('.chat').getBoundingClientRect().left;
  const move=ev=>setChatW(ev.clientX-left);
  const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);document.body.classList.remove('is-resizing')};
  el.setPointerCapture(e.pointerId);document.body.classList.add('is-resizing');
  el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
});
$('#chatResize').addEventListener('dblclick',()=>setChatW(CHAT_W.def));
$('#chatResize').addEventListener('keydown',e=>{
  const d={ArrowLeft:-16,ArrowRight:16}[e.key];
  if(d){e.preventDefault();setChatW(STATE.chat.w+d)}
  else if(e.key==='Home'||e.key==='Enter'){e.preventDefault();setChatW(CHAT_W.def)}
});

renderThemeBtn();
renderChat();
applyChatLayout();
render();
liveConnect();
