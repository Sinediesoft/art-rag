<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'">
  <title>萊問</title>
  <style>
    :root {
      /* 和圖示同一組顏色：深色底、米白字、琥珀點 #B99005 */
      --paper: #121212;
      --card: #1a1a19;
      --ink: #f2f0ea;
      --muted: #a29e95;
      --line: #2f2e2b;
      --amber: #b99005;
      --error: #e2705f;
      --log: #151514;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.6 "Microsoft JhengHei UI", "Microsoft JhengHei", "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(1180px, 100%);
      max-height: 100%;
      display: flex; flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
      padding: 28px 32px;
    }
    header { display: flex; align-items: center; gap: 14px; }
    header img { width: 48px; height: 48px; }
    header .name { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
    header .sub { color: var(--muted); font-size: 13px; }
    header .en { margin-left: 6px; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 3px; }
    h1 { font-size: 20px; margin: 24px 0 4px; }
    .detail { color: var(--muted); margin: 0; }
    .step { margin-top: 14px; min-height: 1.6em; font-variant-numeric: tabular-nums; }
    body:not(.working) .step { display: none; }
    .bar { position: relative; height: 4px; margin-top: 10px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .bar::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 30%;
      background: var(--amber); border-radius: 2px;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide { from { left: -30%; } to { left: 100%; } }
    body:not(.working) .bar { display: none; }
    body.error h1 { color: var(--error); }
    body.warning h1, body.reboot h1 { color: var(--amber); }
    details { margin-top: 18px; min-height: 0; display: flex; flex-direction: column; }
    details[open] { flex: 1; }
    summary { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
    pre {
      margin: 8px 0 0; padding: 12px 14px;
      height: 280px; max-height: 40vh; overflow: auto;
      background: var(--log); border: 1px solid var(--line); color: var(--ink); border-radius: 8px;
      font: 12.5px/1.55 "Cascadia Mono", Consolas, "Microsoft JhengHei UI", monospace;
      white-space: pre-wrap; word-break: break-all;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .actions:empty { display: none; }
    button {
      font: inherit; padding: 8px 18px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
    }
    button:hover { border-color: var(--muted); }
    button.primary { background: var(--amber); border-color: var(--amber); color: #121212; font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    /* 左邊安裝狀態、右邊 AI 助理；視窗窄時上下排 */
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; min-height: 0; }
    @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } }
    .status { min-width: 0; display: flex; flex-direction: column; }
    .assistant {
      display: flex; flex-direction: column; min-height: 440px; margin-top: 24px;
      border-left: 1px solid var(--line); padding-left: 24px;
    }
    @media (max-width: 1000px) { .assistant { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 16px; } }
    .a-head { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 16px; }
    .a-head::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); align-self: center; }
    .a-head small { color: var(--muted); font-weight: 400; font-size: 12px; }
    .msgs { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; margin: 12px 0; max-height: 52vh; }
    .msg { padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
    .msg.bot { background: var(--log); border: 1px solid var(--line); }
    .msg.me { background: #2a2617; border: 1px solid #4a3f12; align-self: flex-end; max-width: 85%; }
    .msg.wait { color: var(--muted); }
    .msg.err { color: var(--error); }
    .msg .who { display: block; color: var(--amber); font-size: 12px; margin-bottom: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chips button { font-size: 13px; padding: 4px 12px; border-radius: 999px; }
    .ask { display: flex; gap: 8px; }
    .ask input {
      flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--log); color: var(--ink);
    }
    .ask input:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body class="working">
  <main class="card">
    <header>
      <img src="build/icon.png" alt="">
      <div>
        <div class="name">萊問 <span class="en">LAIWEN</span></div>
        <div class="sub">全部在這台電腦上執行，資料不外送</div>
      </div>
    </header>
    <div class="cols">
    <section class="status">
    <h1 id="title">準備中</h1>
    <p class="detail" id="detail"></p>
    <div class="step" id="step" aria-live="polite"></div>
    <div class="bar" role="progressbar" aria-label="進行中"></div>
    <details id="more">
      <summary>詳細紀錄</summary>
      <pre id="log"></pre>
    </details>
    <div class="actions" id="actions"></div>
    </section>
    <aside class="assistant" aria-label="AI 助理">
      <div class="a-head">AI 助理 <small>用這台電腦的模型回答，不連網</small></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form class="ask" id="ask">
        <input id="q" maxlength="300" placeholder="有問題可以問我，例如：還要多久？" aria-label="問 AI 助理" autocomplete="off">
        <button class="primary" id="send" type="submit">問</button>
      </form>
    </aside>
    </div>
  </main>
  <script src="splash.js"></script>
</body>
</html>
