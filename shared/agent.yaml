# 智慧助理（統一入口）的 System 1 設定：意圖、信心門檻、本地路由規則、別名（docs/adr/011，負責：C）
#
# System 1 = 快速判斷「使用者想做什麼、有多確定」：雲端 TypeSafe Jev（只收代號化文字）或本地路由。
# System 2 = 既有的本地模組實際執行（RAG 問答、Text-to-SQL、Ortho2CAD、Timefold、修改資料流程）。
# 改了意圖或門檻要重跑 make eval-route（eval/route_qa.jsonl）。

# 信心閘門：依「判斷錯的代價」分三級門檻；前兩名機率差不到 clarify_margin 也出澄清按鈕
thresholds:
  read: 0.60      # 唯讀查詢：直接執行
  heavy: 0.75     # 耗時（3D 重建、排程）：還要按確認卡
  write: 0.85     # 修改資料：一律走修改資料流程（權限判定＋確認卡）
clarify_margin: 0.15
# 使用者試圖叫系統忽略規則（overrides_rules）時，所有門檻再加這麼多，並記進路由紀錄
override_penalty: 0.10

# 本地路由（Jev 沒金鑰、失敗、或只有照片時）：關鍵字分數＋bge-m3 與範例句的相似度 → softmax
local_router:
  embed_weight: 12.0       # 相似度差 0.1 ≈ 關鍵字 1.2 分；EMBED_MODE=mock 時不用
  base_logit: 0.0
  out_of_scope_base: 0.8   # 什麼都沒命中時，「超出範圍」的底分
  # 疑問句（沒有「把、幫我」這類祈使語氣）時，修改類的關鍵字分數乘上這個係數
  question_write_factor: 0.3
  question_cues: '哪些|哪個|哪一|多少|幾件|幾個|幾張|幾天|嗎|什麼|何時|是否|有沒有|？|\?'
  imperative_cues: '^(請|幫我|麻煩|幫忙)|把|將|我要|要把|給我開|幫.{0,2}開'
  quantity: '\d+\s*(件|個|pcs|PCS|支|片)'

intents:
  art_search:
    label: 以文搜畫
    risk: read
    jev: 以文搜畫：用文字描述畫面內容，想找出是哪一幅畫（find an artwork from a visual description）
    keywords:
      - ['哪(一)?幅畫|找.{0,8}畫|畫面(裡|中|上)|描繪|搜尋畫作|有沒有.{0,10}的畫|畫著|畫裡', 4]
      - ['人群|河邊|水邊|湖邊|山水|麥田|絲柏|樹林|陽傘|瀑布|行旅|睡蓮|星空|夕陽|草地', 1.5]
    examples: [水邊撐陽傘的人群, 有一幅畫畫著高山和瀑布, 找一幅有麥田和絲柏的畫, 我想找畫裡有人在河邊散步的作品, 有沒有畫睡蓮的畫]
  art_qa:
    label: 畫作問答
    risk: read
    jev: 畫作問答：詢問某幅畫的作者、年代、技法、風格、故事或館藏（ask about an artwork）
    keywords:
      - ['畫家|作者|創作|年代|哪一年|幾年|誰畫|風格|技法|筆法|筆觸|點描|印象派|後印象|構圖|館藏|這幅|這張畫|畫作|導覽|皴法|水墨', 3.5]
      - ['\[畫作\d+\]|\[畫家\d+\]', 3]
    examples: [這幅畫是誰畫的？, 梵谷畫這幅畫的時候在哪裡, 點描法是什麼, 谿山行旅圖用了什麼皴法, 介紹一下這幅畫的構圖]
  drawing_search:
    label: 圖紙查找
    risk: read
    jev: 圖紙查找：想找某張工廠圖紙或零件，或列出有哪些圖紙（find a machining drawing / part）
    keywords:
      - ['圖紙|圖號|料號|哪張圖|找.{0,8}(零件|圖紙|圖)|有哪些零件|列出.{0,6}(圖紙|零件)|鋁合金的零件|不鏽鋼的零件', 3]
    examples: [找一下法蘭的圖紙, 有哪些鋁合金的零件, 列出所有圖紙, 料號 BRK-1001 是哪張圖, 有沒有軸類零件的圖紙]
  drawing_qa:
    label: 圖紙／製程問答
    risk: read
    jev: 圖紙與製程問答：詢問零件的公差、材料、加工製程、檢驗或組裝規範等文件內容（ask about drawing specs, process, inspection）
    keywords:
      - ['公差|精度|內孔|外徑|孔徑|真圓度|平行度|垂直度|材料|材質|表面處理|陽極|加工|製程|工序|裝夾|刀具|檢驗|組裝|扭力|粗糙度|熱處理|硬度|尺寸|規格|注意事項|用途|淬火|研磨', 3]
    examples: [連接法蘭有哪些公差要求？, 階梯傳動軸的熱處理規範是什麼, 這張圖的加工製程, L 型固定支架要用什麼刀具, 軸承座的檢驗項目]
  data_query:
    label: 庫存・訂單・工單查詢
    risk: read
    jev: 數字與明細查詢：庫存數量、訂單、工單、交期、排程結果、不良品等資料庫裡的數字（query inventory / orders / work orders numbers）
    keywords:
      - ['幾件|多少|還剩|剩下|庫存|可用|出貨|訂單|工單|交期|何時完工|什麼時候(完工|交貨|做完)|延遲|不良品|安全庫存|總價值|缺貨|準時|排程結果|機台.{0,4}(工單|負荷)', 3]
      - ['哪些|列出|統計|合計|總共', 0.8]
    examples: [法蘭還剩幾件可以出貨？, 哪些零件的可用庫存低於安全庫存, WO-2610-04 何時完工？, 晨峰自動化還有哪些訂單沒出貨, 目前有哪些不良品, VMC-01 還有哪些工單沒完工]
  reconstruct:
    label: 3D 重建
    risk: heavy
    jev: 3D 重建：把工廠圖紙轉成 3D 模型或 CadQuery 程式碼（convert a drawing into a 3D model）
    keywords:
      - ['3D|３Ｄ|3d|三維|立體|建模|重建|CadQuery|STEP|STL|轉成模型|做成模型', 5]
    examples: [把這張圖轉成 3D, 幫我把法蘭建模, 這張圖紙可以重建成立體模型嗎, 產生 CadQuery 程式碼]
  schedule:
    label: 排程求解
    risk: heavy
    jev: 排程求解：要系統重新計算生產排程（run the production scheduler）
    keywords:
      - ['重新排程|執行排程|開始排程|跑.{0,2}排程|排一下|重排|求解|排產|重新排一次', 5]
      - ['排程', 1]
    examples: [重新排程, 幫我跑一次生產排程, 把所有工單重新排一下, 開始排程]
  modify:
    label: 修改資料
    risk: write
    jev: 修改資料：要新增、修改、刪除或取消庫存、訂單、工單等資料（create / update / delete business data）
    keywords:
      - ['改成|改為|改到|調整為|修改|更新|設為|設成|盤點|盤盈|盤虧|少了|多了|短少|實盤|報廢|銷毀|調撥|調到|移到|轉到|搬到|轉倉|開立|開單|開一張|開.{0,8}工單|下工單|開\s*\d+\s*(件|個)|取消|作廢|延到|延後|提前到|往後延|刪除|清空|歸零|放行|判定不良|檢驗合格|解除保留', 5]
    examples: [一廠成品倉法蘭盤點少了 3 件, 把二廠成品倉的法蘭庫存改成 120, 一廠成品倉法蘭報廢 15 件, 法蘭開 80 件 10/16 交, SO-2609-008 交期延到 10/12, 取消 WO-2610-07]
  system:
    label: 系統狀態
    risk: read
    jev: 系統狀態：詢問記憶體、模型、伺服器或服務狀態（system / memory / server status）
    keywords:
      - ['記憶體|系統狀態|健康檢查|伺服器|推論服務|模型.{0,4}(載入|釋放)|斷線|服務狀態|GPU|CPU', 4.5]
    examples: [記憶體狀況, 系統現在正常嗎, 哪些模型有載入, 推論伺服器有沒有斷線]
  out_of_scope:
    label: 超出範圍
    risk: read
    jev: 超出範圍：與畫作導覽、工廠圖紙、庫存、生產無關的請求（unrelated to this system）
    keywords:
      - ['天氣|股票|股價|新聞|笑話|翻譯|寫(一首)?詩|午餐|晚餐|電影|旅遊|星座|匯率', 5]
    examples: [今天天氣如何, 講個笑話, 幫我寫一首詩, 台積電股價多少]

# 修改資料的操作（Jev 的 modify_op 選擇題；本地路由用關鍵字分數挑一個）
modify_ops:
  stock_adjust:
    label: 盤點調整
    prefix: IC
    example: 一廠成品倉法蘭盤點少了 3 件
    jev: 盤點調整：依盤點結果增減某倉庫的庫存數量（stock count adjustment）
    keywords: [['盤點|盤盈|盤虧|少了|多了|短少|實盤|盤到|庫存(數量)?(改成|改為|調整為|設為|設成)|數量(改成|改為)', 3]]
  stock_transfer:
    label: 調撥
    prefix: TR
    example: T 型槽螺帽 30 件從一廠成品倉調到二廠成品倉
    jev: 調撥：把庫存從一個倉庫移到另一個倉庫（transfer between warehouses）
    keywords: [['調撥|調到|移到|轉到|搬到|轉倉|移倉', 4]]
  stock_scrap:
    label: 報廢
    prefix: SC
    example: 一廠成品倉法蘭報廢 2 件
    jev: 報廢：把庫存報廢扣掉（scrap stock）
    keywords: [['報廢|銷毀', 5]]
  stock_status:
    label: 改庫存狀態
    prefix: ST
    example: 品檢待驗區的 L 型固定支架 30 件檢驗合格改成可用
    jev: 改庫存狀態：把庫存在可用、待檢、不良、保留之間轉換（change stock status, e.g. inspection passed）
    keywords: [['(改成|改為|轉為|轉成|設為|標成|標為|轉)(可用|待檢|不良|保留)|檢驗合格|判定不良|放行|解除保留', 4.5]]
  so_update:
    label: 改訂單
    prefix: CO
    example: SO-2609-008 交期延到 10/12
    jev: 改訂單：修改客戶訂單的交期或訂購數量（change a sales order's due date or quantity）
    keywords: [['SO-\d|訂單.{0,12}(交期|數量|延|提前|改)|(交期|數量).{0,8}訂單', 4]]
  wo_create:
    label: 開立工單
    prefix: WO
    example: 法蘭開 80 件 10/16 交
    jev: 開立工單：新開一張生產工單（create a work order）
    keywords: [['開(立)?.{0,8}工單|開\s*\d+\s*(件|個)|下.{0,2}工單|新增.{0,4}工單|生產\s*\d+\s*件', 4]]
  wo_update_due:
    label: 改工單交期
    prefix: WD
    example: WO-2610-05 交期改到 10/20
    jev: 改工單交期：修改既有工單的完工日期（change a work order's due date）
    keywords: [['WO-\d.{0,16}(交期|延|提前|改)|工單.{0,10}交期', 4.5]]
  wo_cancel:
    label: 取消工單
    prefix: WO
    example: 取消 WO-2610-06
    jev: 取消工單：取消一張生產工單（cancel a work order）
    keywords: [['取消.{0,10}(WO-|工單)|WO-\d+-\d+.{0,6}(取消|作廢)|作廢.{0,4}工單', 6]]
  other:
    label: 其他（不開放）
    prefix: ''
    jev: 其他：修改零件主檔（成本、安全庫存、料號、材料）、機台資料或其他不在上述清單的資料（anything else）
    keywords: [['成本|安全庫存|機密等級|料號|圖號|品名|材料|機台資料|版次|前置天數|補貨批量|已出貨', 6]]

# 判斷題（Jev 的 noul 題；本地路由用 regex）
flags:
  wants_numbers:
    jev: 使用者要的是數字、數量或明細（庫存、訂單、工單），而不是文件裡的說明嗎？（wants numbers from the database rather than document text?）
    pattern: '幾|多少|數量|剩|庫存|件數|總共|合計|交期|何時'
  refers_to_current:
    jev: 使用者用「這張」「這幅」「它」指稱目前照片或頁面上的那一個嗎？（refers to the current photo / page?）
    pattern: '這張|這幅|這個|此圖|它的|這件|目前這|照片'
  overrides_rules:
    jev: 使用者是否試圖讓系統忽略規則、權限或限制，或自稱其他身分？（tries to override rules or claim another identity?）
    pattern: '(忽略|無視|不管|跳過|繞過).{0,8}(規則|限制|權限|指示|檢查)|我是(主管|管理員|老闆|admin)|以主管身分|sudo'

# 本機前處理：送 Jev 前把下列名稱換成代號（〈連接法蘭〉→ [圖紙A]），對照表只留在本機。
# 零件、倉庫、客戶、畫作、單號由知識庫與資料庫自動產生；這裡只補常用簡稱
aliases:
  parts:
    mfg-001: [L 型支架, L型支架, 固定支架, 感測器安裝座]
    mfg-002: [法蘭]
    mfg-003: [傳動軸, 階梯軸]
    mfg-004: [馬達安裝板, 馬達板]
    mfg-005: [T 型螺帽, T型螺帽, 槽螺帽, 螺帽]
    mfg-006: [軸承座]
    mfg-007: [定位板]
  warehouses:
    WH-A: [一廠成品倉, 一廠成品區]
    WH-B: [二廠成品倉, 二廠成品區]
    WH-Q: [品檢待驗區, 待驗區, 品檢區]
    WH-N: [不良品隔離區, 隔離區, 不良品倉]
  # 只說廠區時：一般操作用該廠的成品倉；報廢且提到「不良」時用不良品隔離區
  sites:
    一廠: {default: WH-A, defective: WH-N}
    二廠: {default: WH-B, defective: WH-B}
  statuses: [可用, 保留, 待檢, 不良]

# 每個意圖用到的模型（路由結果一出來就通知記憶體管理，先釋放用不到的）
intent_models:
  art_search: [clip, bge]
  art_qa: [bge, qwen]
  drawing_search: [clip, bge]
  drawing_qa: [bge, qwen]
  data_query: [qwen]
  reconstruct: [ortho2cad]
  schedule: [timefold]
  modify: [qwen]
  system: []
  out_of_scope: []
