# 展示帳號、角色權限、硬性上限與核准額度（docs/adr/011，負責：B）
#
# - 展示版不用密碼：頁首切換身分（DEMO_CONTROLS=true 才顯示），後端簽發 JWT（HS256，docs/adr/015 第 1 段），
#   內容是 roles、部門（dept／depts）、機密等級（clearance）與效期；所有 /api/v1 請求都驗簽章與效期，
#   不符就 401。Jev 與 Qwen3-VL 都看不到、也決定不了權限；使用者打「我是主管」不會有任何效果。
# - 預設不允許：沒列在角色 ops 裡的操作一律拒絕。零件主檔、機台資料不開放用對話修改。
# - 權限在 API 層檢查：智慧助理、圖紙頁「開立工單」、取消工單、開始排程、展示還原都走同一套規則。
# - 資料範圍（2026-10-02 起）：每個角色能讀哪些資料領域、哪些機密等級與部門，
#   所有讀取 API 都檢查（圖紙清單只列看得到的、看不到的圖紙回 403 DATA_SCOPE_DENIED），
#   智慧助理的向量檢索照 JWT 產生 Metadata Filter（docs/adr/015 第 3 段）。之前是「查詢不限範圍」。

default_account: guest

accounts:
  guest:   {label: 訪客, role: guest}
  wh1:     {label: 倉管・一廠, role: warehouse, warehouses: [WH-A, WH-Q, WH-N]}
  wh2:     {label: 倉管・二廠, role: warehouse, warehouses: [WH-B]}
  sales_a: {label: 業務・甲, role: sales, customers: [晨峰自動化, 栩達設備]}
  sales_b: {label: 業務・乙, role: sales, customers: [岳承精機, 沛宇機電]}
  planner: {label: 生管, role: planner}
  manager: {label: 主管, role: manager}
  # 藝術家（docs/adr/029）：artworks＝可以在哪幾幅畫上圈區域、寫解說；沒列的畫不能標
  artist:  {label: 藝術家・甲, role: artist, artworks: [npm-000001, met-436535]}

roles:
  guest:     {label: 訪客, ops: [], note: 只能查詢}
  warehouse: {label: 倉管, ops: [stock_adjust, stock_transfer, stock_scrap, stock_status], note: 自己廠區的倉庫}
  sales:     {label: 業務, ops: [so_update], note: 自己負責的客戶}
  planner:   {label: 生管, ops: [wo_create, wo_update_due, wo_cancel, schedule_run, demo_reset], note: 全廠；只能取消自己開的工單}
  manager:   {label: 主管, ops: [approve, demo_reset, kb_intake], note: 核准所有人的超額申請；不能核准自己的申請；照片建檔的草稿、藝術家的區域解說只有主管能收錄（docs/adr/013、030）}
  artist:    {label: 藝術家, ops: [kb_annotate], note: 在分給自己的畫上圈區域、寫解說，送出後等主管收錄（docs/adr/029）}

# 資料範圍：domains＝能讀的資料領域（art 畫作知識庫、mfg 工廠圖紙與製程文件、factory 工廠資料庫：庫存／訂單／工單／排程），
# levels＝看得到的機密等級（畫作都是「公開」；圖紙是「內部」或「機密」，見 kb/parts/*.json 的 confidentiality）；
# JWT 的 clearance＝levels 的最高一級（公開 0、內部 1、機密 2）。
# dept＝自己的部門（寫進 JWT）；depts＝讀得到哪些部門的文件（圖紙的部門＝kb/parts/*.json 的 owner）。
# 第 3 段的 Metadata Filter 只照 JWT 產生：clearance <= 自己的等級 AND dept IN (公開＋depts)。
# 沒列在這裡的角色一律只能讀公開畫作。
levels: [公開, 內部, 機密]
clearance:
  guest:     {domains: [art], levels: [公開], dept: 訪客, depts: [], note: 美術館訪客：只查公開的畫作知識庫}
  warehouse: {domains: [art, mfg, factory], levels: [公開, 內部, 機密], dept: 倉儲課, depts: [生產技術課, 機械設計課, 自動化設備課], note: 現場人員：可看機密圖紙}
  sales:     {domains: [art, mfg, factory], levels: [公開, 內部], dept: 業務課, depts: [生產技術課, 機械設計課, 自動化設備課], note: 業務：看不到機密圖紙}
  planner:   {domains: [art, mfg, factory], levels: [公開, 內部, 機密], dept: 生產管理課, depts: [生產技術課, 機械設計課, 自動化設備課], note: 生管：全廠}
  manager:   {domains: [art, mfg, factory], levels: [公開, 內部, 機密], dept: 廠長室, depts: [生產技術課, 機械設計課, 自動化設備課], note: 主管：全廠}

domains:
  art: 畫作
  mfg: 工廠圖紙
  factory: 工廠資料庫

# 每種操作開放修改的欄位（其他欄位一律不開放，例如訂單的已出貨數量）
fields:
  stock_adjust: [qty]
  stock_transfer: [warehouse_id, qty]
  stock_scrap: [qty]
  stock_status: [status]
  so_update: [due_on, qty]
  wo_create: [work_order]
  wo_update_due: [due_on]
  wo_cancel: [status]

# 硬性上限：直接拒絕，主管也不能核准
hard_limits:
  max_rows: 5              # 單次影響的庫存列數
  # 另外三條寫在程式裡：庫存不能變成負數、訂購數量不能少於已出貨、零件主檔與機台資料不開放

# 額度：超過就送主管核准（初值，可調）
quotas:
  stock_adjust: {max_qty: 20, max_ratio: 0.20}   # 盤點差異超過 20 件或 20%
  stock_scrap: {max_qty: 10}                      # 報廢超過 10 件
  stock_transfer: {max_qty: 50}                   # 調撥超過 50 件
  so_update: {max_delay_days: 7, qty_decrease: true}  # 交期延後超過 7 天；訂購數量減少
  wo_create: {rush: true}                         # 急件工單
  wo_cancel: {in_progress: true}                  # 取消已在生產中的工單

approval:
  expire_hours: 24         # 超過 24 小時沒人處理就自動失效（make demo-reset 也會清掉）
  pending_ttl_min: 15      # 確認卡的有效時間：超過就要重新試算
