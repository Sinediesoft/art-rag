# 模型、向量索引與 prompt 的唯一設定來源（共用層 §三，負責：C）
# 程式只從這裡讀；換 embedding 模型 = 全量重建索引並重跑評估，先在週會宣告。

embeddings:
  image:                      # 以圖搜圖、以文搜圖（影像–文字共同空間）
    name: OFA-Sys/chinese-clip-vit-base-patch16
    revision: 36e679e65c2a2fead755ae21162091293ad37834
    dim: 512
    distance: cosine
    normalize: true
    dtype: float32            # 一律 fp32，確保不同機器結果一致
  text:                       # 知識段落檢索
    name: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    dim: 1024
    distance: cosine
    normalize: true
    dtype: float32
    max_length: 512

chunking:                     # 改了就要重建索引
  min_chars: 300
  max_chars: 500
  overlap_chars: 50

retrieval:
  # 以圖搜圖兩階段：Chinese-CLIP 粗篩 → ORB 幾何驗證（見 docs/adr/002）
  # 兩個條件都要過才算「辨識成功」，否則一律回覆「知識庫中沒有這幅畫」；數值由 eval 校正
  # 同一位畫家的別版、習作、同系列（make eval-versions，2026-10-04）：CLIP 全部過門檻（最高 0.968），
  # 靠幾何驗證擋下（inlier ≤ 10）；所以要防認錯別版只能調 verify_min_inliers，調 image_threshold 沒用
  # 觀眾實拍照（make eval-met-photos，2026-10-05，The Met Dataset，評估用知識庫 2,467 幅）：認錯 0、未收錄被認錯 0；
  # 一般觀眾的照片認對 71%（知識庫 3 幅時 86%，其餘是 ORB 對不上）。image_threshold 0.5–0.7 結果一樣。
  # 知識庫上百幅以後 CLIP 會把正解排到前 3 名外（2,467 幅時前 3 名只剩 79%），verify_top_n 要調到 10–20
  # （有下面的退化 homography 檢查，調大時 verify_min_inliers 不用跟著提高）
  image_threshold: 0.70       # 第一階段 CLIP 相似度下限
  verify_top_n: 3             # 對 CLIP 前 N 名做幾何驗證（可以比 top_k_search 大，多的也會驗）
  # RANSAC inlier 數下限：同一幅畫實測 ≥ 57，不同畫作 ≤ 7，別版 ≤ 10；真實照片的錯誤配對加檢查後最多 19
  # （照〈兩姊妹〉做的版畫，是真的複製品），所以不降
  verify_min_inliers: 20
  # 退化的 homography 不算對上（ADR 002「退化的 homography」）：觀眾照片畫框上一排重複花紋被對成參考圖的一點、
  # 鏡像或強烈透視，不相干的畫也能對上 65–79 個 inlier。三個條件都要過；圖紙另有一套（verify._plausible）。
  # 由觀眾實拍照的配對（inlier ≥ 20）校正：正確 310 對 det 第 5 百分位 0.16、透視項第 95 百分位 0.0011、
  # 分布第 5 百分位 0.029；錯誤 13 對全部擋下，正確少 5 對（都是研究團隊大角度斜拍的 500 px 照片）。
  # 加上後重跑：各種知識庫大小與 verify_top_n 都 0 認錯（之前最多 0.6%），一般觀眾的原圖認對一張沒少
  verify_min_det: 0.02        # H 左上 2×2 的行列式下限（≤ 0 是鏡像，≈ 0 是壓成一點或一條線；站遠拍的正確配對可到 100 以上，不設上限）
  verify_max_persp: 0.002     # 透視項 |h31|、|h32| 上限（原始座標：照片解析度越低數字越大，上傳照片縮到 1024）
  verify_min_spread: 0.01     # inlier 在知識庫圖上的分布（標準差占寬、高的比例，取小的）下限
  top_k_search: 5
  # 問答檢索段落規則：相似度門檻＋最多 top_k_chunks 段，不硬湊滿
  # 保留條件：score ≥ min_chunk_score 且 score ≥ 第一名 × relative_chunk_ratio；
  # 已指定畫作時至少保留該畫作最相關的 1 段。數值由 eval 校正（實測第一名多在 0.38–0.78）
  top_k_chunks: 5
  min_chunk_score: 0.30
  relative_chunk_ratio: 0.6
  preprocess_long_edge: 1024

# 工廠圖紙的以圖搜圖：圖紙在 CLIP 眼中都很像（白底黑線，相似度 0.7–0.98），主要靠後兩關：
# ORB 幾何驗證（知識庫圖紙只取三視圖區的特徵點、排除退化 homography）＋拉正後的線條重合度。
# 數值由 eval/drawing_photos 校正：同圖紙重合度 ≥ 0.60、不同圖紙（inlier ≥ 25 者）≤ 0.48
drawing_retrieval:
  image_threshold: 0.60
  verify_top_n: 8             # 圖紙數量少，前 8 名都驗
  verify_min_inliers: 25
  verify_min_overlap: 0.55
  top_k_search: 5

# 領域路由（MMed-RAG 的領域辨識，見 docs/adr/007）：只給照片、沒指定領域時，先判斷是畫作還是工廠圖紙，
# 再交給該領域的辨識流程。margin＝照片與「圖紙原型」的相似度 − 與「畫作原型」的相似度，
# 原型＝知識庫圖片 CLIP 向量的平均（索引裡的 image_vecs，重建索引自動更新，不用訓練）。
# 實測 95 張評估照片：畫作 margin ≤ −0.28、圖紙 ≥ +0.14；|margin| < min_margin 視為不確定，一律當圖紙（機密側）
router:
  min_margin: 0.05

# 畫作色彩分析（見 docs/adr/010）：建索引時對知識庫畫作計算（結果放進畫作資料與「色彩分析」段落），
# 上傳的照片即時計算。CIELAB 空間 k-means 取主色；冷暖、明度、彩度逐像素統計。
# 分界值以 5 幅畫（kb 3 幅＋kb_staging 2 幅）校正。改了任何一項都要重建索引（manifest 比對，對不上拒絕啟動）
color_analysis:
  method: lab-kmeans-v1
  n_colors: 6
  fit_long_edge: 256
  map_long_edge: 512
  kmeans_max_iter: 30
  seed: 0
  neutral_chroma: 10
  warm_hue_deg: [340, 110]    # 跨 0°：紫紅、紅、橙、黃為暖；其餘有彩色為冷
  lightness_bands: [30, 60]
  chroma_bands: [10, 25]

# 畫作卡推測（借鑒 ArtSeek 的 LICN 畫作卡，見 docs/adr/018）：以圖搜圖辨識失敗（知識庫沒有這幅畫）時，
# 用同一個 Chinese-CLIP 零樣本比對照片與下面的標籤，推測風格大類（含年代）、題材、媒材。不用訓練、不載入新模型；
# 標籤向量＝每個標籤的別名 × 提示句平均（prompt ensembling），機率＝softmax(temperature × 餘弦相似度)。
# 只是推測、沒有出處：不寫進知識庫、不放進問答的 prompt。不影響索引，改了不用重建。
# 數值由 make eval-style 校正（2026-10-04：知識庫內外 10 幅原圖＋25 張模擬照）：
# 細分流派分不清印象派／新印象派／後印象派（「新印象派」幾乎每張都進前三），但多半錯在同一大類裡，
# 所以風格以大類為主（細分第一名所屬的那一類；不比各類加總，流派多的「現代藝術」會靠長尾贏）、細分只當參考
# 2026-10-04 再以 make eval-style-met（大都會開放 API 的 340 幅畫＋215 件雕塑、陶瓷、器物、老照片）校正把關與媒材
style_guess:
  method: clip-zeroshot-v1
  temperature: 100            # Chinese-CLIP 的 logit_scale（exp(4.6052)≈100）
  # 「像畫作」把關：畫作原圖與模擬照 ≥ 0.77，圖紙照片、文字文件 ≤ 0.06，純灰圖 0.47；低於就不推測。
  # 大都會評估集：painting_min 0.5–0.7 之間畫作通過數只差 10 幅以內、器物擋下數幾乎不變，0.6 照舊
  painting_min: 0.6
  painting_prompts: [一幅畫, 一件繪畫作品, 一幅油畫, 一幅中國畫, 一幅版畫]
  # 後 4 句是大都會評估集補的。沒有時歐洲雕塑 26/30 被當成畫、器物只擋下 148/190、老照片擋下 14/25；
  # 加「雕塑、陶瓷器物、古代器物」→ 器物擋下 184/190，畫作通過 323 → 315（少的是 2 幅金底蛋彩畫、2 幅肖像微型畫、
  # 4 幅油畫，其中 1 幅是壁龕花瓶的錯視畫）；再加「老照片」→ 老照片擋下 18 → 22/25，畫作 315 → 312（3 幅都是肖像微型畫）。
  # 加「工藝品」會連畫一起擋（畫作 323 → 292），沒採用
  other_prompts: [一張生活照片, 一張螢幕截圖, 一份文字文件, 一張工程圖紙, 一張商品照片, 一張自拍照, 一件雕塑, 一件陶瓷器物, 一件古代器物, 一張老照片]
  # 每一欄第一名（風格看大類）的機率低於這個就標「看不太出來」。大都會評估集（0.4 → 0.5 → 0.6，留下的正確率）：
  # 題材 80 → 81 → 84%、歐洲繪畫大類和年代 77 → 78 → 78%，只有媒材 76 → 82 → 87%；
  # 但 0.6 時媒材有 38%、大類年代有 44% 的欄位變成看不太出來（錯誤多半是有信心的系統性混淆），所以 0.4 照舊。
  # 媒材之後改用線性分類頭（下方 head，每種媒材各自的門檻），min_confidence 只管風格與題材
  min_confidence: 0.4
  style:
    templates: ["一幅{}", "一幅{}作品", "這是一幅{}", "{}的畫"]
    # 大類（顯示名稱＋年代）→ 細分流派 → 別名（只用來算標籤向量，不顯示；附代表畫家讓描述具體一點）
    groups:
      - name: 文藝復興
        period: 14–16 世紀
        labels:
          文藝復興: [文藝復興, 文藝復興時期的義大利繪畫]
          北方文藝復興: [北方文藝復興, 法蘭德斯的文藝復興繪畫]
      - name: 巴洛克與洛可可
        period: 17–18 世紀
        labels:
          巴洛克: [巴洛克, 林布蘭、卡拉瓦喬的巴洛克繪畫]
          洛可可: [洛可可, 華麗的洛可可宮廷繪畫]
      - name: 新古典、浪漫與寫實主義
        period: 18 世紀末–19 世紀中
        labels:
          新古典主義: [新古典主義, 大衛、安格爾的新古典主義]
          浪漫主義: [浪漫主義, 德拉克洛瓦、泰納的浪漫主義]
          寫實主義: [寫實主義, 庫爾貝、米勒的寫實主義]
      - name: 印象派一脈
        period: 19 世紀後期
        labels:
          印象派: [印象派, 莫內、雷諾瓦的印象派]
          新印象派: [新印象派, 秀拉、席涅克的點描畫]
          後印象派: [後印象派, 梵谷、塞尚、高更的後印象派]
      - name: 現代藝術
        period: 20 世紀
        labels:
          表現主義: [表現主義, 孟克的表現主義]
          野獸派: [野獸派, 馬諦斯的野獸派]
          立體派: [立體派, 畢卡索的立體派]
          超現實主義: [超現實主義, 達利、馬格利特的超現實主義]
          抽象藝術: [抽象藝術, 康丁斯基、蒙德里安的抽象畫]
          普普藝術: [普普藝術, 安迪沃荷的普普藝術]
      - name: 日本浮世繪
        period: 17–19 世紀（江戶時代）
        labels:
          浮世繪: [浮世繪, 葛飾北齋、歌川廣重的浮世繪]
      - name: 中國傳統繪畫
        period: 宋元明清
        labels:
          中國傳統繪畫: [中國傳統繪畫, 宋元明清的中國古畫]
  genre:
    templates: ["一幅{}作品", "這是一幅{}", "{}的畫"]
    labels:
      肖像畫: [肖像畫, 人物肖像]
      風俗畫: [風俗畫, 日常生活場景, 人物群像]
      風景畫: [風景畫, 自然風景]
      山水畫: [山水畫, 中國山水]
      海景畫: [海景畫, 海浪與船]
      城市街景: [城市街景, 街道風景]
      室內畫: [室內景, 房間內部]
      靜物畫: [靜物畫, 瓶花與水果]
      宗教畫: [宗教畫, 聖經故事]
      歷史神話畫: [歷史畫, 神話故事]
      花鳥畫: [花鳥畫]
      抽象畫: [抽象畫]
  # 大都會評估集（有媒材正解的 305 幅，不論有沒有過把關）媒材第一名 214/305：最大的錯是老油畫、蛋彩畫被判成濕壁畫（37 幅）。
  # 濕壁畫拿掉太籠統的別名「壁畫」→ 225/305，原圖與模擬照不變；其餘的錯是油畫／蛋彩畫互混、有筆觸的油畫像木刻版畫
  media:
    templates: ["一幅{}"]
    labels:
      油畫: [油畫, 油彩畫布]
      水彩畫: [水彩畫]
      水墨畫: [水墨畫, 絹本水墨]
      木刻版畫: [木刻版畫, 版畫]
      濕壁畫: [濕壁畫]
      蛋彩畫: [蛋彩畫]
      素描: [素描, 鉛筆素描]
      粉彩畫: [粉彩畫]
  # 線性分類頭（ADR 018「線性分類頭」，Q-2026-10-04-04 第 3 項）：fields 列的欄位改用 make style-head
  # （pipelines/train_style_head.py）以大都會館藏訓練的多標籤分類頭（eval/met_train.json 2,010 幅，和評估集不重疊）：
  # 每個標籤各自 sigmoid、各自的門檻（依 F0.5 調，偏重準確），可以同時列出兩種；沒列的欄位照舊零樣本，上面的媒材標籤留著當備援。
  # 2026-10-04 媒材第一名（零樣本 → 分類頭）：大都會評估集 225 → 296/305、做成模擬照 240 → 290/305、
  # 自己的原圖 9 → 9/10、模擬照 22 → 25/25；錯了卻沒標「看不太出來」71 → 5。
  # 題材沒採用：館方沒有「風俗畫」「城市街景」標籤學不到，中國山水又被排成「風景畫」，自己的 35 張從 35 → 18 對。
  # 檔案綁定 Chinese-CLIP 的版本：換了模型要重跑 make style-head；檔案不在或版本不符就照舊零樣本（記警告）
  head:
    path: shared/style_head_v1.npz
    fields: [media]

# 影像對位與比對（見 docs/adr/012）：以圖搜圖辨識成功後，標出照片拍到參考圖（知識庫原圖、圖紙）的哪一塊，再找不同：
# 畫作比形狀與顏色（tone）；圖紙拉正比對三視圖線條（ink），找出「標準圖有、照片沒有」與「照片有、標準圖沒有」的地方。
# 對應點下限沿用各領域辨識的 verify_min_inliers（辨識過了就對得上）。不影響索引，改了不用重建。
# 圖紙的數值由 make eval-align 校正（模擬照：沒改的圖紙不該有差異、注入的改動都要找到）
image_compare:
  # 觀眾照片 vs 知識庫原圖（畫作，ADR 012 第 4 步）：和 pair 同一個比法，顏色門檻較高（拍照的光線和數位原圖不同）。
  # 數值由 make eval-align 校正（2026-10-02：形狀門檻降到 0.12 起沒改過的照片開始冒出假差異；
  # 顏色 8 時動過手腳的照片在別處多報 2 處，10 和 12 相近、取 12 留餘裕；反光的照片仍會標成「顏色不同」）
  art:
    diff: tone
    work_long_edge: 512
    shape_threshold: 0.18
    color_threshold: 12
    min_region_frac: 0.001    # 一處差異至少占比對範圍的 0.1%（細的筆畫）
    edge_margin_px: 10        # 原圖最外圈（工作大小）不比：整幅掛牆拍時畫的邊緣會混到牆面
    max_changed_ratio: 0.3
  mfg:
    diff: ink
    tolerance_px: 3           # 線條差幾 px 以內算同一條（拉正誤差）
    min_region_px: 30         # 一處差異至少幾個像素（40 時漏掉擦掉 30 px 的細尺寸線；24 起舊模擬照多 1 處假差異）
    merge_px: 9               # 差異像素膨脹後再找連通區塊
    merge_gap_px: 24          # 區塊相距這麼近就併成一處（同一個改動的幾條線）
    edge_margin_px: 12        # 圖紙最外圈不比：照片裡紙張的邊緣拉正後會落在這裡
    max_changed_ratio: 0.25   # 差異超過圖紙線條的 25% → 整體變了：三視圖依外形縮放，改了外形尺寸整張都會不同
  # 兩張照片互比（畫作，ADR 012 第 3 步）：照片 B 對齊到照片 A 後比形狀（SSIM）與顏色（Lab 色差）。
  # 只在兩張同光線拍時可靠；數值由 make eval-align 的成對照片校正（2026-10-02：顏色再低一格、
  # 最小區塊 0.1% 以下，沒改過的照片就開始冒出假差異；長邊 768 比 512 多假差異。
  # 第 4 步加了微調對位、容許 1 px 錯開之後，差異區塊變小，最小區塊從 0.2% 降到 0.1%；形狀門檻 0.15–0.2 結果相同，和 art 一起用 0.18）
  pair:
    diff: tone
    work_long_edge: 512       # 在這個大小比
    shape_threshold: 0.18     # (1 − SSIM) / 2 高於這個值算形狀不同
    color_threshold: 8        # 整體明暗、白平衡拉齊之後的 Lab 色差（ΔE76）
    min_region_frac: 0.001    # 一處差異至少占比對範圍的 0.1%
    edge_margin_px: 10        # 照片 A 最外圈（工作大小）不比
    max_changed_ratio: 0.3    # 差異超過比對範圍的 30% → 光線差太多或拍的不是同一處

# 照片建檔（見 docs/adr/013）：
# - 圖紙（mfg）：本地 Qwen3-VL 依欄位提示讀標題欄與外形尺寸（JSON schema 限制輸出）→ 規則驗證（格式、和知識庫重複、
#   材料依牌號校正並補密度）→ 人確認；
# - 畫作（art）：拍畫作本身，不讀展牌（館方解說有著作權、也沒有統一版面），資料由人在跳出的表單填；
# → 主管收錄寫進 kb/ → 重建索引。換領域＝換一份欄位設定。不影響索引，改了不用重建。
# 模型看不清楚時不會填 null 而是編（模糊照 30/49 格是編的），所以兩個領域都先擋模糊照
intake:
  prompt_version: intake_v1   # 對應 shared/prompts/intake_v1.md
  max_tokens: 300             # 10 個欄位的 JSON 約 110 token
  # 模糊程度（重新模糊法，0 清楚～1 模糊），高於就請重拍。2026-10-03 模擬照：模糊 0.345–0.448；
  # 其他拍法與知識庫原圖：畫作 ≤ 0.265、圖紙 ≤ 0.143。拉普拉斯變異數在畫作上分不開（低對比的水墨清楚照只有 125）
  max_blur: 0.30
  page_size: [800, 970]       # 知識庫圖紙的版面：拉正後縮成這個大小
  page_aspect_tol: 0.08       # 找到的紙張長寬比和版面差超過 8% 就請重拍（不是同一種版面，或沒拍到整張）
  mfg:
    id_prefix: mfg
    fields:                   # read＝從照片讀（hint 是給模型的位置說明）；pattern 是這座工廠的編號格式
      company: {label: 公司, hint: 標題欄左欄最上面一行的公司名稱}
      name: {label: 品名, hint: 標題欄左欄中間最大的字}
      part_no: {label: 料號, hint: 標題欄「料號」格, pattern: '[A-Z]{2,4}-\d{3,5}'}
      drawing_no: {label: 圖號, hint: 標題欄「圖號」格, pattern: '[A-Z]-\d{2}-\d{4}'}
      revision: {label: 版次, hint: 標題欄「版次」格, pattern: '[A-Z0-9]{1,3}'}
      material: {label: 材料, hint: 標題欄「材料」格，牌號加名稱（例如 S45C 中碳鋼）}
      confidentiality: {label: 機密等級, hint: 標題欄左下角「機密等級：」後面的字, kind: enum}
      width: {label: 寬（mm）, hint: 俯視圖（Top View）正下方的水平尺寸, kind: number, min: 0.1, max: 5000}
      depth: {label: 深（mm）, hint: 俯視圖（Top View）右側的垂直尺寸, kind: number, min: 0.1, max: 5000}
      height: {label: 高（mm）, hint: 前視圖（Front View）右側的垂直尺寸, kind: number, min: 0.1, max: 5000}
      density_g_cm3: {label: 密度（g/cm³）, read: false, kind: number, min: 0.5, max: 25}
      category: {label: 類別, read: false}
      owner: {label: 負責單位, read: false}
      surface: {label: 表面處理, read: false, required: false}
      name_en: {label: 英文品名, read: false, required: false}
  art:
    id_prefix: photo          # 知識庫 ID 的來源代碼：典藏單位對不到既有畫作時的預設
    fields:                   # 全部由人在跳出的表單填（read: false）；group 是表單分區，hint 是輸入提示
      title: {label: 畫名, read: false, group: 基本資料, hint: 例如：早春圖}
      title_en: {label: 英文畫名, read: false, required: false, group: 基本資料}
      artist: {label: 作者, read: false, group: 基本資料, hint: 例如：郭熙}
      artist_en: {label: 作者英文名, read: false, required: false, group: 基本資料}
      date_text: {label: 年代, read: false, group: 基本資料, hint: 例如：北宋 1072 年}
      medium: {label: 材質, read: false, required: false, group: 基本資料, hint: 例如：絹本 水墨淡設色}
      dimensions: {label: 尺寸, read: false, required: false, group: 基本資料, hint: 例如：158.3 × 108.1 cm}
      style_tags: {label: 風格標籤, read: false, required: false, group: 基本資料, hint: 用頓號或逗號分隔}
      collection: {label: 典藏單位, read: false, group: 典藏與授權}
      source_id: {label: 館藏編號, read: false, required: false, group: 典藏與授權}
      source_url: {label: 典藏頁網址, read: false, kind: url, group: 典藏與授權, hint: 館方的作品頁（資料出處）}
      image_license: {label: 照片授權, read: false, kind: enum, group: 典藏與授權}
      image_attribution: {label: 照片標示文字, read: false, required: false, group: 典藏與授權, hint: 授權是 CC BY 4.0 時必填}
      description: {label: 介紹, read: false, required: false, kind: longtext, group: 介紹（選填）, hint: 至少 20 字；沒填就由系統依上面的欄位寫一段「基本資料」}
      description_source_url: {label: 介紹出處網址, read: false, required: false, kind: url, group: 介紹（選填）}
      description_license: {label: 介紹授權, read: false, required: false, kind: enum, group: 介紹（選填）, hint: 只收 CC0、公有領域、CC BY 4.0}
      description_attribution: {label: 介紹標示文字, read: false, required: false, group: 介紹（選填）, hint: 授權是 CC BY 4.0 時必填}
      id_code: {label: 來源代碼, read: false, pattern: '[a-z]+', group: 知識庫 ID, hint: 小寫英文；典藏單位是知識庫已有的就自動帶入（例如 npm）}
      id_no: {label: 編號, read: false, pattern: '[a-z0-9]+', group: 知識庫 ID, hint: 小寫英數字；預設取館藏編號}

# 批次辨識、兩件並排比較、問答匯出報告（見 docs/adr/017）：三個工具都不加新模型。
# - 批次辨識：每張照片走以圖搜圖同一套（領域路由＋該領域辨識），模糊門檻沿用 intake.max_blur；
# - 兩件並排比較：表格直接讀知識庫，不呼叫模型；差異摘要（選用）只走本地生成端，每件放幾段知識段落；
# - 問答匯出報告在前端組，不需要設定。不影響索引，改了不用重建。
batch:
  max_images: 100             # 一批最多幾張（每張約 0.6 秒）
item_compare:
  prompt_version: compare_v1  # 對應 shared/prompts/compare_v1.md
  max_tokens: 400
  chunks_per_item: 3

# 檢索段落篩選（MIRA 的 Rearrange，見 docs/adr/008）：依 retrieval 的規則取出候選段落後，
# 再請本地生成端判斷哪幾段對回答有幫助，只留挑中的（至少 1 段）。只呼叫本地模型、不送雲端；
# 逾時、連不上或輸出看不懂時退回原本的段落，不擋回答。
# 2026-10-03 起預設開（五段防護第 4 段：不送 Jev 的內部、機密段落由本地 Qwen3-VL 挑，其他頁面的問答也一起）；
# GTX 1650 每題約多 3–6 秒。各主機可用 .env 的 REARRANGE 覆寫，請求也可用 rearrange 指定。
rearrange:
  enabled: true
  prompt_version: rearrange_v2  # 對應 shared/prompts/rearrange_v2.md（v2：矛盾的段落一起留下，ADR 020）
  max_candidates: 5             # 最多交給模型判斷幾段
  timeout_s: 30                 # 篩選整體的時間上限，超過就用原本的段落
  max_tokens: 16                # 模型只需要輸出段落編號

# 問答要不要附圖（Issue #2、docs/adr/024）：已辨識（或已指定）畫作／圖紙、檢索也開著時，答案來自段落與作品卡，
# 圖只是補充；不送可以省約 1,070 token，4 GB 顯卡上明顯變快。關檢索的對照組照樣送圖（檢索增益靠它量）。
# 預設 true＝和原本相同。各主機用 .env 的 SEND_IMAGE 覆寫（例如 GTX 1650 設 false），請求也可用 send_image 指定
chat:
  send_image: true

# 已指定畫作時只取該畫作的段落；問題含下列字詞（比較、背景類）才從全庫補足
global_fill_keywords: [比較, 相比, 差異, 異同, 不同, 並稱, 其他作品, 同時代, 背景, 影響]

prompt:
  version: answer_v2          # 對應 shared/prompts/answer_v2.md（v2：參考資料矛盾時要指出，ADR 020）
  drawing_version: drawing_v2 # 工廠圖紙問答，對應 shared/prompts/drawing_v2.md（v2：參考資料矛盾時要指出，ADR 020）
  sql_version: sql_v2         # 工廠資料庫 Text-to-SQL：問題 → SQL（sql_v2.md＋sql_v2_examples.json；v2 加入機台與生產排程）
  sql_answer_version: sql_answer_v2  # 依查詢結果回答（sql_answer_v2.md；v2 只在要求修改時才提，並改指向智慧助理）
  # 照片建檔讀標題欄的提示詞版本在 intake.prompt_version（intake_v1.md）

# 工廠庫存 Text-to-SQL：沿用 hybrid 生成端（本地 Qwen3-VL，失敗改走本地備援），不另外載入模型。
# 庫存屬企業內部資料，雲端策略一律拒絕；SQL 只在唯讀連線＋白名單下執行（docs/adr/004）
text2sql:
  max_tokens: 400             # 產生 SQL 的上限
  answer_max_tokens: 300      # 依結果回答的上限
  temperature: 0
  max_repairs: 2              # SQL 執行失敗時，把錯誤訊息回饋給模型修正的次數
  max_rows: 200               # 回傳前端的列數上限（超過標示「只顯示前 N 筆」）
  prompt_rows: 30             # 放進回答 prompt 的列數上限
  exec_timeout_ms: 2000       # 單次查詢執行上限

# 生產排程：Timefold Solver（scheduler/，Java 21）排工序到機台；不用任何 AI 模型（docs/adr/005）
scheduling:
  solve_seconds: 20           # 預設求解時間（前端可選 10／20／30 秒）
  max_seconds: 60
  unimproved_seconds: 8       # 連續這麼久沒找到更好的解就提前結束
  poll_ms: 400                # 後端向排程服務取進度的間隔

# 工廠圖紙 → 3D：Ortho2CAD（arXiv 2607.08891，Qwen3-VL-8B 微調）輸出 CadQuery 程式碼
cad:
  # 與論文推論腳本相同的指令；baseline_suffix 是論文給未微調模型（對照組）加的一句
  prompt: "Generate the CADQuery code needed to create the CAD for the provided image. Just the code, no other words."
  baseline_suffix: " Assign the final solid to the variable 'solid' in the last line of code. Do not export or visualize the solid."
  max_pixels: 50176           # 訓練時的 max_pixels（800×800 圖紙 → 224×224）；改了會和訓練分布不同
  max_tokens: 4096
  temperature: 0
  exec_timeout_s: 60          # 產生的程式碼在沙箱中的執行上限

generation:
  temperature: 0              # 評估時固定 0
  max_tokens: 800

# 生成端：各策略共用檢索與 prompt，只換這裡的 provider。
# 連線位址與金鑰不寫在這裡，放 .env（HYBRID_* / HYBRID_FALLBACK_* / API_* / LORA_*）。
# 雲端（api_nokb／api_kb）只當對照組：ALLOW_CLOUD=false 時停用，也永遠不當備援。
strategies:
  hybrid:
    label: 混合式（本地 VLM）
    default_model: qwen3-vl:4b-instruct   # 5070 Ti 主機改 qwen3-vl:8b-instruct
    cost_per_1k_input_twd: 0
    cost_per_1k_output_twd: 0
  hybrid_fallback:
    label: 本地備援模型
    default_model: qwen3-vl:4b-instruct   # 主力為 8B 時的降級模型；也可指向 Mac 備用機
    cost_per_1k_input_twd: 0
    cost_per_1k_output_twd: 0
  api_nokb:
    label: 雲端 API・無檢索（A1 對照組）
    default_model: gemini-2.5-flash
    cost_per_1k_input_twd: 0.0096        # 以 US$0.30 / 1M 輸入、US$2.50 / 1M 輸出、匯率 32 估算
    cost_per_1k_output_twd: 0.08
  api_kb:
    label: 雲端 API＋檢索（A2 對照組）
    default_model: gemini-2.5-flash
    cost_per_1k_input_twd: 0.0096
    cost_per_1k_output_twd: 0.08
  ortho2cad:
    label: Ortho2CAD（本地，三視圖→CadQuery）
    default_model: ortho2cad              # llama-server --alias；Q4_K_M 約 5 GB＋mmproj 1.2 GB
    cost_per_1k_input_twd: 0
    cost_per_1k_output_twd: 0
  lora:
    label: 本地 LoRA（選做）
    default_model: qwen3-vl-art-lora:4b
    cost_per_1k_input_twd: 0
    cost_per_1k_output_twd: 0
