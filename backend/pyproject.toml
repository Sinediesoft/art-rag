[project]
name = "art-rag-backend"
version = "0.1.0"
description = "畫語 ArtRAG 後端：FastAPI + 多模態 RAG"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "pillow>=10.4",
    "torch>=2.7",
    "transformers>=4.45",
    "httpx>=0.27",
    "opencc-python-reimplemented>=0.1.7",
    "jsonschema>=4.23",
    "opencv-python-headless>=5.0.0.93",
    "cadquery>=2.5",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
