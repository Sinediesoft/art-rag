; LoRA 不檢索對照組（docs/adr/043）的 llama-server 設定（router 模式，make -C pipelines/lora serve）。
; 三組評估都接這一個 llama-server :8081，只差模型別名：
;   art-base：hybrid、hybrid_norag（HYBRID_MODEL=art-base）
;   art-lora：lora_norag（LORA_MODEL=art-lora）
; 兩個模型都是 Qwen3-VL-4B-Instruct 經同一條轉檔流程的 Q4_K_M，影像編碼器共用官方 mmproj，參數完全相同。
; --models-max 2：兩個都留在記憶體（各約 4.8 GB）。第 2 段在 Jev 關掉時會先問 art-base，
; 只留一個的話每題 lora_norag 都要換兩次模型，延遲會算到載入時間。路徑相對於 repo 根目錄。
; 和 Ortho2CAD（deploy/llama-router.ini）同一個埠，兩者不同時執行。
version = 1

[art-base]
model = models/lora/gguf/art-base-q4_k_m.gguf
mmproj = models/lora/gguf/mmproj-Qwen3VL-4B-Instruct-F16.gguf
; 圖約 700–1,000 token＋檢索段落＋generation.max_tokens 800
c = 8192
fa = on
np = 1
load-on-startup = false

[art-lora]
model = models/lora/gguf/art-lora-q4_k_m.gguf
mmproj = models/lora/gguf/mmproj-Qwen3VL-4B-Instruct-F16.gguf
c = 8192
fa = on
np = 1
load-on-startup = false
