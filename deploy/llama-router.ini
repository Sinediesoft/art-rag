; Ortho2CAD 的 llama-server 設定（router 模式，make ortho2cad 使用）
; router 模式下模型按需載入：第一次 3D 重建時自動載入（約 5–10 秒），
; 記憶體吃緊時後端呼叫 POST /models/unload 卸載（services/memory_guard.py），下次用到再自動載入。
; 參數與原本的單一模型模式相同，產生的程式碼逐字一致（2026-10-01 以〈連接法蘭〉核對）。
; 路徑相對於啟動時的目錄（repo 根目錄）。
version = 1

[ortho2cad]
model = models/ortho2cad/ortho2cad-qwen3vl-8b-q4_k_m.gguf
mmproj = models/ortho2cad/mmproj-ortho2cad-f16.gguf
; 圖片 token 上限 64：訓練時 max_pixels=50176（224×224 → 49 個 token），後端會先縮到這個大小
image-min-tokens = 16
image-max-tokens = 64
; prompt 約 90 token＋cad.max_tokens 4096；KV cache 用 q8_0，16 GB 的 Mac 才放得下兩個 VLM
c = 4608
fa = on
ctk = q8_0
ctv = q8_0
np = 1
cram = 0
load-on-startup = false
